<script>/* 文章の組み合わせエンジン。
   {a|b|c} で言い換え（入れ子OK）、$name で状況に応じた語を差し込む。
   ・expand() … 1つ選んで文章にする
   ・count()  … 何通りあるかを数える
   ブラウザにもそのまま載せるので、依存は持たない。                     */
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.VARI = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- 解析 ---------- */
  function parse(str) {
    var pos = 0;
    function seq(stop) {
      var items = [], buf = '';
      function flush() { if (buf) { items.push({ t: 'lit', v: buf }); buf = ''; } }
      while (pos < str.length) {
        var ch = str[pos];
        if (stop && (ch === '|' || ch === '}')) break;
        if (ch === '{') { pos++; flush(); items.push(alt()); continue; }
        if (ch === '$') {
          var m = /^\$([a-zA-Z_][a-zA-Z0-9_]*)/.exec(str.slice(pos));
          if (m) { pos += m[0].length; flush(); items.push({ t: 'var', v: m[1] }); continue; }
        }
        buf += ch; pos++;
      }
      flush();
      return { t: 'seq', v: items };
    }
    function alt() {
      var opts = [seq(true)];
      while (str[pos] === '|') { pos++; opts.push(seq(true)); }
      if (str[pos] === '}') pos++;
      return { t: 'alt', v: opts };
    }
    return seq(false);
  }

  /* ---------- 数える ---------- */
  function count(node, vars) {
    if (typeof node === 'string') node = parse(node);
    switch (node.t) {
      case 'lit': return 1;
      case 'var': return (vars && vars[node.v]) || 1;
      case 'seq': return node.v.reduce(function (a, n) { return a * count(n, vars); }, 1);
      case 'alt': return node.v.reduce(function (a, n) { return a + count(n, vars); }, 0);
    }
    return 1;
  }

  /* ---------- 1つ選ぶ ---------- */
  function expand(node, ctx, rnd) {
    rnd = rnd || Math.random;
    if (typeof node === 'string') node = parse(node);
    switch (node.t) {
      case 'lit': return node.v;
      case 'var':
        var f = ctx && ctx[node.v];
        return typeof f === 'function' ? f() : (f == null ? '' : String(f));
      case 'seq': return node.v.map(function (n) { return expand(n, ctx, rnd); }).join('');
      case 'alt': return expand(node.v[Math.floor(rnd() * node.v.length)], ctx, rnd);
    }
    return '';
  }

  return { parse: parse, count: count, expand: expand };
});

/* ダンジョンの設定。
   open … プレイヤーに開示する。クエスト選択の画面に出る
   hush … 裏設定。プレイヤーには見せないが、語彙・出来事・敵の傾向を決める
   V    … 語彙。同じ出来事の文でも、ここが差し替わることで別の場所に読める
   tags … この場所に出しうる出来事の種類
   mix  … 出来事の出やすさ（罠・敵・宝・人）                            */

      + '樵が二人、羊を追った子どもが一人、戻っていない。'
      + '中にあるのは獣と、洞そのものの気まぐれだけだ。',
    hush:
      '獣道の崩落でできた自然洞。知性のあるものは棲んでいない。'
      + '罠はすべて自然のもの——落盤、地割れ、澱んだ毒気、抜ける床。'
      + 'だから「仕掛け」の語は使わない。人工物も、文字も、明かりも出てこない。'
      + '奥の主は特別な存在ではなく、単に一番大きく育った個体である。',
    V: {
      place: '{洞|洞窟|岩の裂け目}',
      trace: '{獣の掻き跡|抜け落ちた毛|噛み砕かれた骨}',
      who2:  '{|}',                       // 人はいない
      lord:  '{けもの|一番大きな個体|主}',
      smell: '{獣|濡れた毛|饐えた息}',
      sound: '{遠い唸り|滴る水|自分たちの足音}',
      light: '{松明の輪|手にした灯り}'
    },
    tags: ['nature', 'beast', 'wild'],
    mix: { trap: 3, enemy: 4, loot: 1, human: 0 }
  },

  /* ============ 2. かつて人が住んでいた、罠が多い ============ */
  mine: {
    id: 'mine',
    name: '黙した坑道',
    sub: '住人の絶えた鉱山',
    danger: 2,
    open:
      'かつて三十人が暮らした鉱山の坑道。ある年の冬、住人はひとり残らず姿を消した。'

      + '出てくる死体はほとんどが後から来た盗掘者のほう。'

      + '奥の主は、最初にこの迷宮を攻略しかけて取り込まれた冒険者。',
    V: {

      who2:  '{冒険者|同じ宝を狙う連中|腕自慢}',
      lord:  '{迷宮|仕掛けを組んだ者|最奥の主}',
      smell: '{油|鉄と血|人いきれ}',
      sound: '{遠くで人の声|金属が擦れる音|誰かの短い悲鳴}',
      light: '{松明の輪|壁の燭台の名残}'
    },

    mix: { trap: 4, enemy: 3, loot: 4, human: 3 }
  },

  /* ============ 4. 竜と取り巻きが遺物を護る神域 ============ */
  shrine: {

/* 移動中に流す一言。
   語彙（$place $sound $smell $light $trace $lord）がダンジョンごとに差し替わるので、
   同じ枝を引いても別の場所の文に読める。
   （出来事そのもの＝EVENTS は tools/rpgevents.js 側）                   */

const WALK = {
  /* 通路を抜けるとき */
  corridor:
    '{'
    +   '{$lightの外は|光の届く先は}、{何も見えない|同じ闇が続くだけだ|形を持たない|数歩ぶんしかない}'
    + '|' + '闇は、{どこまでも同じ顔をしている|奥へ行くほど厚い|光を吸っては返さない}'
    + '|' + '通路は{緩く曲がって|わずかに下って|じわじわと上って|一度細くなってから広がって}いる'
    + '|' + '{足元は|床は}{湿っている|乾いて滑る|平らではない|踏むたびに小さく鳴る}'
    + '|' + '{壁は|天井は}{手を伸ばせば届く|思ったより近い|$lightでは端まで届かない}'
    + '}。'
    + '{|{'
    +   '$soundが、{どこかで|背後で|前方で|頭上で}{続いている|一度だけした|止んだ}'
    + '|' + '$smellが{一段濃くなった|さっきより薄い|不意に入れ替わった|鼻の奥に残る}'
    + '|' + '$traceが、{足元に|壁の低いところに|天井の近くに}{続いている|途切れがちに残っている}'
    + '|' + '$who が、{後ろを振り返った|足を止めて耳を澄ませた|何も言わずに先を歩く|数を数え直した}'
    + '|' + '$hurt の{足取りが、少し重い|息が、まだ整っていない|傷が、$lightの下で黒く見える}'
    + '|' + '{誰も口をきかない|自分たちの足音だけが返ってくる|列は、崩れていない}'
    + '}。}',

  /* 名前のない部屋に入ったとき */
  room:
    '{'
    +   '{天井の低い|思ったより広い|四角く区切られた|歪な形の|奥行きだけがある}{部屋|空間|窪み}だ'
    + '|' + '{何もない|使われた跡のない|がらんとした|荒らされた後らしい}{部屋|広間}に出た'
    + '|' + '{$lightが、壁の四隅まで届いた|$lightを回すと、壁は四方にある|$lightの輪に、部屋がすっぽり収まる}'
    + '|' + '{ここは行き止まりではない|出口は、入ってきた側だけではない|道は、まだ続いている}'
    + '}。'
    + '{'
    +   '$traceが、{薄く残っている|床の一隅にだけ残っている|壁を伝って続いている}'
    + '|' + '$smellが{ここだけ溜まっている|ここだけ薄い|$placeの他とは違う}'
    + '|' + '{見るべきものは、何もない|めぼしいものはない|$who が、一通り壁を検めた|'
    +       '$hurt が、隅を覗いて首を振った}'
    + '|' + '$soundが、{ここではよく反響する|ここでは返ってこない|一拍遅れて返る}'
    + '|' + '{$lordの通り道ではなさそうだ|ここまでは、何も来ていないらしい}'
    + '}。'
};


/* キーイベント（解錠イベント）のパターン集。
   ダンジョン生成のときは、まずここから何本か選んで「解錠の連鎖」を組む。
   1つのパターンは5面のテキストを持つ：

     hint    … どこかの石板・日記・古老が教えてくれる「開けかた」
     seed    … 条件を満たせる出来事そのもの（別の部屋に置かれる）
     blocked … まだ開かない状態で、そこに立ったときの語り
     open    … 条件が満たされて開いた瞬間の語り
     again   … 開いたあと、もう一度通るときの短い一言

   語彙は $place $trace $who2 $lord $smell $sound $light（ダンジョン側）と
   $who $hurt（パーティ側）が差し替わる。同じパターンでも別の場所に読める。

   cond … 機械が判定する条件。
     carry  {item}          チームアイテムを持っている
     mark   {key,n}         刻印に n 箇所ふれた
     slay   {who}           特定の相手を倒した
     spare  {scope}         このもぐりで一体も倒していない（run/zone）
     favor  {key}           助ける選択をした
     offer  {item}          捧げた
     lever  {key}           機構を動かした
     word   {key}           合言葉を知っている
     light  {state}         灯りを消している／全部点けた
     hurtless               誰も傷を負わずにここまで来た
     party  {shape}         人数・並びの条件
     deal   {key}           先客と話をつけた

   look … 何が道を塞いでいるかの見た目。語りの土台になる。
     door / gap / rubble / ward / water / dark / beastly                  */

const KEYS = {

  /* ============ 恩返し ============ */

  favor_bridge: {
    id: 'favor_bridge', name: '恩返しの橋', kind: 'favor',
    tags: ['nature', 'beast', 'wild'], look: 'gap',

/* ---------- 種つき乱数（同じ種なら同じダンジョン） ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(rnd, a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- 部屋の名前 ---------- */
const NAME_BY_TAG = {
  nature: '{滴りの|骨の|苔むした|風の抜ける|狭まった|奥まった}{窪み|広間|岩室|裂け目|洞}',
  made:   '{朽ちた|崩れた|打ち捨てられた|低い|広い}{広間|作業場|詰所|坑口|貯蔵}',
  human:  '{住まいの|かまどの|寝床の|子どもの}{跡|間|名残}',
  holy:   '{祈りの|供物の|沈黙の|灯明の|封じの}{間|回廊|祭室|前室}',
  trap:   '{仕掛けの|軋む|傾いだ|抜けた床の}{間|廊|部屋}',
  loot:   '{隠しの|欲の|数えの|重ねの}{間|蔵|窪み}',
  dragon: '{鱗の|長き眠りの|翼の|誓いの}{間|回廊|祭室}'
};

/* ---------- 生成本体 ---------- */
function generate(opts) {
  opts = opts || {};
  const dun = DUNGEONS[opts.dungeon || 'beast'];
  const seed = opts.seed != null ? opts.seed : Math.floor(Math.random() * 2147483647);
  const rnd = mulberry32(seed);
  const nRooms = Math.max(6, Math.min(40, opts.rooms || 12));

  /* ── ① 関門の本数とキーイベント ── */
  const nGates = opts.gates != null ? opts.gates
    : nRooms <= 12 ? 1 : nRooms <= 20 ? 2 : nRooms <= 28 ? 3 : 4;

  const fits = k => k.tags.indexOf('*') >= 0 || k.tags.some(t => dun.tags.indexOf(t) >= 0);
  const pool = shuffle(rnd, Object.keys(KEYS).filter(id => fits(KEYS[id])));
  const chosen = [];
  const usedKind = {};
  for (const id of pool) {
    if (chosen.length >= nGates) break;
    if (usedKind[KEYS[id].kind]) continue;      /* 同じ型を重ねない */
    usedKind[KEYS[id].kind] = 1; chosen.push(KEYS[id]);
  }
  while (chosen.length < nGates) chosen.push(KEYS[pick(rnd, pool)]);
  /* 「一体も倒さずに」「無傷で」は、奥に置くと詰みに近くなる。必ず手前に寄せる */
  const early = { spare: 1, hurtless: 1 };
  chosen.sort((a, b) => (early[a.kind] ? 0 : 1) - (early[b.kind] ? 0 : 1));

  /* ── ② 区画に部屋数を割る ── */
  const nZones = nGates + 1;
  const share = new Array(nZones).fill(0);
  for (let i = 0; i < nRooms; i++) share[i % nZones]++;
  /* ヒントと種を置く余地を必ず残す。区画は最低3室 */
  for (let z = 0; z < nZones; z++) if (share[z] < 3) share[z] = 3;

  /* ── ③④ 格子の上に部屋を撒く ── */
  const G = 13;
  const cellOf = (x, y) => y * G + x;
  const occupied = {};
  const nodes = [], edges = [];
  let nid = 0;
  const newRoom = (x, y, zone) => {
    const r = { id: 'r' + (nid++), kind: 'room', zone, gx: x, gy: y, links: [], name: null, ev: null };
    occupied[cellOf(x, y)] = r; nodes.push(r); return r;
  };
  const neighbors = (x, y) => [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]
    .filter(([a, b]) => a >= 0 && b >= 0 && a < G && b < G);

  const cx = Math.floor(G / 2), cy = G - 2;
  const zoneRooms = [];
  let entry = newRoom(cx, cy, 0);
  entry.entrance = true;

  for (let z = 0; z < nZones; z++) {
    const list = [entry];
    let frontier = [entry];
    while (list.length < share[z] && frontier.length) {
      const from = pick(rnd, frontier);
      const free = neighbors(from.gx, from.gy).filter(([a, b]) => !occupied[cellOf(a, b)]);
      if (!free.length) { frontier = frontier.filter(f => f !== from); continue; }
      const [a, b] = pick(rnd, free);
      const r = newRoom(a, b, z);
      list.push(r); frontier.push(r);
    }
    zoneRooms.push(list);

    /* 区画の中で、隣り合う部屋を通路でつなぐ（行き止まりを減らす） */
    for (const r of list)
      for (const [a, b] of neighbors(r.gx, r.gy)) {
        const o = occupied[cellOf(a, b)];
        if (o && o.zone === z && o.id > r.id) edges.push({ a: r.id, b: o.id, gate: null });
      }

    /* 次の区画の入口を、この区画の部屋の隣の空きに置く */
    if (z < nZones - 1) {
      const cands = shuffle(rnd, list).map(r => {
        const free = neighbors(r.gx, r.gy).filter(([a, b]) => !occupied[cellOf(a, b)]);
        return free.length ? { from: r, at: pick(rnd, free) } : null;
      }).filter(Boolean);
      if (!cands.length) { share.length = z + 1; list[list.length - 1].goal = true; break; }
      const c = cands[0];
      const next = newRoom(c.at[0], c.at[1], z + 1);
      edges.push({ a: c.from.id, b: next.id, gate: 'g' + z });
      entry = next;
    } else {
      list[list.length - 1].goal = true;
    }
  }

  /* ── 通路を、部屋と部屋のあいだの節として立てる ── */
  const corridors = [];
  edges.forEach((e, i) => {
    const A = nodes.find(n => n.id === e.a), B = nodes.find(n => n.id === e.b);
    const c = {
      id: 'c' + i, kind: 'corridor', zone: Math.min(A.zone, B.zone),
      from: A.id, to: B.id, gate: e.gate, open: !e.gate,
      gx: (A.gx + B.gx) / 2, gy: (A.gy + B.gy) / 2, links: [A.id, B.id], name: null, ev: null
    };
    corridors.push(c); A.links.push(c.id); B.links.push(c.id);
  });
  const all = nodes.concat(corridors);
  const byId = {}; all.forEach(n => { byId[n.id] = n; });

  /* ── 関門の中身 ── */
  const gates = {};
  chosen.slice(0, Math.max(0, share.length - 1)).forEach((key, z) => {
    gates['g' + z] = { id: 'g' + z, key: key.id, cond: key.cond, look: key.look, state: 'shut', zone: z };
  });

  /* ── ⑤ ヒントと種を、関門より手前の区画にだけ置く ── */
  Object.keys(gates).forEach(gid => {
    const g = gates[gid], key = KEYS[g.key];
    const before = [];
    for (let z = 0; z <= g.zone; z++) (zoneRooms[z] || []).forEach(r => { if (!r.entrance && !r.ev) before.push(r); });
    const bag = shuffle(rnd, before);
    if (key.hint && bag.length) { const r = bag.pop(); r.ev = { t: 'hint', gate: gid, key: key.id }; }
    if (key.seed && bag.length) { const r = bag.pop(); r.ev = { t: 'seed', gate: gid, key: key.id }; }
    /* 「倒すと開く」型は、倒すべき相手そのものを手前の区画に置く */
    if (key.cond.t === 'slay' && bag.length) { const r = bag.pop(); r.ev = { t: 'foe', gate: gid, key: key.id }; }
  });

  /* ── 名前をつける（4割ほど。残りは無名のまま） ── */
  const tmpl = dun.tags.map(t => NAME_BY_TAG[t]).filter(Boolean);
  const usedName = {};
  nodes.forEach(r => {
    if (r.entrance) { r.name = '入口'; return; }
    if (r.goal) { r.name = '最奥の間'; return; }
    if (!tmpl.length || rnd() >= 0.42) return;
    for (let t = 0; t < 12; t++) {           /* 同じ名前は一つの場所に二つと無い */
      const nm = VARI.expand(pick(rnd, tmpl), {}, rnd);
      if (!usedName[nm]) { usedName[nm] = 1; r.name = nm; return; }
    }
  });

  return {
    seed, dungeon: dun.id, rooms: nodes.length, zones: share.length,
    nodes: all, byId, gates, start: nodes[0].id,
    goal: (nodes.find(n => n.goal) || nodes[nodes.length - 1]).id,
    keys: chosen.slice(0, Math.max(0, share.length - 1)).map(k => k.id)
  };
}

/* ---------- 検算：詰みが無いか ---------- */
/* 振る舞いだけで満たせる型（何も置かなくてよい） */
const FREE = { spare: 1, hurtless: 1, light: 1, party: 1, word: 1 };

function verify(map) {
  const seen = {}, satisfied = {};
  let changed = true, steps = 0;
  const walk = () => {
    const q = [map.start]; const vis = { [map.start]: 1 };
    while (q.length) {
      const n = map.byId[q.shift()];
      seen[n.id] = 1;
      for (const lid of n.links) {
        const l = map.byId[lid];
        if (!l) continue;
        if (l.kind === 'corridor' && l.gate && !satisfied[l.gate]) continue;
        if (!vis[l.id]) { vis[l.id] = 1; q.push(l.id); }
      }
    }
  };
  while (changed && steps++ < 20) {
    changed = false;
    walk();
    /* 見えた部屋に置かれた種／相手にたどり着ければ、その関門は開けられる */
    for (const id in seen) {
      const n = map.byId[id];
      if (n && n.ev && (n.ev.t === 'seed' || n.ev.t === 'foe') && !satisfied[n.ev.gate]) {
        satisfied[n.ev.gate] = 1; changed = true;
      }
    }
    for (const gid in map.gates) {
      if (satisfied[gid]) continue;
      if (FREE[map.gates[gid].cond.t]) { satisfied[gid] = 1; changed = true; }
    }
  }
  const reachable = !!seen[map.goal];
  const orphan = map.nodes.filter(n => !seen[n.id]).map(n => n.id);

  /* 置き忘れの検算 */
  const placed = {};
  map.nodes.forEach(n => { if (n.ev) placed[n.ev.gate + ':' + n.ev.t] = 1; });
  const missing = [];
  for (const gid in map.gates) {
    const k = KEYS[map.gates[gid].key];
    if (k.hint && !placed[gid + ':hint']) missing.push(gid + ' のヒント');
    if (k.seed && !placed[gid + ':seed']) missing.push(gid + ' の種');
    if (k.cond.t === 'slay' && !placed[gid + ':foe']) missing.push(gid + ' の相手');
    if (!FREE[k.cond.t] && !k.seed && k.cond.t !== 'slay') missing.push(gid + ' の手立て');
  }
  return { ok: reachable && !missing.length, reachable, orphan, satisfied, missing };
}




/* ================= 状態 ================= */
var PARTY = [
  { n:'聖騎士', hp:14, mx:14, row:0 }, { n:'狂戦士', hp:12, mx:12, row:0 },
  { n:'槍兵',   hp:11, mx:11, row:0 }, { n:'高僧',   hp:9,  mx:9,  row:1 },
  { n:'魔術師', hp:8,  mx:8,  row:1 }, { n:'狩人',   hp:10, mx:10, row:1 }
];
var S = null;

function rnd(){ return Math.random(); }
function ctxOf(dun){
  var d = DUNGEONS[dun], c = {};
  for (var k in d.V) (function(k){ c[k] = function(){ return VARI.expand(d.V[k], c, rnd); }; })(k);
  c.who  = function(){ var a=PARTY.filter(function(p){return p.hp>0;}); return (a[Math.floor(rnd()*a.length)]||PARTY[0]).n; };
  c.hurt = function(){
    var a = PARTY.filter(function(p){ return p.hp>0 && p.hp < p.mx; });
    if (!a.length) a = PARTY.filter(function(p){ return p.hp>0; });
    return (a[Math.floor(rnd()*a.length)]||PARTY[0]).n;
  };
  return c;
}
/* 差し込んだ語の前後に半角の隙間が残ると「狩人 が、」になる。ここで潰す。 */
function tidy(s){
  return s.replace(/([^\x00-\x7F]) +/g, '$1').replace(/ +([^\x00-\x7F])/g, '$1')
          .replace(/。+/g, '。').replace(/、。/g, '。');
}
function say(t, cls){
  var box = document.getElementById('narr');
  var p = document.createElement('p');
  if (cls) p.className = cls;
  p.textContent = tidy(VARI.expand(t, S.ctx, rnd));
  box.appendChild(p);
  while (box.children.length > 40) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

/* ================= 灯り ================= */
function lightHops(){ return S.spell ? 6 : S.torch ? 4 : 2; }   /* 部屋1つ＝2ホップ */
function reveal(){
  var lim = lightHops(), q = [[S.at,0]], vis = {}; vis[S.at]=1;
  while (q.length){
    var it = q.shift(), n = S.map.byId[it[0]], d = it[1];
    S.seen[n.id] = 1;
    if (d >= lim) continue;
    if (n.kind === 'corridor' && n.gate && !S.open[n.gate]) continue;  /* 閉じた扉の先は照らせない */
    for (var i=0;i<n.links.length;i++){
      var l = n.links[i];
      if (!vis[l]) { vis[l]=1; q.push([l, d+1]); }
    }
  }
}

/* ================= 地図の絵 ================= */
function drawMap(){
  var U=100, ns=S.map.nodes, xs=[], ys=[];
  ns.forEach(function(n){ if (S.seen[n.id]) { xs.push(n.gx); ys.push(n.gy); } });
  if (!xs.length) { xs=[S.map.byId[S.at].gx]; ys=[S.map.byId[S.at].gy]; }
  /* 見えた範囲に合わせる。ただし一度広がった枠は縮めない（地図が跳ねると読みにくい） */
  var f = S.frame || (S.frame = { x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity });
  f.x0=Math.min(f.x0, Math.min.apply(null,xs)); f.x1=Math.max(f.x1, Math.max.apply(null,xs));
  f.y0=Math.min(f.y0, Math.min.apply(null,ys)); f.y1=Math.max(f.y1, Math.max.apply(null,ys));
  var side = Math.max(f.x1-f.x0, f.y1-f.y0) + 1.8;
  var x0 = (f.x0+f.x1)/2 - side/2, y0 = (f.y0+f.y1)/2 - side/2;
  var w = side*U, h = side*U;
  var s='<svg viewBox="0 0 '+Math.round(w)+' '+Math.round(h)+'" role="img" aria-label="ダンジョンの地図">';
  var cxOf=function(n){ return (n.gx-x0)*U; }, cyOf=function(n){ return (n.gy-y0)*U; };

  ns.forEach(function(n){
    if (n.kind!=='corridor' || !S.seen[n.id]) return;
    var A=S.map.byId[n.from], B=S.map.byId[n.to];
    var horiz = A.gy===B.gy, ax=cxOf(A), ay=cyOf(A), bx=cxOf(B), by=cyOf(B);
    var t=26, x=Math.min(ax,bx)-(horiz?0:t/2), y=Math.min(ay,by)-(horiz?t/2:0);
    var ww=horiz?Math.abs(bx-ax):t, hh=horiz?t:Math.abs(by-ay);
    var shut = n.gate && !S.open[n.gate];
    s+='<rect x="'+x+'" y="'+y+'" width="'+ww+'" height="'+hh+'" rx="4" fill="'+
       (S.been[n.id]?'#1b2438':'#131a29')+'" stroke="'+(shut?'#8a4a4a':'#2b3752')+'" stroke-width="3"/>';
    if (shut){
      var mx=(ax+bx)/2, my=(ay+by)/2;
      s+= horiz
        ? '<rect x="'+(mx-5)+'" y="'+(my-22)+'" width="10" height="44" rx="3" fill="#c96a6a"/>'
        : '<rect x="'+(mx-22)+'" y="'+(my-5)+'" width="44" height="10" rx="3" fill="#c96a6a"/>';
    }
  });

  ns.forEach(function(n){
    if (n.kind!=='room' || !S.seen[n.id]) return;
    var cx=cxOf(n), cy=cyOf(n), sz=n.entrance||n.goal?78:70;
    var here = n.id===S.at, been=S.been[n.id];
    s+='<rect x="'+(cx-sz/2)+'" y="'+(cy-sz/2)+'" width="'+sz+'" height="'+sz+'" rx="8" fill="'+
       (here?'#3a3115':been?'#1c2740':'#0f1522')+'" stroke="'+
       (here?'#f2c65c':been?'#3d4c6e':'#243049')+'" stroke-width="'+(here?5:3)+'"/>';
    if (n.entrance) s+='<text x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle" font-size="26" fill="#94a4c4">入</text>';
    else if (n.goal && been) s+='<text x="'+cx+'" y="'+(cy+7)+'" text-anchor="middle" font-size="26" fill="#f2c65c">奥</text>';
    else if (been && n.ev) s+='<text x="'+cx+'" y="'+(cy+7)+'" text-anchor="middle" font-size="24" fill="'+
       (n.ev.t==='hint'?'#7fd4ff':n.ev.t==='foe'?'#ff8f8f':'#7de8a4')+'">'+
       (n.ev.t==='hint'?'書':n.ev.t==='foe'?'敵':'品')+'</text>';
    else if (here) s+='<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="#f2c65c"/>';
    /* 名前は地図に書かない（狭い画面では潰れる）。上の帯に出す。
       名前のある部屋だけ、小さな印を付けておく */
    else if (been && n.name) s+='<circle cx="'+(cx+sz/2-11)+'" cy="'+(cy-sz/2+11)+'" r="4" fill="#6c7b9c"/>';
  });
  s+='</svg>';
  document.getElementById('mapwrap').innerHTML = s;
}

/* ================= 判定 ================= */
function meets(gid){
  var c = S.map.gates[gid].cond;
  switch (c.t){
    case 'carry':    return !!S.bag[c.item];
    case 'mark':     return (S.marks[c.key]||0) >= c.n;
    case 'slay':     return !!S.did['slay:'+gid];
    case 'favor':    return !!S.did['favor:'+gid];
    case 'offer':    return !!S.bag[c.item];
    case 'lever':    return !!S.did['lever:'+gid];
    case 'word':     return !!S.did['word:'+gid];
    case 'deal':     return !!S.did['deal:'+gid];
    case 'spare':    return S.kills === 0;
    case 'hurtless': return S.hurt === 0;
    case 'light':    return c.state === 'off' ? !S.torch : S.torch;
    case 'party':    return !!S.did['single:'+gid];
    default:         return false;
  }
}
var NEED = {
  carry:'持ち物が要る', mark:'印が揃っていない', slay:'倒すべき相手がいる',
  favor:'まだ、誰にも借りを作っていない', offer:'捧げるものがない', lever:'どこかで何かを動かす',
  word:'言うべき言葉を知らない', deal:'話がついていない', spare:'すでに血を見ている',
  hurtless:'傷を負っている', light:'灯りの扱いが違う', party:'進みかたが違う'
};

/* ================= 出来事 ================= */
function enter(id){
  var n = S.map.byId[id], first = !S.been[id];
  S.at = id; S.been[id] = 1; S.steps++;
  S.noise = (!S.enc && rnd() < 0.26) ? 1 : 0;    /* その場に着いた時点で決める */
  reveal();

  if (n.kind === 'corridor' && n.gate){
    var gid = n.gate, key = KEYS[S.map.gates[gid].key];
    if (S.open[gid]) say(PASS + key.again);
    else if (meets(gid)){
      S.open[gid] = 1; say(key.open, 'em');
      say('── ' + key.name + '：道が通じた', 'sys');
      reveal();
    } else {
      say(key.blocked);
      say('── ' + NEED[S.map.gates[gid].cond.t], 'bad');
    }
  } else if (n.kind === 'room' && n.ev && first){
    var k2 = KEYS[n.ev.key];
    if (n.ev.t === 'hint'){
      say(k2.hint); say('── 覚え書きを写した（' + k2.name + '）', 'sys'); S.notes[n.ev.key]=1;
      if (k2.cond.t === 'word') S.did['word:'+n.ev.gate] = 1;   /* 読むことが、そのまま知ること */
    }
    else if (n.ev.t === 'foe'){
      say('{$placeの奥から|部屋の中央に|$lightの輪の縁に}、{ひときわ大きいものが|'
        + '他とは明らかに違う影が|$lordではないが、それに近いものが}{立ち上がった|こちらを向いた|'
        + '身を起こした}。{ここを通るなら、これを越えるしかない|'
        + '避けて通れる位置ではない|$who が、無言で武器を握り直した}。');
      S.enc = { gate: n.ev.gate };
    }
    else say(k2.seed);
  } else if (n.kind === 'room'){
    if (first && n.name && !n.entrance)
      say('{ここが|この場所が|$who が言うには、ここが|框の彫りが読める——ここが}' +
          n.name + '{だ|らしい|、と伝わる場所だろう}。', 'sys');
    say(WALK.room);
  } else {
    say(WALK.corridor);
  }
  if (n.goal && first) say('{探していたものは、この奥にある|ここが最奥だ|——ここまで来た}。', 'em');
  render();
}

/* 種のある部屋で出せる行動 */
function seedActs(n){
  if (!n.ev || n.ev.t !== 'seed') return [];
  var gid = n.ev.gate, c = S.map.gates[gid].cond, out = [];
  if (meets(gid)) return [];
  if (c.t === 'favor') out.push({ l:'手を貸す', k:'借りを作る', f:function(){
    S.did['favor:'+gid]=1; say('{$who が、黙って手を貸した|時間は食った。それだけのことだ|'+
      '$hurt が、自分の水を分けた}。{相手は、何も言わなかった|礼らしい礼は、無かった}。','em'); } });
  if (c.t === 'carry' || c.t === 'offer') out.push({ l:'持っていく', k:'荷が一つ増える', f:function(){
    S.bag[c.item]=1; say('{$who が、それを荷に収めた|重いが、置いていく気にはならない|'+
      '使い道は、そのうち分かる}。','em'); } });
  if (c.t === 'mark') out.push({ l:'触れる', k:'印 '+((S.marks[c.key]||0)+1)+'/'+c.n, f:function(){
    S.marks[c.key]=(S.marks[c.key]||0)+1;
    say('{指先が温かい|$soundが、遠くで一度鳴った|$traceが、$lightを弾いた}。','em');
    say('── 印 '+S.marks[c.key]+'/'+c.n,'sys'); } });
  if (c.t === 'lever') out.push({ l:'動かす', k:'どこかが変わる', f:function(){
    S.did['lever:'+gid]=1; say('{軋みながら、それは動いた|$placeの奥で、重いものが動く音がした|'+
      '$soundとは違う音が、長く尾を引いた}。','em'); } });
  if (c.t === 'deal') out.push({ l:'話をつける', k:'刃を抜かない', f:function(){
    S.did['deal:'+gid]=1; say('{話は、思ったより早くついた|互いに、損のない形に落ち着いた}。','em'); } });
  return out;
}

/* 仮の遭遇（Phase 2 で本物の戦闘につなぐ） */
function encounter(){
  say('{$soundに混じって|$lightの輪の外で|前方の闇で}、{何かが動いた|気配が立ち上がった|'+
      '$lordではない、小さいものがこちらを向いた}。');
  S.enc = {}; render();
}

/* ================= 描画 ================= */
function render(){
  drawMap();
  var n = S.map.byId[S.at], box = document.getElementById('choices');
  box.innerHTML = '';

  /* 帯と手札は、どの分岐でも先に更新しておく */
  document.getElementById('spot').textContent =
    n.kind === 'corridor' ? (n.gate ? '関門の前' : '通路') : (n.name || '名の無い部屋');
  document.getElementById('pos').textContent =
    '踏破 ' + Object.keys(S.been).filter(function(k){return S.map.byId[k].kind==='room';}).length +
    '/' + S.map.nodes.filter(function(x){return x.kind==='room';}).length + ' 室';
  document.getElementById('kil').textContent = '討 ' + S.kills;
  document.getElementById('hrt').textContent = '傷 ' + S.hurt;
  var tc = document.getElementById('tor');
  tc.textContent = S.torch ? '松明 ON' : '松明 OFF';
  tc.className = 'chip' + (S.torch ? ' on' : '');
  document.getElementById('party').innerHTML = PARTY.map(function(p){
    return '<div class="pm'+(p.row?' back':'')+'"><div class="n">'+p.n+'</div><div class="h">'+p.hp+'</div></div>';
  }).join('');

  var add = function(label, key, cls, fn){
    var b = document.createElement('button');
    b.className = 'btn ' + (cls||'');
    b.innerHTML = label + (key ? '<span class="k">' + key + '</span>' : '');
    b.onclick = fn; box.appendChild(b);
  };

  if (S.enc){
    var gid0 = S.enc.gate;
    add('斬りかかる', gid0 ? '倒せば、道が変わる' : '倒せば、不殺の条件は消える', 'act', function(){
      S.kills++; if (gid0) S.did['slay:'+gid0] = 1; S.enc = 0;
      say('{短い戦いだった|数を頼みに押し切った|$who が、先に動いた}。','em');
      say('── 倒した数 '+S.kills, 'sys'); render(); });
    add('やり過ごす', '刃を抜かない', 'act', function(){
      S.enc = 0;
      if (rnd()<0.4){ S.hurt++; say('{擦れ違いざま、$hurt が浅く裂かれた|通り抜けたが、無傷とはいかない}。','bad'); }
      else say('{息を殺して、やり過ごした|向こうは、こちらに関心を示さなかった}。','em');
      render(); });
    return;
  }

  /* 関門の前でだけ出せる行動 */
  if (n.kind === 'corridor' && n.gate && !S.open[n.gate]){
    var gc = S.map.gates[n.gate].cond, gid = n.gate;
    if (gc.t === 'party' && !S.did['single:'+gid])
      add('一人ずつ渡る', '列を解く', 'act', function(){
        S.did['single:'+gid] = 1;
        say('{隊列を解き、間を空けて並んだ|$who が「一人ずつだ」と短く言った}。','em');
        enter(n.id); });
    if (gc.t === 'light' && ((gc.state === 'off') === S.torch))
      add(S.torch ? '火を伏せる' : '松明を掲げる', 'ここでは、灯りの扱いが鍵になる', 'act', function(){
        S.torch = !S.torch; reveal(); enter(n.id); });
  }

  seedActs(n).forEach(function(a){ add(a.l, a.k, 'act', function(){ a.f(); render(); }); });

  /* 移動先 */
  var here = n, opts = [];
  here.links.forEach(function(lid){
    var l = S.map.byId[lid];
    if (here.kind === 'corridor' && here.gate && !S.open[here.gate] && l.zone > here.zone) return;
    opts.push(l);
  });
  opts.forEach(function(l){
    var label, note = '';
    if (l.kind === 'corridor'){
      var far = S.map.byId[l.from === here.id ? l.to : l.from];
      label = far.name ? far.name + 'の方へ' : (S.been[far.id] ? '来た道を戻る' : '通路の先へ');
      if (l.gate && !S.open[l.gate]) note = '関門';
      else if (!S.seen[far.id]) note = '灯りが届いていない';
      else if (!S.been[far.id]) note = '未踏';
    } else {
      label = l.name ? l.name + 'へ' : (S.been[l.id] ? '戻る' : 'その先の部屋へ');
      if (!S.been[l.id]) note = '未踏';
    }
    add(label, note, 'go', function(){ enter(l.id); });
  });

  /* 出直す。倒した敵は生き返り、不殺・無傷の条件はやり直せる。
     いっぽう構造として開いた道（橋・瓦礫・扉）は開いたまま。 */
  if (S.kills || S.hurt) add('入口まで引き返して、出直す', '敵は生き返る／条件はやり直せる', '', function(){
    S.kills = 0; S.hurt = 0; S.enc = 0; S.noise = 0;
    PARTY.forEach(function(p){ p.hp = p.mx; });
    say('{一行は、いったん外へ出た|来た道を戻り、$placeの外の空気を吸った|'
      + '$who が「出直す」と言った。誰も反対しなかった}。'
      + '{戻ってみれば、$traceは新しくなっている|'
      + '倒したはずのものが、また$soundを立てている|'
      + '$placeは、こちらを覚えていないらしい}。', 'sys');
    say('── 討った数と傷は、帳消しになった。開いた道は、開いたまま。', 'sys');
    enter(S.map.start); });

  add((S.torch ? '松明を伏せる' : '松明を掲げる'), (S.torch ? '灯り 2部屋 → 1部屋' : '灯り 1部屋 → 2部屋'), '', function(){
    S.torch = !S.torch;
    say(S.torch ? '{松明に火を移した|$lightが、闇を一歩ぶん押し戻す}。' : '{火を伏せた|$lightは、足元だけになった}。','sys');
    reveal(); render(); });
  if (!S.spellUsed) add('魔術師のトーチ', '一度だけ 3部屋ぶん', '', function(){
    S.spell = 1; S.spellUsed = 1;
    say('{魔術師が短く唱えた|詠唱は、思ったより短かった}。{$placeが、奥まで見えた|'+
        '$lightが、届くはずのない先まで伸びる}。','em');
    reveal(); S.spell = 0; render(); });
  if (S.noise) add('物音のする方をうかがう', '遭遇するかもしれない', '', function(){ S.noise = 0; encounter(); });
}

/* ================= 開始 ================= */
var SETUP = { dun:'beast', rooms:10 };
function begin(){
  var map = generate({ dungeon: SETUP.dun, rooms: SETUP.rooms });
  var v = verify(map);
  S = { map:map, at:map.start, been:{}, seen:{}, open:{}, bag:{}, marks:{}, did:{}, notes:{},
        kills:0, hurt:0, steps:0, torch:false, spell:0, spellUsed:0, enc:0, noise:0, ctx:ctxOf(SETUP.dun) };
  PARTY.forEach(function(p){ p.hp = p.mx; });
  document.getElementById('setup').style.display='none';
  document.getElementById('dun').textContent = DUNGEONS[SETUP.dun].name;
  document.getElementById('narr').innerHTML='';
  say(DUNGEONS[SETUP.dun].open);
  say('── 部屋 ' + map.nodes.filter(function(x){return x.kind==='room';}).length +
      '／関門 ' + Object.keys(map.gates).length + '（' +
      map.keys.map(function(k){return KEYS[k].name;}).join('・') + '）' +
      '／種 ' + map.seed + (v.ok ? '' : ' ※要確認'), 'sys');
  enter(map.start);
}
function relayout(){ document.body.classList.toggle('land', innerWidth > innerHeight * 1.15); }
addEventListener('resize', relayout);

document.addEventListener('DOMContentLoaded', function(){
  relayout();
  var ds = document.getElementById('dopts'), rs = document.getElementById('ropts');
  Object.keys(DUNGEONS).forEach(function(k){
    var b=document.createElement('button'); b.className='opt'+(k===SETUP.dun?' on':'');
    b.textContent=DUNGEONS[k].name;
    b.onclick=function(){ SETUP.dun=k; [].forEach.call(ds.children,function(c){c.classList.remove('on');});
      b.classList.add('on'); document.getElementById('dsub').textContent=DUNGEONS[k].sub+'／'+DUNGEONS[k].open; };
    ds.appendChild(b);
  });
  document.getElementById('dsub').textContent=DUNGEONS[SETUP.dun].sub+'／'+DUNGEONS[SETUP.dun].open;
  [['序盤',10],['中盤',18],['後半',26],['最奥',32]].forEach(function(p){
    var b=document.createElement('button'); b.className='opt'+(p[1]===SETUP.rooms?' on':'');
    b.textContent=p[0]+' '+p[1]+'室';
    b.onclick=function(){ SETUP.rooms=p[1]; [].forEach.call(rs.children,function(c){c.classList.remove('on');});
      b.classList.add('on'); };
    rs.appendChild(b);
  });
  document.getElementById('go').onclick=begin;
});

</script>
