<body>
<div class="wrap">
  <div class="top">
    <b id="dun">—</b>
    <span class="spot" id="spot"></span>
    <span class="sp"></span>
    <span class="chip" id="pos">—</span>
    <span class="chip" id="kil">討 0</span>
    <span class="chip" id="hrt">傷 0</span>
    <span class="chip" id="tor">松明 OFF</span>
    <span class="chip" id="bok">帳面 0</span>
  </div>
  <div class="body">
    <div class="mapwrap" id="mapwrap"></div>
    <div class="side">
      <div class="narr" id="narr"></div>
      <div class="choices" id="choices"></div>
    </div>
  </div>

<div class="setup bookov" id="bookov"><div class="card">
  <h1>帳面</h1>
  <div id="bookbody"></div>
  <p style="margin:14px 0 0"><button class="opt" id="bookx">とじる</button></p>
</div></div>

<div class="setup" id="setup"><div class="card">
  <h1>RPGモード ── 探索（Phase 1）</h1>
  <p class="lead">部屋と通路の単位で歩きます。部屋に入ると、その場所の名前と情景が語られ、
    描写に出てきたものだけが選択肢に並びます。灯りの届く範囲だけ地図に形が描かれます。</p>
  <h2>ダンジョン</h2>
  <div class="opts" id="dopts"></div>
  <div class="dsub" id="dsub"></div>
  <h2>広さ</h2>
  <div class="opts" id="ropts"></div>
  <div class="dsub">物語が進むほど、深く、長くなります。</div>
  <h2 id="vtog" style="cursor:pointer">生成の変数 ▾（ふだんは、その場所の流儀のまま）</h2>
  <div id="vwrap" style="display:none"><div id="vopts"></div>
  <div class="dsub">流儀＝その場所らしい地形。喰らいの洞は曲がりくねった洞窟、黙した坑道は長い直線の坑道、欲深き迷路は枝分かれと回廊、護りの神域は広く丸い間。</div></div>
  <button class="start" id="go">ダンジョンの前に立つ</button>
</div></div>

<script>/* 文章の組み合わせエンジン。
   {a|b|c} で言い換え（入れ子OK）、$name で状況に応じた語を差し込む。
   ・expand() … 1つ選んで文章にする
   ・count()  … 何通りあるかを数える
   ブラウザにもそのまま載せるので、依存は持たない。                     */
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.VARI = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- 解析 ---------- */
  function parse(str) {
    var pos = 0;
    function seq(stop) {
      var items = [], buf = '';
      function flush() { if (buf) { items.push({ t: 'lit', v: buf }); buf = ''; } }
      while (pos < str.length) {
        var ch = str[pos];
        if (stop && (ch === '|' || ch === '}')) break;
        if (ch === '{') { pos++; flush(); items.push(alt()); continue; }
        if (ch === '$') {
          var m = /^\$([a-zA-Z_][a-zA-Z0-9_]*)/.exec(str.slice(pos));
          if (m) { pos += m[0].length; flush(); items.push({ t: 'var', v: m[1] }); continue; }
        }
        buf += ch; pos++;
      }
      flush();
      return { t: 'seq', v: items };
    }
    function alt() {
      var opts = [seq(true)];
      while (str[pos] === '|') { pos++; opts.push(seq(true)); }
      if (str[pos] === '}') pos++;
      return { t: 'alt', v: opts };
    }
    return seq(false);
  }

  /* ---------- 数える ---------- */
  function count(node, vars) {
    if (typeof node === 'string') node = parse(node);
    switch (node.t) {
      case 'lit': return 1;
      case 'var': return (vars && vars[node.v]) || 1;
      case 'seq': return node.v.reduce(function (a, n) { return a * count(n, vars); }, 1);
      case 'alt': return node.v.reduce(function (a, n) { return a + count(n, vars); }, 0);
    }
    return 1;
  }

  /* ---------- 1つ選ぶ ---------- */
  function expand(node, ctx, rnd) {
    rnd = rnd || Math.random;
    if (typeof node === 'string') node = parse(node);
    switch (node.t) {
      case 'lit': return node.v;
      case 'var':
        var f = ctx && ctx[node.v];
        return typeof f === 'function' ? f() : (f == null ? '' : String(f));
      case 'seq': return node.v.map(function (n) { return expand(n, ctx, rnd); }).join('');
      case 'alt': return expand(node.v[Math.floor(rnd() * node.v.length)], ctx, rnd);
    }
    return '';
  }

  return { parse: parse, count: count, expand: expand };
});

/* ダンジョンの設定。
   open … プレイヤーに開示する。クエスト選択の画面に出る
   hush … 裏設定。プレイヤーには見せないが、語彙・出来事・敵の傾向を決める
   V    … 語彙。同じ出来事の文でも、ここが差し替わることで別の場所に読める
   tags … この場所に出しうる出来事の種類
   mix  … 出来事の出やすさ（罠・敵・宝・人）                            */

const DUNGEONS = {
  /* ============ 1. 人がいない、罠と敵だらけ ============ */
  beast: {
    id: 'beast',
    name: '喰らいの洞',
    sub: '人の手が入っていない自然洞',
    danger: 1,
    open:
      '村の北、崩れた沢の奥に口を開けている。人の手はまったく入っていない。'
      + 'きこりが二人、羊を追った子どもが一人、戻っていない。'
      + '中にあるのは獣と、洞そのものの気まぐれだけだ。',
    hush:
      '獣道の崩落でできた自然洞。知性のあるものは棲んでいない。'
      + '罠はすべて自然のもの——落盤、地割れ、よどんだ毒気、抜ける床。'
      + 'だから「仕掛け」の語は使わない。人工物も、文字も、明かりも出てこない。'
      + '奥の主は特別な存在ではなく、単に一番大きく育った個体である。',
    V: {
      place: '{洞|洞窟|岩の裂け目}',
      trace: '{獣の掻き跡|抜け落ちた毛|噛み砕かれた骨}',
      who2:  '{戻らなかったきこり|羊を追った子ども|迷い込んだ誰か}',   // 入って、戻らなかった者たち
      lord:  '{けもの|一番大きな個体|主}',
      smell: '{獣の匂い|濡れた毛の匂い|すえた息}',
      sound: '{遠い唸り|滴る水|自分たちの足音}',
      light: '{松明の輪|手にした灯り}'
    },
    tags: ['nature', 'beast', 'wild'],
    mix: { trap: 3, enemy: 4, loot: 1, human: 0 }
  },

  /* ============ 2. かつて人が住んでいた、罠が多い ============ */
  mine: {
    id: 'mine',
    name: '黙した坑道',
    sub: '住人の絶えた鉱山',
    danger: 2,
    open:
      'かつて三十人が暮らした鉱山の坑道。ある年の冬、住人はひとり残らず姿を消した。'
      + '家財も、掘り出した鉱石も、そのまま置き去りにされている。'
      + '持ち出そうとした者が何人か向かい、そのうち何人かは戻ってこなかった。',
    hush:
      '住人は疫病で全滅した。仕掛けは、彼らが自分たちの財を守るために自ら組んだもの。'
      + 'つまり罠は「悪意」ではなく「留守番」である。'
      + '生活の跡が生々しく残っているのがこの場所の肌ざわりで、'
      + '出てくる死体はほとんどが後から来た盗掘者のほう。'
      + '奥の主は、最後まで坑道に残った鉱夫長の成れの果て。',
    V: {
      place: '{坑道|旧坑|地下の住まい}',
      trace: '{生活の跡|使いかけの道具|冷えたかまど}',
      who2:  '{先に入った者|盗掘者|欲を出した誰か}',
      lord:  '{坑道|仕掛け|残された意志}',
      smell: '{かびの匂い|石炭の匂い|人の暮らしの名残}',
      sound: '{梁の軋み|どこかで落ちる石|風が坑を抜ける音}',
      light: '{松明の輪|壁に残った灯り台}'
    },
    tags: ['made', 'trap', 'relic', 'human'],
    mix: { trap: 4, enemy: 2, loot: 3, human: 1 }
  },

  /* ============ 3. 宝が巧妙に隠され、冒険者も多い ============ */
  maze: {
    id: 'maze',
    name: '欲深き迷路',
    sub: '財宝が眠ると伝わる人工迷宮',
    danger: 3,
    open:
      '誰が、何のために造ったのかは分かっていない。'
      + 'ただ「財宝が眠る」という話だけが独り歩きし、腕自慢が絶えず集まってくる。'
      + '入口には常に何人かの姿があり、奥へ行くほど人は減る。',
    hush:
      '迷宮そのものが宝を守るために造られた仕掛けの塊で、'
      + '通路の形も、宝の隠し方も、挑む者を試すように出来ている。'
      + 'ここでの危険は罠と敵だけではない——同じ宝を狙う人間が、いちばん厄介である。'
      + '奥の主は、最初にこの迷宮を攻略しかけて取り込まれた冒険者。',
    V: {
      place: '{迷宮|回廊|石組みの通路}',
      trace: '{先客の血痕|削られた壁の目印|途中で捨てられた装備}',
      who2:  '{冒険者|同じ宝を狙う連中|腕自慢}',
      lord:  '{迷宮|仕掛けを組んだ者|最奥の主}',
      smell: '{油の匂い|鉄と血の匂い|人いきれ}',
      sound: '{遠くで人の声|金属が擦れる音|誰かの短い悲鳴}',
      light: '{松明の輪|壁の燭台の名残}'
    },
    tags: ['made', 'trap', 'loot', 'human', 'rival'],
    mix: { trap: 4, enemy: 3, loot: 4, human: 3 }
  },

  /* ============ 4. 竜と取り巻きが遺物を護る神域 ============ */
  shrine: {
    id: 'shrine',
    name: '護りの神域',
    sub: '竜が遺物を護る聖域',
    danger: 4,
    open:
      '山ひとつをくり抜いて造られた地下神殿。奥に「触れてはならぬもの」が眠り、'
      + '竜がそれを護っていると伝わる。近づく者は絶えて久しい。'
      + '——だが今年、山の水が枯れた。原因は、おそらく奥にある。',
    hush:
      '竜はもともと人間の守り手で、遺物を封じるために自ら竜となった。'
      + '取り巻きは、同じ誓いを立てた信徒の成れの果てである。'

      + '罠は物理ではなく結界・幻・試練の形をとる。文字と灯りが多い。',
    V: {
      place: '{神域|地下神殿|石の回廊}',
      trace: '{古い刻印|供物の跡|すり減った祈りの床}',
      who2:  '{巡礼者|誓いを立てた者|かつての信徒}',
      lord:  '{竜|護り手|眠るもの}',
      smell: '{焚いた香|乾いた石|雷を待つ空気}',
      sound: '{詠唱のような残響|低く長い呼吸|石が石に触れる音}',
      light: '{松明の輪|絶えず燃えている灯明}'
    },

  }

/* 移動中に流す一言。
   語彙（$place $sound $smell $light $trace $lord）がダンジョンごとに差し替わるので、
   同じ枝を引いても別の場所の文に読める。
   （出来事そのもの＝EVENTS は tools/rpgevents.js 側）                   */

const WALK = {
  /* 通路を抜けるとき */
  corridor:
    '{'
    +   '{$lightの外は|光の届く先は}、{何も見えない|同じ闇が続くだけだ|形を持たない|数歩ぶんしかない}'
    + '|' + '闇は、{どこまでも同じ顔をしている|奥へ行くほど厚い|光を吸っては返さない}'
    + '|' + '通路は{緩く曲がって|わずかに下って|じわじわと上って|一度細くなってから広がって}いる'
    + '|' + '{足元は|床は}{湿っている|乾いて滑る|平らではない|踏むたびに小さく鳴る}'
    + '|' + '{壁は|天井は}{手を伸ばせば届く|思ったより近い|$lightでは端まで届かない}'
    + '}。'
    + '{|{'
    +   '$soundが、{どこかで|背後で|前方で|頭上で}{続いている|一度だけした|止んだ}'
    + '|' + '$smellが{一段濃くなった|さっきより薄い|不意に入れ替わった|鼻の奥に残る}'
    + '|' + '$traceが、{足元に|壁の低いところに|天井の近くに}{続いている|途切れがちに残っている}'
    + '|' + '$who が、{後ろを振り返った|足を止めて耳を澄ませた|何も言わずに先を歩く|数を数え直した}'
    + '|' + '$hurt の{足取りが、少し重い|息が、まだ整っていない|傷が、$lightの下で黒く見える}'
    + '|' + '{誰も口をきかない|自分たちの足音だけが返ってくる|列は、崩れていない}'
    + '}。}',

  /* 名前のない部屋に入ったとき */
  room:
    '{'
    +   '{天井の低い|思ったより広い|四角く区切られた|歪な形の|奥行きだけがある}{部屋|空間|窪み}だ'
    + '|' + '{何もない|使われた跡のない|がらんとした|荒らされた後らしい}{部屋|広間}に出た'
    + '|' + '{$lightが、壁の四隅まで届いた|$lightを回すと、壁は四方にある|$lightだけで、部屋の隅々まで見える}'
    + '|' + '{ここは行き止まりではない|出口は、入ってきた側だけではない|道は、まだ続いている}'
    + '}。'

/* ダンジョン生成 v2。
   「解錠の連鎖を先に決めて、区画に部屋を配る」背骨はそのまま、
   置き方をマス単位の矩形（複数マスの部屋＋長さのある廊下）に拡張した。

   ── 生成の変数（PROFILE）──
     rooms    部屋数        few(8) / some(14) / many(22) / lots(32)
     roomSize 部屋の広さ    cramped / standard / spacious
     corLen   廊下の長さ    compact(1) / normal(1-2) / sprawling(2-4)
     corWidth 廊下の幅      narrow / wide
     layout   道の形        straight / forking / balanced / winding
     shapes   部屋の形      square / irregular / round から1つ以上
     rough    外周の粗さ    none / light / medium / heavy
     loops    回廊          few / some / many …行き止まりを減らし、環を作る
     landmark 大広間        true なら、ひときわ大きい広間を1つ保証する

   ダンジョンごとに「流儀」（既定のPROFILE）を持ち、場所の性格が
   そのまま地形に出る。ユーザーはどの変数も上書きできる。            */




/* ---------- 乱数 ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (rnd, a) => a[Math.floor(rnd() * a.length)];
function shuffle(rnd, a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- 変数の値 ---------- */
const ROOMS_N   = { few: 8, some: 14, many: 22, lots: 32 };
const COR_LEN   = { compact: [1, 1], normal: [1, 2], sprawling: [2, 4] };
const ROUGH_PX  = { none: 0, light: 8, medium: 16, heavy: 26 };
const LOOP_R    = { few: 0.05, some: 0.14, many: 0.3 };

/* 部屋の寸法（マス）。[w,h] の候補 */
const SIZES = {
  cramped:  [[2,2],[2,2],[3,2],[2,3]],
  standard: [[2,2],[3,2],[2,3],[3,3],[4,2]],
  spacious: [[3,3],[4,3],[3,4],[4,4],[5,3],[5,4]]
};
const ROUND_D = { cramped: [3], standard: [3,4], spacious: [4,5] };

/* ダンジョンの流儀 */
const STYLES = {
  beast:  { roomSize:'standard', corLen:'sprawling', corWidth:'narrow',
            layout:'winding',  shapes:['irregular','round'], rough:'heavy',  loops:'few',  landmark:false },
  mine:   { roomSize:'cramped',  corLen:'sprawling', corWidth:'narrow',
            layout:'straight', shapes:['square'],            rough:'light',  loops:'some', landmark:false },
  maze:   { roomSize:'cramped',  corLen:'compact',   corWidth:'narrow',
            layout:'forking',  shapes:['square','irregular'],rough:'medium', loops:'many', landmark:false },
  shrine: { roomSize:'spacious', corLen:'normal',    corWidth:'wide',
            layout:'balanced', shapes:['square','round'],    rough:'none',   loops:'few',  landmark:true }
};

/* ---------- 部屋の名前（真名） ---------- */
const NAME_BY_TAG = {
  nature: '{滴りの|骨の|苔むした|風の抜ける|狭まった|奥まった}{窪み|広間|岩室|裂け目|洞}',
  made:   '{朽ちた|崩れた|打ち捨てられた|低い|広い}{広間|作業場|詰所|坑口|貯蔵}',
  human:  '{住まいの|かまどの|寝床の|子どもの}{跡|間|名残}',
  holy:   '{祈りの|供物の|沈黙の|灯明の|封じの}{間|回廊|祭室|前室}',
  trap:   '{仕掛けの|軋む|傾いだ|抜けた床の}{間|廊|部屋}',
  loot:   '{隠しの|欲の|数えの|重ねの}{間|蔵|窪み}',
  dragon: '{鱗の|長き眠りの|翼の|誓いの}{間|回廊|祭室}'
};

/* ---------- 生成本体 ---------- */
function generate(opts) {
  opts = opts || {};
  const dun = DUNGEONS[opts.dungeon || 'beast'];
  const seed = opts.seed != null ? opts.seed : Math.floor(Math.random() * 2147483647);
  const rnd = mulberry32(seed);

  /* 変数：流儀 → 呼び出し側の上書き */
  const P = Object.assign({}, STYLES[dun.id] || STYLES.beast);
  ['roomSize','corLen','corWidth','layout','rough','loops'].forEach(k => {
    if (opts[k]) P[k] = opts[k];
  });
  if (opts.shapes && opts.shapes.length) P.shapes = opts.shapes.slice();
  if (opts.landmark != null) P.landmark = opts.landmark;
  const nRooms = Math.max(6, Math.min(40,
    opts.rooms ? (ROOMS_N[opts.rooms] || +opts.rooms || 12) : 12));

  /* ── ① 関門の本数とキーイベント ── */
  const nGates = opts.gates != null ? opts.gates
    : nRooms <= 10 ? 1 : nRooms <= 16 ? 2 : nRooms <= 26 ? 3 : 4;
  const fits = k => k.tags.indexOf('*') >= 0 || k.tags.some(t => dun.tags.indexOf(t) >= 0);
  const kpool = shuffle(rnd, Object.keys(KEYS).filter(id => fits(KEYS[id])));
  const chosen = [];
  const usedKind = {};
  for (const id of kpool) {
    if (chosen.length >= nGates) break;
    if (usedKind[KEYS[id].kind]) continue;
    usedKind[KEYS[id].kind] = 1; chosen.push(KEYS[id]);
  }
  while (chosen.length < nGates) chosen.push(KEYS[pick(rnd, kpool)]);
  const early = { spare: 1, hurtless: 1 };
  chosen.sort((a, b) => (early[a.kind] ? 0 : 1) - (early[b.kind] ? 0 : 1));

  /* ── ② 区画に部屋数を割る ── */
  const nZones = nGates + 1;
  const share = new Array(nZones).fill(0);
  for (let i = 0; i < nRooms; i++) share[i % nZones]++;
  for (let z = 0; z < nZones; z++) if (share[z] < 3) share[z] = 3;

  /* ── ③ マス格子に、矩形の部屋と長さのある廊下を置く ── */
  let G0 = nRooms >= 28 ? 60 : nRooms >= 18 ? 52 : 46;
  if (P.corLen === 'sprawling') G0 += 10;                 /* 長い廊下は場所を食う */
  if (P.roomSize === 'spacious') G0 += 6;
  const G = G0;                                           /* 格子の一辺（マス） */
  const occ = new Array(G * G).fill(0);
  const at = (x, y) => (x >= 0 && y >= 0 && x < G && y < G) ? occ[y * G + x] : 9;
  const mark = (x, y, w, h, v) => { for (let b = y; b < y + h; b++) for (let a = x; a < x + w; a++) occ[b * G + a] = v; };
  const freeRect = (x, y, w, h) => {
    if (x < 1 || y < 1 || x + w > G - 1 || y + h > G - 1) return false;
    for (let b = y; b < y + h; b++) for (let a = x; a < x + w; a++) if (at(a, b)) return false;
    return true;
  };
  /* 部屋どうしが壁を接して融合しないよう、1マスの余白も見る */
  const clearAround = (x, y, w, h, allow) => {
    for (let b = y - 1; b < y + h + 1; b++) for (let a = x - 1; a < x + w + 1; a++) {
      if (a >= x && a < x + w && b >= y && b < y + h) continue;
      const v = at(a, b);
      if (v && v !== allow) return false;
    }
    return true;
  };
  /* 部屋の余白：空きか、渡ってくる廊下のマスだけを許す */
  const marginOK = (x, y, w, h, allowCells) => {
    for (let b = y - 1; b < y + h + 1; b++) for (let a = x - 1; a < x + w + 1; a++) {
      if (a >= x && a < x + w && b >= y && b < y + h) continue;
      const v = at(a, b);
      if (!v) continue;
      if (v === 9) return false;
      if (allowCells && allowCells.has(b * 1000 + a)) continue;
      return false;
    }
    return true;
  };
  const OPP = [1, 0, 3, 2];

  const nodes = [], corridors = [];
  let nid = 0, cid = 0;
  const entryRow = G - 2;

  const footprint = () => {
    const shape = pick(rnd, P.shapes);
    if (shape === 'round') { const d = pick(rnd, ROUND_D[P.roomSize]); return { shape, w: d, h: d }; }
    const [w, h] = pick(rnd, SIZES[P.roomSize]);
    return { shape, w, h };
  };
  const newRoom = (x, y, w, h, shape, zone) => {
    const r = { id: 'r' + (nid++), kind: 'room', zone, x, y, w, h, shape,
      gx: x + w / 2, gy: y + h / 2, links: [], name: null, ev: null, rects: [{ x, y, w, h }] };
    mark(x, y, w, h, r.id); nodes.push(r);
    /* 不規則形：側面にひと塊り足す */
    if (shape === 'irregular' && rnd() < 0.85) {
      for (let t = 0; t < 8; t++) {
        const side = Math.floor(rnd() * 4);
        /* 1マスだけ飛び出た意味のない窪みは作らない。壁に沿って2マス以上 */
        const ew = (side < 2) ? 2 : 1 + Math.floor(rnd() * 2);
        const eh = (side < 2) ? 1 + Math.floor(rnd() * 2) : 2;
        let ex, ey;
        if (side === 0) { ex = x + Math.floor(rnd() * Math.max(1, w - ew + 1)); ey = y - eh; }
        else if (side === 1) { ex = x + Math.floor(rnd() * Math.max(1, w - ew + 1)); ey = y + h; }
        else if (side === 2) { ex = x - ew; ey = y + Math.floor(rnd() * Math.max(1, h - eh + 1)); }
        else { ex = x + w; ey = y + Math.floor(rnd() * Math.max(1, h - eh + 1)); }
        if (ey + eh - 1 <= entryRow && freeRect(ex, ey, ew, eh) && clearAround(ex, ey, ew, eh, r.id)) {
          mark(ex, ey, ew, eh, r.id); r.rects.push({ x: ex, y: ey, w: ew, h: eh }); break;
        }
      }
    }
    return r;
  };

  /* 廊下：部屋の縁のマスから方角 dir へ L マス。先に次の部屋。
     守ること：
     ・1つの辺に廊下は1本まで（「北へ進む」が2つ並ばない）
     ・円形の部屋は、辺の中央にだけ廊下がつく（丸い床と必ず重なる）
     ・新しい部屋の余白1マスは、渡ってきた廊下以外は空に（見た目の融合を防ぐ）
     ・廊下は他の部屋の壁に沿って走らない                                     */
  const DIRS = [{ dx: 0, dy: -1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 1, dy: 0 }];
  function tryGrow(from, zone, prefDir) {
    const [L0, L1] = COR_LEN[P.corLen];
    const dirs = prefDir != null
      ? [DIRS[prefDir]].concat(shuffle(rnd, DIRS.filter((d, i) => i !== prefDir)))
      : shuffle(rnd, DIRS);
    for (const d of dirs) {
      const di = DIRS.indexOf(d);
      if (from.sides && from.sides[di]) continue;        /* この辺はもう使っている */
      for (let attempt = 0; attempt < 9; attempt++) {
        /* 置き場が見つからないときは、短い廊下も試して詰まりを防ぐ */
        const lo = attempt < 4 ? L0 : 1;
        const L = lo + Math.floor(rnd() * (L1 - lo + 1));
        const m = from.rects[0];
        const roundFrom = from.shape === 'round';
        let sx, sy;
        if (d.dy === -1) { sx = roundFrom ? m.x + (m.w >> 1) : m.x + Math.floor(rnd() * m.w); sy = m.y - 1; }
        else if (d.dy === 1) { sx = roundFrom ? m.x + (m.w >> 1) : m.x + Math.floor(rnd() * m.w); sy = m.y + m.h; }
        else if (d.dx === -1) { sx = m.x - 1; sy = roundFrom ? m.y + (m.h >> 1) : m.y + Math.floor(rnd() * m.h); }
        else { sx = m.x + m.w; sy = roundFrom ? m.y + (m.h >> 1) : m.y + Math.floor(rnd() * m.h); }
        const cells = [];
        let ok = true;
        for (let i = 0; i < L; i++) {
          const cx2 = sx + d.dx * i, cy2 = sy + d.dy * i;
          if (at(cx2, cy2)) { ok = false; break; }
          /* 横腹が部屋に触れない（出発の1マス目だけ from はよい） */
          const lat = d.dy === 0 ? [[cx2, cy2 - 1], [cx2, cy2 + 1]] : [[cx2 - 1, cy2], [cx2 + 1, cy2]];
          for (const q of lat) {
            const v = at(q[0], q[1]);
            if (v && String(v)[0] === 'r' && !(i === 0 && v === from.id)) { ok = false; break; }
          }
          if (!ok) break;
          cells.push([cx2, cy2]);
        }
        if (!ok) continue;
        const f = footprint();
        let rx, ry;
        const ex = sx + d.dx * L, ey = sy + d.dy * L;
        if (f.shape === 'round') {
          /* 円形は、廊下の軸が中央を通るように置く */
          if (d.dy !== 0) { rx = ex - (f.w >> 1); ry = d.dy === -1 ? ey - f.h + 1 : ey; }
          else { ry = ey - (f.h >> 1); rx = d.dx === -1 ? ex - f.w + 1 : ex; }
        } else {
          if (d.dy === -1) { rx = ex - Math.floor(rnd() * f.w); ry = ey - f.h + 1; }
          else if (d.dy === 1) { rx = ex - Math.floor(rnd() * f.w); ry = ey; }
          else if (d.dx === -1) { rx = ex - f.w + 1; ry = ey - Math.floor(rnd() * f.h); }
          else { rx = ex; ry = ey - Math.floor(rnd() * f.h); }
        }
        if (ry + f.h - 1 > entryRow) continue;
        if (!freeRect(rx, ry, f.w, f.h)) continue;
        const cellSet = new Set(cells.map(q => q[1] * 1000 + q[0]));
        if (!marginOK(rx, ry, f.w, f.h, cellSet)) continue;   /* 余白に他人がいない */
        const c = { id: 'c' + (cid++), kind: 'corridor', zone,
          cells, horiz: d.dy === 0, gate: null,
          gx: cells.reduce((s2, p2) => s2 + p2[0], 0) / cells.length + 0.5,
          gy: cells.reduce((s2, p2) => s2 + p2[1], 0) / cells.length + 0.5,
          from: from.id, to: null, links: [], name: null, ev: null };
        cells.forEach(([a, b]) => mark(a, b, 1, 1, c.id));
        const r = newRoom(rx, ry, f.w, f.h, f.shape, zone);
        c.to = r.id; c.links = [from.id, r.id];
        from.links.push(c.id); r.links.push(c.id);
        from.sides = from.sides || {}; from.sides[di] = 1;
        r.sides = r.sides || {}; r.sides[OPP[di]] = 1;
        corridors.push(c);
        return { room: r, cor: c, dirIndex: di };
      }
    }
    return null;
  }

  /* 既存の部屋どうしを短い廊下で繋ぐ（回廊。新しい部屋は作らない）。
     tryGrow と同じ規則：辺は1本まで、円形は中央、壁沿いを走らない */
  function tryLink(A, zone) {
    const d = pick(rnd, DIRS);
    const di = DIRS.indexOf(d);
    if (A.sides && A.sides[di]) return null;
    const m = A.rects[0];
    const roundA = A.shape === 'round';
    let sx, sy;
    if (d.dy === -1) { sx = roundA ? m.x + (m.w >> 1) : m.x + Math.floor(rnd() * m.w); sy = m.y - 1; }
    else if (d.dy === 1) { sx = roundA ? m.x + (m.w >> 1) : m.x + Math.floor(rnd() * m.w); sy = m.y + m.h; }
    else if (d.dx === -1) { sx = m.x - 1; sy = roundA ? m.y + (m.h >> 1) : m.y + Math.floor(rnd() * m.h); }
    else { sx = m.x + m.w; sy = roundA ? m.y + (m.h >> 1) : m.y + Math.floor(rnd() * m.h); }
    const cells = [];
    for (let i = 0; i < 5; i++) {
      const a = sx + d.dx * i, b = sy + d.dy * i;
      const v = at(a, b);
      if (!v) {
        /* 横腹が部屋に触れない */
        const lat = d.dy === 0 ? [[a, b - 1], [a, b + 1]] : [[a - 1, b], [a + 1, b]];
        for (const q of lat) {
          const v2 = at(q[0], q[1]);
          if (v2 && String(v2)[0] === 'r' && !(i === 0 && v2 === A.id)) return null;
        }
        cells.push([a, b]); continue;
      }
      if (String(v)[0] === 'r' && cells.length > 0) {
        const B = nodes.find(n => n.id === v);
        if (!B || B.zone !== zone || B === A) return null;
        if (B.sides && B.sides[OPP[di]]) return null;
        /* 円形の相手には、中央の列（行）でしか繋がない */
        if (B.shape === 'round') {
          if (d.dy === 0) { if (b !== B.y + (B.h >> 1)) return null; }
          else { if (a !== B.x + (B.w >> 1)) return null; }
        }
        /* 相手のメイン矩形の縁に当たっていること（出っ張りには繋がない） */
        const mb = B.rects[0];
        if (a < mb.x || a >= mb.x + mb.w || b < mb.y || b >= mb.y + mb.h) return null;
        if (A.links.some(l => { const c = corridors.find(x2 => x2.id === l);
          return c && (c.from === B.id || c.to === B.id); })) return null;
        const c = { id: 'c' + (cid++), kind: 'corridor', zone, cells, horiz: d.dy === 0, gate: null,
          gx: cells.reduce((s2, p2) => s2 + p2[0], 0) / cells.length + 0.5,
          gy: cells.reduce((s2, p2) => s2 + p2[1], 0) / cells.length + 0.5,
          from: A.id, to: B.id, links: [A.id, B.id], name: null, ev: null };
        cells.forEach(([a2, b2]) => mark(a2, b2, 1, 1, c.id));
        A.links.push(c.id); B.links.push(c.id);
        A.sides = A.sides || {}; A.sides[di] = 1;
        B.sides = B.sides || {}; B.sides[OPP[di]] = 1;
        corridors.push(c);
        return c;
      }
      return null;
    }
    return null;
  }

  /* 成長。自分を袋小路に閉じ込めて部屋が足りなくなったら、
     同じ乱数列のまま置き直す（＝シードから決定的にやり直す） */
  let zoneRooms;
  const shareOrig = share.slice();
  for (let attempt2 = 0; attempt2 < 3; attempt2++) {
    occ.fill(0); nodes.length = 0; corridors.length = 0; nid = 0; cid = 0;
    share.length = shareOrig.length;
    for (let i2 = 0; i2 < shareOrig.length; i2++) share[i2] = shareOrig[i2];
    zoneRooms = [];

    /* 入口：最下段の縁。外へ開く（描画側で南の壁を開ける） */
    const f0 = footprint();
    const ex0 = Math.floor(G / 2 - f0.w / 2);
    const entry = newRoom(ex0, entryRow - f0.h + 1, f0.w, f0.h,
      f0.shape === 'round' ? 'square' : f0.shape, 0);
    entry.entrance = true;

    let seedRoom = entry, lastDir = 0;
    let truncated = false;
    for (let z = 0; z < nZones && !truncated; z++) {
      const list = [seedRoom];
      let last = seedRoom;
      let guard = 0;
      while (list.length < share[z] && guard++ < 420) {
        let from, pref = null;
        if (P.layout === 'straight') { from = last; pref = rnd() < 0.7 ? lastDir : null; }
        else if (P.layout === 'winding') {
          from = last;
          pref = rnd() < 0.65 ? (lastDir < 2 ? pick(rnd, [2, 3]) : pick(rnd, [0, 1])) : null;
        }
        else if (P.layout === 'forking') { from = pick(rnd, list); }
        else { from = rnd() < 0.5 ? last : pick(rnd, list); }
        const got = tryGrow(from, z, pref);
        if (got) { list.push(got.room); last = got.room; lastDir = got.dirIndex; }
        else { last = pick(rnd, list); }
      }
      zoneRooms.push(list);

      /* 回廊 */
      const wantLoops = Math.round(list.length * LOOP_R[P.loops]);
      let made = 0;
      for (let t = 0; t < 40 && made < wantLoops; t++) {
        if (tryLink(pick(rnd, list), z)) made++;
      }

      /* 次の区画：関門つきの廊下で */
      if (z < nZones - 1) {
        let got = null;
        for (const from of shuffle(rnd, list)) { got = tryGrow(from, z + 1, null); if (got) break; }
        if (!got) { share.length = z + 1; truncated = true; break; }
        got.cor.gate = 'g' + z; got.cor.zone = z;
        seedRoom = got.room;
      } else {
        list[list.length - 1].goal = true;
      }
    }
    if (truncated) {
      const zl = zoneRooms[zoneRooms.length - 1];
      zl[zl.length - 1].goal = true;
    }
    if (nodes.length >= nRooms * 0.75) break;   /* 十分に育った */
  }

  /* 大広間：いちばん広い部屋に印（名前と特徴が寄る） */
  if (P.landmark) {
    let big = null;
    nodes.forEach(r => {
      if (r.entrance || r.goal) return;
      const area = r.rects.reduce((s2, q) => s2 + q.w * q.h, 0);
      if (!big || area > big.a) big = { r, a: area };
    });
    if (big) big.r.landmark = true;
  }

  const all = nodes.concat(corridors);
  const byId = {}; all.forEach(n => { byId[n.id] = n; });

  /* ── 関門 ── */
  const gates = {};
  chosen.slice(0, Math.max(0, share.length - 1)).forEach((key, z) => {
    gates['g' + z] = { id: 'g' + z, key: key.id, cond: key.cond, look: key.look, state: 'shut', zone: z };
  });

  /* ── ヒントと種：関門より手前の区画にだけ ── */
  Object.keys(gates).forEach(gid => {
    const g = gates[gid], key = KEYS[g.key];
    const before = [];
    for (let z = 0; z <= g.zone; z++) (zoneRooms[z] || []).forEach(r => { if (!r.entrance && !r.ev) before.push(r); });
    const bag = shuffle(rnd, before);
    if (key.hint && bag.length) { const r = bag.pop(); r.ev = { t: 'hint', gate: gid, key: key.id }; }
    if (key.seed && bag.length) { const r = bag.pop(); r.ev = { t: 'seed', gate: gid, key: key.id }; }
    if (key.cond.t === 'slay' && bag.length) { const r = bag.pop(); r.ev = { t: 'foe', gate: gid, key: key.id }; }
  });

  /* ── 形クラス（描写・通り名用）── */
  nodes.forEach(r => {
    const area = r.rects.reduce((s2, q) => s2 + q.w * q.h, 0);
    const asp = Math.max(r.w / r.h, r.h / r.w);
    r.cls = r.shape === 'round' ? 'round' : (area >= 12 || r.landmark) ? 'big' : asp >= 1.9 ? 'long' : 'small';
  });

  /* ── 通り名と真名 ── */
  const usedAlias = {};
  nodes.forEach(r => {
    if (r.entrance) { r.alias = '入口の間'; return; }
    if (r.goal) { r.alias = '最奥の間'; return; }
    if (r.landmark) { r.alias = '大広間'; return; }
    for (let t = 0; t < 10; t++) {
      const a = VARI.expand(SHAPES[r.cls].alias, {}, rnd);
      if (!usedAlias[a] || t === 9) { usedAlias[a] = 1; r.alias = a; return; }
    }
  });
  const tmpl = dun.tags.map(t => NAME_BY_TAG[t]).filter(Boolean);
  const usedName = {};
  const giveName = r => {
    if (!tmpl.length || r.name) return;
    for (let t = 0; t < 12; t++) {
      const nm = VARI.expand(pick(rnd, tmpl), {}, rnd);
      if (!usedName[nm]) { usedName[nm] = 1; r.name = nm; return; }
    }
  };
  nodes.forEach(r => { if (r.ev) giveName(r); });
  nodes.forEach(r => { if (!r.ev && !r.entrance && !r.goal && rnd() < 0.25) giveName(r); });

  /* ── 特徴と、部屋の中の配置 ── */
  const fpool = Object.keys(FEATURES).filter(id =>
    FEATURES[id].tags.some(t => dun.tags.indexOf(t) >= 0));
  const fused = {};
  nodes.forEach(r => {
    r.features = [];
    if (r.entrance || !fpool.length) return;
    const hasAlcove = r.rects.length > 1;
    let n2 = (r.landmark ? 1 : 0) + (rnd() < 0.5 ? 1 : rnd() < 0.24 ? 2 : 0);
    if (hasAlcove && n2 < 1) n2 = 1;        /* 窪みのある部屋には、必ず何かがある */
    const cand = shuffle(rnd, fpool.filter(id => (fused[id] || 0) < 2));
    for (let i = 0; i < n2 && i < cand.length; i++) {
      if (r.features.indexOf(cand[i]) >= 0) continue;
      r.features.push(cand[i]); fused[cand[i]] = (fused[cand[i]] || 0) + 1;
    }
  });
  const SLOTS = [
    { dx: -0.27, dy: 0.02, w: '西' }, { dx: 0.27, dy: 0.02, w: '東' },
    { dx: 0, dy: -0.26, w: '北' },   { dx: 0, dy: 0.26, w: '南' }
  ];
  nodes.forEach(r => {
    r.fpos = {};
    const sl = shuffle(rnd, SLOTS);
    (r.features || []).forEach((fid, i) => { r.fpos[fid] = sl[i % sl.length]; });
    /* 窪みがあるなら、最初の特徴はその窪みの側に置く（窪み＝それがある場所） */
    if (r.rects.length > 1 && r.features.length) {
      const m = r.rects[0], e = r.rects[1];
      const excx = e.x + e.w / 2, excy = e.y + e.h / 2;
      const ddx = excx - r.gx, ddy = excy - r.gy;
      const slot = Math.abs(ddx) > Math.abs(ddy)
        ? (ddx > 0 ? { dx: 0.3, dy: 0.02, w: '東' } : { dx: -0.3, dy: 0.02, w: '西' })
        : (ddy > 0 ? { dx: 0, dy: 0.3, w: '南' } : { dx: 0, dy: -0.3, w: '北' });
      r.fpos[r.features[0]] = slot;
      r.alcoveFeat = r.features[0];
    }
  });

  /* ── 特徴の規模と隊列（シードと部屋IDから決める。生成の乱数列は乱さない） ── */
  const fhash = (rid, fid) => {
    let h = (seed >>> 0) ^ 2166136261;
    const s2 = rid + ':' + fid;
    for (let i = 0; i < s2.length; i++) h = Math.imul(h ^ s2.charCodeAt(i), 16777619);
    h ^= h >>> 15; h = Math.imul(h, 2246822519); h ^= h >>> 13;
    return (h >>> 0) / 4294967296;
  };
  nodes.forEach(r => {
    r.fmag = {}; r.fform = {};
    const area = r.w * r.h;
    (r.features || []).forEach(fid => {
      const hv = fhash(r.id, fid);
      if (fid === 'pool' || fid === 'moss' || fid === 'bones') {
        let mag = hv < 0.4 ? 1 : hv < 0.72 ? 2 : 3;
        if (area < 6 && mag > 2) mag = 2;   /* ごく狭い部屋に「半分を占める」は置かない */
        if (area < 6) mag = 1;
        r.fmag[fid] = mag;
      } else if (fid === 'statue' && area >= 6 && hv > 0.4) {
        const forms = [[2, 2], [2, 3], [3, 3], [2, 4]];
        const f2 = forms[Math.floor(fhash(r.id, 'statue#f') * forms.length)];
        const rows = Math.min(f2[0], Math.max(1, r.h - 1));
        const cols = Math.min(f2[1], Math.max(2, r.w - 1));
        if (rows * cols >= 3) r.fform[fid] = { rows, cols };   /* 3体未満は1体扱い */
      }
    });
  });

  return {
    seed, dungeon: dun.id, profile: P,
    rooms: nodes.length, zones: share.length,
    nodes: all, byId, gates, start: nodes[0].id,
    goal: (nodes.find(n => n.goal) || nodes[nodes.length - 1]).id,
    keys: chosen.slice(0, Math.max(0, share.length - 1)).map(k => k.id),
    grid: G, roughPx: ROUGH_PX[P.rough]
  };
}

/* ---------- 検算 ---------- */
const FREE = { spare: 1, hurtless: 1, light: 1, party: 1, word: 1 };
function verify(map) {
  const seen = {}, satisfied = {};
  let changed = true, steps = 0;
  const walk = () => {
    const q = [map.start]; const vis = { [map.start]: 1 };
    while (q.length) {
      const n = map.byId[q.shift()];
      seen[n.id] = 1;
      for (const lid of n.links) {
        const l = map.byId[lid];
        if (!l) continue;
        if (l.kind === 'corridor' && l.gate && !satisfied[l.gate]) continue;
        if (!vis[l.id]) { vis[l.id] = 1; q.push(l.id); }
      }
    }
  };
  while (changed && steps++ < 20) {
    changed = false;
    walk();
    for (const id in seen) {
      const n = map.byId[id];
      if (n && n.ev && (n.ev.t === 'seed' || n.ev.t === 'foe') && !satisfied[n.ev.gate]) {
        satisfied[n.ev.gate] = 1; changed = true;
      }
    }
    for (const gid in map.gates) {
      if (satisfied[gid]) continue;
      if (FREE[map.gates[gid].cond.t]) { satisfied[gid] = 1; changed = true; }
    }
  }
  const reachable = !!seen[map.goal];
  const orphan = map.nodes.filter(n => !seen[n.id]).map(n => n.id);
  const placed = {};
  map.nodes.forEach(n => { if (n.ev) placed[n.ev.gate + ':' + n.ev.t] = 1; });
  const missing = [];
  for (const gid in map.gates) {
    const k = KEYS[map.gates[gid].key];
    if (k.hint && !placed[gid + ':hint']) missing.push(gid + ' のヒント');
    if (k.seed && !placed[gid + ':seed']) missing.push(gid + ' の種');
    if (k.cond.t === 'slay' && !placed[gid + ':foe']) missing.push(gid + ' の相手');
    if (!FREE[k.cond.t] && !k.seed && k.cond.t !== 'slay') missing.push(gid + ' の手立て');
  }
  return { ok: reachable && !missing.length, reachable, orphan, satisfied, missing };
}




/* ================= 状態 ================= */
var PARTY = [
  { n:'聖騎士', hp:14, mx:14, row:0 }, { n:'狂戦士', hp:12, mx:12, row:0 },
  { n:'槍兵',   hp:11, mx:11, row:0 }, { n:'高僧',   hp:9,  mx:9,  row:1 },
  { n:'魔法使い', hp:8,  mx:8,  row:1 }, { n:'弓兵',   hp:10, mx:10, row:1 }
];
var S = null;

function rnd(){ return Math.random(); }
function ctxOf(dun){
  var d = DUNGEONS[dun], c = {};
  for (var k in d.V) (function(k){ c[k] = function(){ return VARI.expand(d.V[k], c, rnd); }; })(k);
  c.who  = function(){ var a=PARTY.filter(function(p){return p.hp>0;}); return (a[Math.floor(rnd()*a.length)]||PARTY[0]).n; };
  c.hurt = function(){
    var a = PARTY.filter(function(p){ return p.hp>0 && p.hp < p.mx; });
    if (!a.length) a = PARTY.filter(function(p){ return p.hp>0; });
    return (a[Math.floor(rnd()*a.length)]||PARTY[0]).n;
  };
  return c;
}
function KNUM(v){
  var K = '〇一二三四五六七八九';
  if (v <= 9) return K[v];
  if (v === 10) return '十';
  return v < 20 ? '十' + K[v - 10] : String(v);
}
function tidy(s){
  return s.replace(/([^\x00-\x7F]) +/g, '$1').replace(/ +([^\x00-\x7F])/g, '$1')
          .replace(/。+/g, '。').replace(/、。/g, '。');
}
function narrBox(){ return document.getElementById('narr'); }
function say(t, cls, ctx2){
  var box = narrBox();
  var p = document.createElement('p');
  if (cls) p.className = cls;
  p.textContent = tidy(VARI.expand(t, ctx2 || S.ctx, rnd));
  box.appendChild(p);
  while (box.children.length > 60) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
  return p;
}
function caption(txt){
  var box = narrBox();
  var p = document.createElement('p');
  p.className = 'cap';
  p.textContent = '◆ ' + txt;
  box.appendChild(p);
  return p;
}

/* ================= 場所の名前 ================= */
function labelOf(n){
  if (n.kind === 'corridor') return '通路';
  return (n.revealed && n.name) ? n.name : (n.alias || '名の無い部屋');
}

/* ================= 方角と出口 ================= */
function exitsOf(n){
  var out = [];
  n.links.forEach(function(cid){
    var c = S.map.byId[cid];
    if (!c) return;
    if (n.kind === 'corridor'){
      var f0 = S.map.byId[cid];       /* corridor の links は部屋 */
      var dx0 = f0.gx - n.gx, dy0 = f0.gy - n.gy;
      out.push({ via:null, far:f0,
        dir: Math.abs(dx0) > Math.abs(dy0) ? (dx0 > 0 ? '東' : '西') : (dy0 > 0 ? '南' : '北') });
    } else {
      var far = S.map.byId[c.from === n.id ? c.to : c.from];
      var dx = c.gx - n.gx, dy = c.gy - n.gy;
      out.push({ via:c, far:far,
        dir: Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? '東' : '西') : (dy > 0 ? '南' : '北') });
    }
  });
  var ord = { '北':0, '東':1, '西':2, '南':3 };
  out.sort(function(a,b){ return ord[a.dir] - ord[b.dir]; });
  return out;
}
function exitState(e){
  if (e.via && e.via.gate && !S.open[e.via.gate]) return 'gate';
  if (S.been[e.far.id]) return 'been';
  if (S.seen[e.far.id]) return 'seen';
  return 'unseen';
}

/* ================= 灯り =================
   光はマス単位で届く。届いたマスだけが地図に描かれ、
   その先は闇に呑まれて途切れる（＝部屋の輪郭が先に分かってしまわない）。
   灯りなし: 2マス ／ 松明: 5マス ／ 魔法使いのトーチ: 9マス（6歩つづく） */
/* ================= 灯り =================
   A案：部屋に入る＝一行が松明を掲げてひと巡りする。輪郭は地図に記録される。
   「いま見えている光」は、立ち位置を中心にした本物の円（縁はやわらかく）。
   壁と閉ざされた扉の向こうへは光は届かない。
   灯りなし: 半径1.5マス ／ 松明: 半径3.2マス                          */
function lightRadius(){ return S.torch ? 3.2 : 1.5; }

function cellIndex(){
  if (S.cellIdx) return S.cellIdx;
  var idx = {};
  S.map.nodes.forEach(function(n){
    if (n.kind === 'room') n.rects.forEach(function(q){
      for (var b2 = q.y; b2 < q.y + q.h; b2++)
        for (var a2 = q.x; a2 < q.x + q.w; a2++) idx[a2 + ',' + b2] = n;
    });
    else n.cells.forEach(function(c){ idx[c[0] + ',' + c[1]] = n; });
  });
  S.cellIdx = idx;
  return idx;
}

function partyCell(){
  var cur = S.map.byId[S.at];
  if (cur.kind === 'corridor'){ var mid = cur.cells[cur.cells.length >> 1]; return [mid[0] + 0.5, mid[1] + 0.5]; }
  return [cur.gx + (S.pos ? S.pos.ox : 0) * cur.w, cur.gy + (S.pos ? S.pos.oy : 0) * cur.h];
}

function reveal(){
  var idx = cellIndex();
  var cur = S.map.byId[S.at];

  /* ── いま光が触れている場所（壁ごしには届かない）。描画と語りに使う ── */
  var pc = partyCell(), pcx = pc[0], pcy = pc[1];
  var R = lightRadius();
  var sx = Math.floor(pcx), sy = Math.floor(pcy);
  S.lightNow = {};
  var q = [[sx, sy]], vis = {}; vis[sx + ',' + sy] = 1;
  while (q.length){
    var it = q.shift(), x = it[0], y = it[1];
    var n = idx[x + ',' + y];
    if (!n) continue;
    S.lightNow[n.id] = 1;
    S.seen[n.id] = 1;
    if (n.kind === 'corridor' && n.gate && !S.open[n.gate]) continue;   /* 扉で光は途切れる */
    [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]].forEach(function(t){
      var k2 = t[0] + ',' + t[1];
      if (vis[k2] || !idx[k2]) return;
      var dx3 = t[0] + 0.5 - pcx, dy3 = t[1] + 0.5 - pcy;
      if (dx3 * dx3 + dy3 * dy3 > R * R) return;
      vis[k2] = 1; q.push(t);
    });
  }

  /* ── 魔法使いのトーチ：光の精霊が2部屋先まで飛び、輪郭だけを探ってくる ── */
  if (S.spellLeft > 0){
    var nq = [[cur.id, 0]], nvis = {}; nvis[cur.id] = 1;
    while (nq.length){
      var e2 = nq.shift(), n2 = S.map.byId[e2[0]], d2 = e2[1];
      S.sensed[n2.id] = 1;
      n2.links.forEach(function(lid){
        var l = S.map.byId[lid];
        if (!l || nvis[l.id]) return;
        if (l.kind === 'corridor' && l.gate && !S.open[l.gate]){
          nvis[l.id] = 1; S.sensed[l.id] = 1; return;
        }
        var nd = l.kind === 'room' ? d2 + 1 : d2;
        if (nd > 2) return;
        nvis[l.id] = 1; nq.push([l.id, nd]);
      });
    }
  }
}

/* ================= 地図の絵 =================
   ・踏破した部屋と通路 … 完全な形＋方眼（地図の記憶）
   ・精霊が探った場所   … 輪郭だけ（うすい床）
   ・いまの光の円       … 未踏の床が、円の中だけ浮かび上がって縁で闇に溶ける
   ふだんは現在地まわりの窓表示。タップで全体（＋／－で拡大縮小）。   */
var CELL = 40;
var CORW = { narrow: 16, wide: 26 };
var INK = '#241f14';
var VIEW = 13;
function knownFull(n){ return S.been[n.id] || S.sensed[n.id]; }
function drawMap(){
  var ns = S.map.nodes;
  var corw = CORW[S.map.profile.corWidth] || 16;
  var zoomed = document.body.classList.contains('mapzoom');
  var pc = partyCell(), pcx = pc[0], pcy = pc[1];
  var R = lightRadius();

  /* 枠：記憶している形＋いまの光の円 */
  var f = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  var eat = function(x, y){ f.x0 = Math.min(f.x0, x); f.y0 = Math.min(f.y0, y);

  ns.forEach(function(n){
    if (!knownFull(n)) return;

  var bx0 = Math.floor(f.x0) - 1, by0 = Math.floor(f.y0) - 1;

    var ccx = Math.floor(cn.gx), ccy = Math.floor(cn.gy);
    side = VIEW;
    x0 = Math.max(bx0, Math.min(ccx - (VIEW >> 1), bx0 + bw - VIEW));

  var W = Math.round(side * CELL);
  var px = function(x){ return (x - x0) * CELL; }, py = function(y){ return (y - y0) * CELL; };
  var LX = px(pcx), LY = py(pcy), LR = R * CELL;

  var s = '<svg viewBox="0 0 ' + W + ' ' + W + '" role="img" aria-label="ダンジョンの地図">';
  s += '<defs>'
    + '<filter id="rgh" x="-20%" y="-20%" width="140%" height="140%">'

    + '<feDisplacementMap in="SourceGraphic" in2="n" scale="' + (S.map.roughPx || 0) + '"/></filter>'
    + '<pattern id="gp" width="' + CELL + '" height="' + CELL + '" patternUnits="userSpaceOnUse">'
    + '<rect width="' + CELL + '" height="' + CELL + '" fill="#f0ead9"/>'
    + '<path d="M' + CELL + ' 0H0V' + CELL + '" fill="none" stroke="#ccc1a1" stroke-width="1.6"/></pattern>'
    + '<pattern id="dots" width="' + CELL + '" height="' + CELL + '" patternUnits="userSpaceOnUse">'
    + '<rect width="' + CELL + '" height="' + CELL + '" fill="#e6dfca"/>'
    + '<circle cx="' + (CELL / 2) + '" cy="' + (CELL / 2) + '" r="1.2" fill="#c7bd9f"/></pattern>'
    + '<radialGradient id="pg">'
    + '<stop offset="0" stop-color="#c33a2e" stop-opacity="0.5"/>'
    + '<stop offset="0.7" stop-color="#c33a2e" stop-opacity="0.18"/>'
    + '<stop offset="1" stop-color="#c33a2e" stop-opacity="0"/></radialGradient>'
    + '<radialGradient id="lg">'
    + '<stop offset="0" stop-color="#fff" stop-opacity="1"/>'
    + '<stop offset="0.72" stop-color="#fff" stop-opacity="1"/>'
    + '<stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>'
    + '<mask id="lm"><rect x="0" y="0" width="' + W + '" height="' + W + '" fill="#000"/>'
    + '<circle cx="' + LX + '" cy="' + LY + '" r="' + LR + '" fill="url(#lg)"/></mask>'
    + '<radialGradient id="dkg">'
    + '<stop offset="0" stop-color="#000"/>'
    + '<stop offset="0.7" stop-color="#000"/>'
    + '<stop offset="1" stop-color="#fff"/></radialGradient>'
    + '<radialGradient id="warm">'
    + '<stop offset="0" stop-color="#ffd98a" stop-opacity="0.28"/>'
    + '<stop offset="0.75" stop-color="#ffd98a" stop-opacity="0.1"/>'
    + '<stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>'
    + '</defs>';
  s += '<rect x="0" y="0" width="' + W + '" height="' + W + '" fill="url(#dots)"/>';

  /* 図形をつくる。known = 記憶（踏破・探知）、spill = いまの光だけで見えている未踏 */
  var mkPrims = function(filter){
    var out = [];
    ns.forEach(function(n){
      if (!filter(n)) return;
      if (n.kind === 'room'){
        if (n.shape === 'round') out.push({ n: n, k: 'c', cx: px(n.gx), cy: py(n.gy), r: n.w * CELL / 2 });
        else n.rects.forEach(function(q2){

        var xs = n.cells.map(function(c){ return c[0]; }), ys2 = n.cells.map(function(c){ return c[1]; });

        var mny = Math.min.apply(null, ys2), mxy = Math.max.apply(null, ys2);

  };

  var known = mkPrims(function(n){ return knownFull(n); });
  var spill = mkPrims(function(n){ return !knownFull(n) && S.lightNow && S.lightNow[n.id]; });

  /* 記憶している形：荒れた外周 → 黒壁 → 床 */
  if (S.map.roughPx){
    s += '<g filter="url(#rgh)">';
    known.forEach(function(p2){ s += geom(p2, 12) + ' fill="#57503b" opacity="0.85"/>'; });
    s += '</g>';
  } else {
    known.forEach(function(p2){ s += geom(p2, 10) + ' fill="#57503b" opacity="0.35"/>'; });
  }
  known.forEach(function(p2){ s += geom(p2, 4) + ' fill="' + INK + '"/>'; });
  known.forEach(function(p2){
    s += geom(p2, 0) + ' fill="' + (S.been[p2.n.id] ? 'url(#gp)' : '#d8d0b6') + '"/>';
  });

  /* いまの光だけで見えている未踏の床：本物の円で切り抜き、縁は闇に溶ける */
  if (spill.length){

    spill.forEach(function(p2){ s += geom(p2, 4) + ' fill="' + INK + '"/>'; });
    spill.forEach(function(p2){ s += geom(p2, 0) + ' fill="#ddd5bc"/>'; });
    /* 既知の床を描き直して、通路の端の墨が部屋の中に「蓋」を作らないようにする */
    known.forEach(function(p2){

    });

  }

  /* 入口：南の壁を外へ開ける */
  var ent = null;
  ns.forEach(function(n){ if (n.entrance) ent = n; });
  if (ent && knownFull(ent)){
    var m = ent.rects[0];
    var ox = px(m.x + m.w / 2) - CELL * 0.4, oy = py(m.y + m.h) - 6;
    s += '<rect x="' + ox + '" y="' + oy + '" width="' + (CELL * 0.8) + '" height="' + (CELL * 0.72) + '" fill="'
      + (S.been[ent.id] ? 'url(#gp)' : '#d8d0b6') + '"/>'
      + '<rect x="' + (ox - 5) + '" y="' + oy + '" width="5" height="' + (CELL * 0.72) + '" fill="' + INK + '"/>'
      + '<rect x="' + (ox + CELL * 0.8) + '" y="' + oy + '" width="5" height="' + (CELL * 0.72) + '" fill="' + INK + '"/>';
  }

  /* 踏んだ場所の縁：まだ知らない隣を、実際の地図から少しだけ見せる
     ・踏んだ部屋 → 未知の通路 … 実物の通路を半マスだけ（先はぶった切り。部屋へは食い込まない）
     ・踏んだ通路 → 未知の部屋 … つながる口のまわりだけチラ見せ（行き止まりに見せない） */
  var idx2 = cellIndex();
  var clipN = 0;
  var dirTo = function(e, node){
    if ((idx2[(e[0] + 1) + ',' + e[1]] || {}).id === node.id) return 'E';
    if ((idx2[(e[0] - 1) + ',' + e[1]] || {}).id === node.id) return 'W';
    if ((idx2[e[0] + ',' + (e[1] + 1)] || {}).id === node.id) return 'S';
    if ((idx2[e[0] + ',' + (e[1] - 1)] || {}).id === node.id) return 'N';
    return null;
  };
  var endCell = function(c, n){
    var e0 = c.cells[0], e1 = c.cells[c.cells.length - 1];
    var d0 = Math.pow(e0[0] + 0.5 - n.gx, 2) + Math.pow(e0[1] + 0.5 - n.gy, 2);
    var d1 = Math.pow(e1[0] + 0.5 - n.gx, 2) + Math.pow(e1[1] + 0.5 - n.gy, 2);
    return d0 <= d1 ? e0 : e1;
  };
  var wallAt = function(e, nd){
    return nd === 'E' ? px(e[0] + 1) : nd === 'W' ? px(e[0])

  var latOf = function(e, nd){

      : px(e[0]) + (CELL - corw) / 2;
  };
  var rectOf = function(nd, a0, a1, l0, l1){
    return (nd === 'E' || nd === 'W')
      ? { x: a0, y: l0, w: a1 - a0, h: l1 - l0 }
      : { x: l0, y: a0, w: l1 - l0, h: a1 - a0 };
  };
  var clipOpen = function(r2){

    s += '<clipPath id="' + cid + '"><rect x="' + r2.x + '" y="' + r2.y
      + '" width="' + r2.w + '" height="' + r2.h + '"/></clipPath>'
      + '<g clip-path="url(#' + cid + ')">';
  };
  var prims1 = function(node){ return mkPrims(function(z){ return z.id === node.id; }); };
  var drawPiece = function(ps, floorFill){
    if (S.map.roughPx){
      s += '<g filter="url(#rgh)">';
      ps.forEach(function(p2){ s += geom(p2, 12) + ' fill="#57503b" opacity="0.85"/>'; });
      s += '</g>';
    }
    ps.forEach(function(p2){ s += geom(p2, 4) + ' fill="' + INK + '"/>'; });
    ps.forEach(function(p2){ s += geom(p2, 0) + ' fill="' + floorFill + '"/>'; });
  };
  ns.forEach(function(n){
    if (!knownFull(n)) return;
    if (n.kind === 'room'){
      n.links.forEach(function(lid){
        var c = S.map.byId[lid];
        if (!c || c.kind !== 'corridor' || knownFull(c)) return;
        var e = endCell(c, n);
        var nd = dirTo(e, n); if (!nd) return;

        var L2 = CELL * 0.5;                    /* 見せるのは半マスだけ */
        var far2 = (nd === 'E' || nd === 'S');  /* 部屋が奥側 → 通路は手前側 */
        clipOpen(rectOf(nd, far2 ? wall - L2 : wall, far2 ? wall : wall + L2,
                        lat - 18, lat + corw + 18));
        drawPiece(prims1(c), '#d8d0b6');
        s += '</g>';
        if (n.shape === 'round'){
          /* 丸い部屋は壁が弧なので、床だけ内側へ通して口をあける */
          var rin = CELL * 0.55;
          clipOpen(rectOf(nd, far2 ? wall : wall - rin, far2 ? wall + rin : wall,
                          lat - 2, lat + corw + 2));
          prims1(c).forEach(function(p2){ s += geom(p2, 0) + ' fill="#d8d0b6"/>'; });
          var rf = S.been[n.id] ? 'url(#gp)' : '#d8d0b6';
          prims1(n).forEach(function(p2){ s += geom(p2, 0) + ' fill="' + rf + '"/>'; });
          s += '</g>';
        }
      });
      return;
    }
    /* 輪郭を知っている通路の先が未知の部屋なら、口だけ見せる（行き止まりに見せない）。

    if (n.gate && !S.open[n.gate]) return;
    [n.from, n.to].forEach(function(rid){
      var r = S.map.byId[rid];
      if (!r || knownFull(r)) return;
      var e = endCell(n, r);
      var nd = dirTo(e, r); if (!nd) return;
      var wall = wallAt(e, nd), lat = latOf(e, nd);
      var D2 = CELL * 0.45;
      var far2 = (nd === 'E' || nd === 'S');    /* 部屋が奥側 */
      clipOpen(rectOf(nd, far2 ? wall - 8 : wall - D2, far2 ? wall + D2 : wall + 8,
                      lat - 22, lat + corw + 22));
      drawPiece(prims1(r), '#d8d0b6');
      /* 口：通路の床で壁を破り、部屋へ続いていることを示す */
      var md = r.shape === 'round' ? CELL * 0.5 : 6;
      var mr = rectOf(nd, far2 ? wall - 8 : wall - md, far2 ? wall + md : wall + 8,
                      lat, lat + corw);
      s += '<rect x="' + mr.x + '" y="' + mr.y + '" width="' + mr.w + '" height="' + mr.h
        + '" fill="' + (S.been[n.id] ? 'url(#gp)' : '#d8d0b6') + '"/>';

    });
  });

  /* 部屋の特徴：地図職人の注記として、踏んだ部屋にだけ描く（インクの線画） */
  var frnd = function(rid, fid){
    var h = ((S.map.seed >>> 0) ^ 2166136261) >>> 0;

    for (var i = 0; i < s3.length; i++) h = Math.imul(h ^ s3.charCodeAt(i), 16777619);

    var cx = px(n.gx + (fp ? fp.dx : 0) * n.w), cy = py(n.gy + (fp ? fp.dy : 0) * n.h);
    var r2 = frnd(n.id, fid);
    var side = fp ? fp.w : '北';
    var hw = (side === '北' || side === '南');   /* 壁沿いのものの向き */
    var x0e = px(n.gx) - n.w * CELL / 2, y0e = py(n.gy) - n.h * CELL / 2;
    var g = '', i2, a2, t2;
    if (fid === 'statue'){
      var one = function(x, y, sc){
        return '<rect x="' + (x - 4 * sc).toFixed(1) + '" y="' + (y - 4 * sc).toFixed(1)
          + '" width="' + (8 * sc) + '" height="' + (8 * sc) + '" rx="1"/>'
          + '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (2.1 * sc) + '" fill="' + INK + '" stroke="none"/>';
      };
      if (form){
        var gw = n.w * CELL * 0.6, gh = n.h * CELL * 0.6;
        for (var rI = 0; rI < form.rows; rI++)
          for (var cI = 0; cI < form.cols; cI++)

    } else if (fid === 'pool'){

      if (mag === 3){

        pcx = px(n.gx) + (fp ? fp.dx : 0) * n.w * CELL * 0.35;
        pcy = py(n.gy) + (fp ? fp.dy : 0) * n.h * CELL * 0.35;
      } else if (mag === 2){ prx = CELL * 0.55; pry = CELL * 0.42; }
      else { prx = CELL * 0.28; pry = CELL * 0.22; }
      var pts = [];
      for (a2 = 0; a2 < 11; a2++){
        var th = a2 / 11 * Math.PI * 2, rj = 0.82 + r2() * 0.3;
        pts.push((pcx + Math.cos(th) * prx * rj).toFixed(1) + ' ' + (pcy + Math.sin(th) * pry * rj).toFixed(1));
      }
      g += '<path d="M' + pts.join('L') + 'Z" fill="' + INK + '" fill-opacity="0.09"/>'
        + '<path d="M' + (pcx - prx * 0.35).toFixed(1) + ' ' + pcy.toFixed(1) + ' q ' + (prx * 0.2).toFixed(1) + ' 3 ' + (prx * 0.45).toFixed(1) + ' 0" fill="none"/>'
        + '<path d="M' + (pcx - prx * 0.1).toFixed(1) + ' ' + (pcy + pry * 0.35).toFixed(1) + ' q ' + (prx * 0.18).toFixed(1) + ' 3 ' + (prx * 0.4).toFixed(1) + ' 0" fill="none"/>';
    } else if (fid === 'moss'){

      for (i2 = 0; i2 < dots; i2++){

            else if (edge === 1){ mx2 = x0e + along * n.w * CELL; my2 = y0e + n.h * CELL - ins; }
            else if (edge === 2){ mx2 = x0e + ins; my2 = y0e + along * n.h * CELL; }
            else { mx2 = x0e + n.w * CELL - ins; my2 = y0e + along * n.h * CELL; }
          } else { mx2 = px(n.gx) + (r2() - 0.5) * n.w * CELL * 0.8; my2 = py(n.gy) + (r2() - 0.5) * n.h * CELL * 0.8; }
