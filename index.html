  /* --- 盤面：P1(左) 後衛|前衛 ‖ 前衛|後衛 P2(右) ---
     DOM順が P2後→P2前→交戦線→P1前→P1後 なので、row-reverse で P1 が左に来る */
  #app.land > .field{flex-direction:row-reverse;align-items:stretch;gap:7px;
    padding:24px 10px 8px;position:relative;box-sizing:border-box;min-height:0;height:100%}
  /* 横3マスの行を、縦3マスの列に組み替える */
  #app.land .field .grid3{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr));
    flex:1 1 0;min-width:0;min-height:0;gap:6px}
  #app.land .field .cell{aspect-ratio:auto;min-height:0}
  #app.land .field .cell .unit{aspect-ratio:auto;height:100%}

  /* 交戦ラインを縦向きに */
  #app.land .warline{width:30px;flex:0 0 30px;height:auto;align-self:stretch;margin:0}
  #app.land .warline .wl-mid{height:100%;width:30px;flex-direction:column;
    padding:8px 0;justify-content:space-between}
  #app.land .warline .wl-tag{writing-mode:vertical-rl;letter-spacing:.34em}
  #app.land .warline .wl-edge{display:none}
  #app.land .warline .wl-arrow{writing-mode:vertical-rl;letter-spacing:.1em}

  /* 陣営名は盤面の上に帯として置く */
  #app.land .side-tag{position:absolute;top:1px;height:22px;font-size:11.5px;z-index:5;
    background:none;border:none;padding:0;display:flex;align-items:center;gap:7px}
  #app.land .side-tag.s0{left:12px}
  #app.land .side-tag.s1{right:12px;flex-direction:row-reverse}

  /* 横向きは行動順バーとログを常に畳む（縦の余裕がないため） */
  #app.land .orderline,#app.land .turnbar,#app.land .loglast{display:none}
}

/* --- 操作パネルは画面右に出す --- */
@media (orientation: landscape) {
  /* 操作パネルは右サイドに固定（実機で見比べて決定） */
  #app.land.lp-side{grid-template-areas:"hdr hdr" "field panel";
    grid-template-columns:1fr minmax(240px,30vw);grid-template-rows:auto minmax(0,1fr)}
  #app.land.lp-side > .hdr{grid-area:hdr}
  #app.land.lp-side > .field{grid-area:field}
  #app.land.lp-side > .actpanel{grid-area:panel;position:static;min-height:0;overflow-y:auto;
    border-top:none;border-left:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:center}
}
.poolopt.tgl.sub{margin-left:14px;border-left:2px solid rgba(242,198,92,.35)}
.dm small{font-size:10px;color:#7686a6;font-weight:700;margin-left:4px}

/* ===== v25: 対戦開始（端末を横に）画面 ===== */
#screen-ready{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:26px 22px calc(26px + var(--safe-b));text-align:center;max-width:460px;margin:0 auto}
.rd-art{width:200px;max-width:70%}
.rd-art svg{width:100%;height:auto;display:block}
.rd-art .dev{fill:none;stroke:#3d4a68;stroke-width:3}
.rd-art .dev-l{fill:none;stroke:#3d4a68;stroke-width:3;opacity:.35;transition:opacity .35s,stroke .35s}
.rd-art .arr{stroke:var(--gold);stroke-width:2.5;stroke-dasharray:4 5;opacity:.85}
.rd-art .arr-h{fill:var(--gold)}
.rd-art .ppl{fill:none;stroke-width:2.5}
.rd-art .ppl.p1{stroke:var(--p1)} .rd-art .ppl.p2{stroke:var(--p2)}
.rd-art.ok .dev{opacity:.25}
.rd-art.ok .dev-l{opacity:1;stroke:var(--gold)}
.rd-art.ok .arr,.rd-art.ok .arr-h{opacity:.25}
#screen-ready h2{font-size:19px;letter-spacing:.06em;margin:0;color:var(--gold)}
.rd-lead{font-size:13.5px;line-height:1.9;color:#c3cee6;margin:0}
.rd-note{font-size:11.5px;line-height:1.8;color:#7686a6;margin:0}
#screen-ready .btn.primary{width:100%;padding:16px;font-size:16px;margin-top:6px}
#screen-ready .btn.ghost{width:100%;padding:10px}
/* 横向きになったら詰めて表示 */
@media (orientation:landscape) and (max-height:520px){
  #screen-ready{gap:8px;padding:12px 22px}
  .rd-art{width:120px}
  #screen-ready h2{font-size:16px}
  .rd-lead{font-size:12px;line-height:1.6}
  .rd-note{display:none}
  #screen-ready .btn.primary{padding:12px;margin-top:2px}
}

/* ===== v26: 説明文の抑制／操作パネル内の行動順 ===== */
/* 何戦かしたら操作説明を畳む。
   技ボタンをもう一度押せば実行できるので、毎回の操作案内は不要。
   「何体に当たるか」だけ残す。 */
.hint.quiet .subhint,.hint.quiet .go{display:none}
.hint.quiet{font-size:11px;opacity:.9;padding-bottom:2px}

/* 操作パネル内の行動順。縦持ちや下の帯では出さない（すでに上に出ているため） */
.ordmini{display:none}
#app.land.lp-side .ordmini{display:flex;flex-direction:column;min-height:0;
  margin-top:10px;border-top:1px solid var(--line);padding-top:8px;flex:1 1 auto}
.om-hd{font-size:10px;letter-spacing:.16em;font-weight:900;color:var(--gold);
  display:flex;justify-content:space-between;align-items:center;padding:0 2px 5px}
.om-hd span{color:#7686a6;letter-spacing:.06em}
.om-list{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:3px;
  scrollbar-width:none}
.om-list::-webkit-scrollbar{display:none}
.om{display:flex;align-items:center;gap:6px;padding:2px 5px;border-radius:7px;
  background:rgba(255,255,255,.03);border:1px solid transparent}
.om .n{font-size:9.5px;font-weight:900;color:#66748f;width:13px;text-align:right;flex:0 0 auto}
.om .pic{width:20px;height:20px;border-radius:5px;overflow:hidden;background:#000;flex:0 0 auto}
.om .pic svg{width:100%;height:100%;display:block}
.om .nm{font-size:11px;font-weight:800;flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.om .sp{font-size:10px;font-weight:800;color:#7fd0ff;flex:0 0 auto}
.om.s0 .nm{color:#bcd6ff} .om.s1 .nm{color:#ffc0c8}
.om.done{opacity:.4}
.om.dead{opacity:.28;text-decoration:line-through}
.om.now{border-color:var(--gold);background:rgba(242,198,92,.14)}
.om.now .nm{color:var(--gold)}

/* 全画面ボタン */
#fs{flex:0 0 auto;padding-left:9px;padding-right:9px}

/* ===== v27: 必中の“ぶち抜き”枠／行動中プレイヤーの明示 ===== */

/* 2体以上に必中のときは1つの枠でまとめて囲む。
   個々のマスの赤枠は消し、斜線ハッチだけ残して範囲を示す。 */
.field.banded .unit.tg-fixed{outline:none;box-shadow:none}
.rband.fixed{border:3px solid #ff4d63;border-radius:14px;
  box-shadow:0 0 26px rgba(255,77,99,.55),inset 0 0 34px rgba(255,77,99,.14);
  background:transparent;animation:tgtp .9s infinite}
.rband.fixed .cn{background:linear-gradient(180deg,#ff6b7d,#e02a45);color:#fff;
  border-color:#ff97a5}
.rband.fixed.heal{border-color:#3ddc84;box-shadow:0 0 26px rgba(61,220,132,.5),inset 0 0 34px rgba(61,220,132,.13)}
.rband.fixed.heal .cn{background:linear-gradient(180deg,#8ef0b4,#25b567);color:#06301a;border-color:#a9f5c9}

/* どちらのプレイヤーが行動中か ── 陣営バーを丸ごと光らせる */
.side-tag{border-radius:8px;transition:background .2s,box-shadow .2s,color .2s;
  padding:2px 8px;border:1px solid transparent}
#app.turn0 .side-tag.s0,#app.turn1 .side-tag.s1{
  background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  box-shadow:0 0 16px rgba(255,255,255,.10)}
#app.turn0 .side-tag.s0{border-color:var(--p1);color:#dbe8ff;
  background:linear-gradient(90deg,rgba(95,168,255,.30),rgba(95,168,255,.05));
  box-shadow:0 0 20px rgba(95,168,255,.35)}
#app.turn1 .side-tag.s1{border-color:var(--p2);color:#ffd8de;
  background:linear-gradient(90deg,rgba(255,95,118,.05),rgba(255,95,118,.30));
  box-shadow:0 0 20px rgba(255,95,118,.35)}
#app.turn0 .side-tag.s1,#app.turn1 .side-tag.s0{opacity:.4}
/* 数字を消したぶん、名前を読みやすく */
.side-tag{font-size:12px;letter-spacing:.1em}
/* 横向きでは、それぞれの陣地の幅いっぱいに広げて“帯”にする */
#app.land .side-tag.s0{left:10px;right:52%;justify-content:flex-start}
#app.land .side-tag.s1{left:52%;right:10px;justify-content:flex-end}

/* ===== v29: ヘッダーのアイコン化 ===== */
.hdr .btn.ico{min-width:0;padding:6px 11px;font-size:14px;font-weight:900;line-height:1}
/* 音符に斜線を引いて「消音中」を示す */
.hdr .btn.ico.snd{position:relative;font-size:16px}
.hdr .btn.ico.snd.off{color:#6c7893}
.hdr .btn.ico.snd.off::after{content:"";position:absolute;left:50%;top:50%;
  width:19px;height:2px;background:#ff6b7d;border-radius:2px;
  transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 0 5px rgba(255,107,125,.75)}

/* ===== v29: 後衛が前線へ上がるときの演出 ===== */
.unit.advancing{z-index:30;box-shadow:0 0 0 3px var(--gold),0 0 30px rgba(242,198,92,.65);
  border-radius:10px}
.unit.advancing::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;
  background:linear-gradient(180deg,rgba(242,198,92,.32),transparent 62%);
  animation:advglow .62s ease-out}
@keyframes advglow{0%{opacity:1}100%{opacity:0}}

.advtrail{position:absolute;height:16px;pointer-events:none;transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(242,198,92,0),rgba(242,198,92,.75));
  border-radius:9px;filter:blur(1px)}
.advtrail i{position:absolute;right:-2px;top:50%;width:0;height:0;
  border-left:15px solid var(--gold);border-top:11px solid transparent;
  border-bottom:11px solid transparent;transform:translateY(-50%);
  filter:drop-shadow(0 0 7px rgba(242,198,92,.9))}

.floattag{position:absolute;pointer-events:none;font-size:14px;font-weight:900;
  letter-spacing:.06em;padding:4px 12px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(180deg,#ffe08a,#e8ac1c);color:#2a2005;
  box-shadow:0 3px 14px rgba(0,0,0,.6),0 0 20px rgba(242,198,92,.55);
  border:1.5px solid #fff3c8}

/* =========================================================
   v31: 横持ちのレイアウト整理
   上段バーを右パネルへ畳み込み、盤面の縦を最大化する
   ========================================================= */
/* 縦持ちでは右パネル内のバーは出さない（上段にあるため） */
.panelbar{display:none}

@media (orientation: landscape) {
  /* 上段バーは畳む。中身は右パネルの上部へ移動 */
  #app.land > .hdr{display:none}
  #app.land{grid-template-areas:"field panel";
    grid-template-columns:1fr minmax(250px,31vw);grid-template-rows:minmax(0,1fr)}
  #app.land.lp-side > .field{grid-area:field}
  #app.land.lp-side > .actpanel{grid-area:panel}

  /* 右パネル上部のバー */
  #app.land .panelbar{display:flex;align-items:center;gap:5px;
    padding:4px 4px 7px;border-bottom:1px solid var(--line);margin-bottom:7px}
  #app.land .panelbar .t{font-size:15px;font-weight:900;letter-spacing:.04em}
  #app.land .panelbar .btn.ico{padding:5px 8px;font-size:12.5px}
  #app.land .panelbar .btn.ico.snd{font-size:14px}
  #app.land .panelbar .btn.ico.snd.off::after{width:16px}

  /* ② 「○体すべてに必ず命中」の行は出さない（赤枠で判別できるため） */
  #app.land .hint{display:none}
  /* ③ 行動中キャラの情報行も出さない（盤面で光っているので分かる） */
  #app.land .actor-line{display:none}

  #app.land .actpanel{padding:6px 9px calc(6px + var(--safe-b));justify-content:flex-start}
  #app.land .ordmini{margin-top:8px}
}

/* ③ 行動順の見出し右に「おまかせ」2種 */
.autobtns{display:flex;gap:5px}
.autob{appearance:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:3px;
  font-size:11px;font-weight:900;padding:3px 8px;border-radius:999px;letter-spacing:0;
  background:linear-gradient(180deg,#1b2338,#121829);border:1px solid #2c3854;color:#a9b8d6;
  transition:transform .07s,border-color .15s}
.autob b{font-size:10px;font-weight:900}
.autob:active{transform:scale(.94)}
.autob.on{border-color:var(--gold);color:var(--gold);
  background:linear-gradient(180deg,#2c2412,#171208);
  box-shadow:0 0 12px rgba(242,198,92,.35)}

/* ④ 交戦ラインは既定で無地。攻撃時だけ方向が流れる */
.warline .wl-flow{display:flex;gap:4px;opacity:0;transition:opacity .18s}
.warline .wl-flow i{font-style:normal;font-size:22px;font-weight:900;color:var(--gold);
  opacity:.25;line-height:1}
/* 攻めている側の色で光らせる（P1=青 / P2=赤） */
.warline.flow0 .wl-flow i{color:var(--p1)}
.warline.flow1 .wl-flow i{color:var(--p2)}
.warline.flow0{box-shadow:inset 0 0 22px rgba(95,168,255,.5)}
.warline.flow1{box-shadow:inset 0 0 22px rgba(255,95,118,.5)}
.warline.flow0 .wl-flow,.warline.flow1 .wl-flow{opacity:1}
.warline.flow0 .wl-flow i{animation:wlflow .75s linear infinite}
.warline.flow1 .wl-flow i{animation:wlflow .75s linear infinite}
.warline .wl-flow i:nth-child(2){animation-delay:.10s}
.warline .wl-flow i:nth-child(3){animation-delay:.20s}
.warline .wl-flow i:nth-child(4){animation-delay:.30s}
@keyframes wlflow{0%{opacity:.1;transform:scale(.85)}
  45%{opacity:1;transform:scale(1.25);filter:drop-shadow(0 0 12px currentColor)}
  100%{opacity:.1;transform:scale(.85)}}
/* 縦持ち：下(P1)→上(P2) は上向き、逆は下向き */
.warline .wl-flow{transform:rotate(-90deg)}
.warline.flow1 .wl-flow{transform:rotate(90deg)}
@media (orientation: landscape){
  /* 横持ち：❯は元から右向きなので回さない（以前は余計に90°回して上下を向いていた）。
     P1(左)→P2(右) はそのまま右向き、P2→P1 は全体を180°回して左向きに */
  #app.land .warline .wl-flow{transform:none;flex-direction:column;gap:6px}
  #app.land .warline.flow1 .wl-flow{transform:rotate(180deg)}
  #app.land .warline .wl-flow i{font-size:26px}
}
.acts.waiting{display:flex;align-items:center;justify-content:center;min-height:52px}
.waitmsg{font-size:12.5px;font-weight:800;color:#7686a6;letter-spacing:.08em}

/* ===== v32: 横持ちの文字を読みやすく ===== */
@media (orientation: landscape) {
  #app.land .unit .nm{font-size:14px;letter-spacing:-.01em;bottom:25px}
  #app.land .unit .hpb{height:19px;font-size:13.5px}
  #app.land .unit .spb,#app.land .unit .atb{font-size:14px;padding:2px 6px}
  #app.land .unit .rng,#app.land .unit .lnb{font-size:11px}
  #app.land .unit .tg{font-size:11px}
  #app.land .side-tag{font-size:13px}
  #app.land .om .nm{font-size:12.5px}
  #app.land .om .sp{font-size:11.5px}
  #app.land .act{font-size:14.5px}
  #app.land .act small{font-size:11.5px}
}
/* 画面が広い横持ち（iPad系）はもう一段大きく */
@media (orientation: landscape) and (min-width: 1000px) {
  #app.land .unit .nm{font-size:16.5px;bottom:30px}
  #app.land .unit .hpb{height:23px;font-size:16px}
  #app.land .unit .spb,#app.land .unit .atb{font-size:16.5px;padding:3px 8px}
  #app.land .unit .rng,#app.land .unit .lnb{font-size:12.5px}
  #app.land .side-tag{font-size:15px}
  #app.land .om .nm{font-size:14px}
  #app.land .om .sp{font-size:13px}
  #app.land .act{font-size:16px}
  #app.land .act small{font-size:12.5px}
  #app.land .panelbar .t{font-size:18px}
}
.btn.on-gold{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(242,198,92,.3)}
.actor-line .stopauto{border-color:#a8455f;color:#ffb9c5}

/* =========================================================
   v37 — キャラ詳細を「カード1枚が浮かぶ」形に作り替え
   ・キャラ絵を全幅に戻し、名前・系統・段階は絵の下端に重ねる
   ・外枠をなくしてカードだけを浮かせ、左右の幅をめいっぱい使う
   ・キャラ絵と能力は固定、スクロールするのは技の欄だけ
   ・送りボタンと閉じるは最下段に固定、はみ出しは「▼あと◯件」で伝える
   ・キャラ絵／技の欄をタップすると、その技をその場で再生する
   ========================================================= */

/* 外枠を消してカードだけを浮かせる。
   箱の高さを画面いっぱいに固定し、送りボタンと閉じるは常に画面の最下段に置く。
   こうするとカードの長さが変わってもタップ位置が動かず、連続でめくれる */
.modal .box{max-height:92svh}
.modal .box.detailbox{display:flex;flex-direction:column;overflow:hidden;
  background:transparent;border:0;padding:0;max-width:380px;height:92svh}
.detailbox .cardwrap{flex:1 1 auto;min-height:0;position:relative;
  display:flex;flex-direction:column;justify-content:center}
.detailbox .cardwrap > .bigcard{flex:0 1 auto;min-height:0;overflow:hidden;position:relative;
  display:flex;flex-direction:column;
  box-shadow:0 20px 46px rgba(0,0,0,.8),0 0 26px rgba(242,198,92,.13)}
.detailbox > .navrow,.detailbox > .btn,.detailbox > .livebox{flex:0 0 auto}
.detailbox .navrow.big.merged{margin-top:12px;display:flex;align-items:center;gap:8px}
.detailbox .navrow.big.merged .navb{flex:1 1 0;min-width:0}
.detailbox .navrow.big.merged .navpos{flex:0 0 auto;font-size:12px;font-weight:900;color:var(--dim);
  min-width:52px;text-align:center}

/* キャラ絵・名前・能力は固定。動くのは技の欄だけ。
   ただし画面が短いと絵が縦を食い尽くして技の欄が数pxになってしまうので、
   絵の高さに上限を置き、技の欄には必ず最低限の高さを残す。 */
.detailbox .dhead{flex:0 0 auto;display:block;position:relative}
.detailbox .dbody{flex:1 1 auto;min-height:112px;overflow-y:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;padding-bottom:2px}
.detailbox .dbody::-webkit-scrollbar{display:none}

/* キャラ絵（全幅）と、その下端に重ねる名前・系統・段階 */
.detailbox .dhead .art{width:100%;aspect-ratio:1/0.86;max-height:40svh;
  border-radius:12px 12px 0 0;overflow:hidden;position:relative;cursor:pointer}
@media (max-height:560px){
  .detailbox .dhead .art{max-height:34svh}
  .detailbox .dbody{min-height:96px}
}
.detailbox .dhead .art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58%;
  background:linear-gradient(transparent,rgba(6,9,17,.55) 42%,rgba(6,9,17,.94));
  pointer-events:none;z-index:1}
.detailbox .art .ovbox{position:absolute;left:0;right:0;bottom:0;padding:0 11px 8px;z-index:2;
  pointer-events:none}
.detailbox .art .ovbox .lnchip,.detailbox .art .ovbox .tiers{pointer-events:auto}
.detailbox .art .ovbox .hd{display:flex;align-items:baseline;gap:7px;padding:0}
.detailbox .art .ovbox .hd h3{font-size:19px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.detailbox .art .ovbox .hd em{display:inline;font-size:12px;font-style:normal;font-weight:800;
  color:#9fb0d0;letter-spacing:.05em;text-shadow:0 2px 6px rgba(0,0,0,.9)}
.detailbox .art .ovbox .chiprow{margin:5px 0 0;display:flex;gap:5px;align-items:center;flex-wrap:wrap}

/* キャラ絵の中で行動モーションを再生する */
.detailbox .dhead .art .unit{position:static;width:100%;height:100%;display:block;
  transform-origin:50% 78%}
.detailbox .dhead .art .unit .pic,
.detailbox .dhead .art .unit .pic svg{width:100%;height:100%;display:block}

/* コスト表示（案A：「コスト 5」の帯） */
.detailbox .art .cost{width:auto;height:auto;border-radius:999px;padding:3px 10px 3px 8px;
  display:flex;align-items:center;gap:5px;font-size:14px;z-index:3}
.detailbox .art .cost::before{content:"コスト";font-size:9.5px;font-weight:900;
  letter-spacing:.08em;opacity:.8}

/* 能力3行（行間は詰める。上限が増えてもピップが自動で細くなる） */
.detailbox .dhead .dmeta{padding:6px 11px;display:flex;flex-direction:column;gap:0}
.detailbox .strow.z{display:flex;align-items:center;gap:7px;padding:0;font-size:11px;
  font-weight:800;line-height:1.2}
.detailbox .strow.z > *{line-height:1.2}
.detailbox .strow.z .lb{width:34px;flex:0 0 auto;color:var(--dim);white-space:nowrap}
.detailbox .strow.z .nv{min-width:20px;text-align:right;font-size:11.5px;font-weight:900;
  color:var(--ink);font-variant-numeric:tabular-nums;flex:0 0 auto}
.detailbox .pips{flex:1 1 auto;min-width:0;gap:2px;align-items:center}
.detailbox .pips .pip{flex:1 1 0;width:auto;height:auto;aspect-ratio:1;max-width:11px;min-width:3px}

/* 系統チップ（ⓘ でタップできることを示す）と 段階チップ */
.lnchip{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 3px;border-radius:999px;
  background:rgba(4,7,14,.7);border:1px solid var(--lc);color:var(--lc);
  font-size:11px;font-weight:900;letter-spacing:.04em;cursor:pointer;font-family:inherit}
.lnchip .lg{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:900;font-style:normal;
  color:#0a0d16;background:var(--lc)}
.lnchip .ic,.tiers .ic{font-size:9px;font-weight:900;font-style:italic;width:13px;height:13px;
  border-radius:50%;border:1.2px solid currentColor;opacity:.8;display:flex;
  align-items:center;justify-content:center;margin-left:2px;flex:0 0 auto}
.tiers{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:999px;
  background:rgba(4,7,14,.7);border:1px solid #3c4762;cursor:pointer;font-family:inherit}
.tiers .tw{font-size:9.5px;font-weight:900;color:#8fa0c0;letter-spacing:.08em}
.tiers .solo{font-size:10.5px;font-weight:900;color:#a8b6d4;white-space:nowrap}
.tiers .ic{color:#8fa0c0;border-color:#56628a;opacity:1}
.tp{width:9px;height:9px;border-radius:2px;border:1.5px solid #56628a;background:transparent;
  display:inline-block;font-style:normal;flex:0 0 auto}
.tp.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(242,198,92,.7)}
.tp.soon{border-style:dashed;border-color:#4a5a80;
  background:repeating-linear-gradient(45deg,#2b3550 0 2px,transparent 2px 4px)}

/* 特殊能力の説明を通常技と同じ小ささに */
.pabox .an{font-weight:900;font-size:12px;display:flex;gap:6px;align-items:center}
.pabox .ad{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.45}
.detailbox .abox{cursor:pointer}
.detailbox .abox.playing{border-color:var(--gold);
  box-shadow:0 0 0 1px rgba(242,198,92,.4),0 0 18px rgba(242,198,92,.18)}

/* 技がまだ続いていることを伝える「▼ あと◯件」 */
.detailbox .bigcard.more .dbody{mask-image:linear-gradient(#000 calc(100% - 34px),transparent);
  -webkit-mask-image:linear-gradient(#000 calc(100% - 34px),transparent)}
.detailbox .morechip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;
  font-size:11px;font-weight:900;color:#0a0d16;background:var(--gold);display:none;
  padding:5px 13px;border-radius:999px;box-shadow:0 3px 14px rgba(0,0,0,.6);
  border:0;font-family:inherit;cursor:pointer;align-items:center;gap:5px}

/* 再生中は、絵に重ねた文字をいったん消してアニメに集中させる */
.detailbox .art .ovbox,.detailbox .art .cost,
.detailbox .art::after,.detailbox .dmeta{transition:opacity .16s ease}
.detailbox .bigcard.anim .art .ovbox,.detailbox .bigcard.anim .art .cost,
.detailbox .bigcard.anim .art::after{opacity:0}
.detailbox .bigcard.anim .dmeta{opacity:.18}

/* 技名カットインは、詳細画面ではカードに収まる大きさで出す */
.techrib.dtl{min-width:0;padding:8px 16px;gap:4px;border-top-width:2px;border-bottom-width:2px;
  box-shadow:0 0 24px rgba(0,0,0,.75),0 0 26px var(--c);z-index:90}
.techrib.dtl .w{font-size:10px;letter-spacing:.16em}
.techrib.dtl .t{font-size:19px;letter-spacing:.06em;
  text-shadow:0 0 10px var(--c),0 0 22px var(--c),0 3px 8px #000}

/* 系統・段階の説明ポップアップ */
.modal.minipop{z-index:95;padding:22px}
.modal.minipop .box{max-width:320px}
.popbox .pophd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.popbox .pophd .lg{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:900;font-style:normal;
  color:#0a0d16;background:var(--lc)}
.popbox .pophd b{font-size:14.5px;color:var(--lc);letter-spacing:.06em}
.popbox .poptx{font-size:12px;color:#a8b6d4;line-height:1.65;margin-bottom:12px}
.popbox .poptx b{color:#dbe4f5}
.popbox .btn{width:100%}
.tlist{margin-bottom:10px}
.tli{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;
  border:1px solid #263049;background:#0f1424;margin-bottom:4px}
.tli b{font-size:12.5px;font-weight:800;flex:1}
.tli span{font-size:10.5px;color:var(--dim);font-weight:800}
.tli.me{border-color:var(--gold2);background:rgba(242,198,92,.09)}
.tli.me b{color:#ffeec2}
.tli.soon{border-style:dashed;opacity:.72}

/* 横持ち：左＝キャラ絵だけ／右＝技。名前は絵の上、能力は絵の下に重ねる。
   絵が縦の余りをぜんぶ吸うので、絵の下に空きスペースができない */
@media (orientation: landscape) {
  .modal .box.detailbox{max-width:min(94vw,720px)}
  .detailbox .cardwrap > .bigcard{display:grid;
    grid-template-columns:minmax(0,40%) minmax(0,1fr);align-items:stretch}
  .detailbox .dhead{grid-area:auto;display:grid;grid-template-areas:"a";min-height:0;
    border-right:1px solid #263049;overflow:hidden}
  .detailbox .dhead .art{grid-area:a;min-height:90px;aspect-ratio:auto;height:100%;
    border-radius:12px 0 0 0}
  .detailbox .dhead .dmeta{grid-area:a;align-self:end;z-index:3;position:relative;
    padding:14px 11px 9px;
    background:linear-gradient(transparent,rgba(6,9,17,.72) 34%,rgba(6,9,17,.95))}
  .detailbox .art::after{height:34%}
  .detailbox .art::before{content:"";position:absolute;left:0;right:0;top:0;height:44%;
    background:linear-gradient(rgba(6,9,17,.9),rgba(6,9,17,.5) 55%,transparent);
    pointer-events:none;z-index:1}
  .detailbox .art .ovbox{top:0;bottom:auto;padding:8px 11px 0}
  .detailbox .art .ovbox .hd h3{font-size:17px}
  .detailbox .art .cost{left:auto;right:8px;top:8px}
  .detailbox .dbody{padding:6px 0 4px}
  .detailbox .dbody .abox,.detailbox .dbody .pabox{margin:5px 9px}
  .detailbox .dbody .flav{margin:7px 9px 6px}
  .detailbox .morechip{left:70%}
  .detailbox .navrow.big.merged{margin-top:9px}
  .detailbox .bigcard.anim .art::before{opacity:0}
  .detailbox .bigcard.anim .dmeta{opacity:0}
}

/* 背の低い端末（iPhone SE / 小型Android）では、余白と文字をもう一段詰める */
@media (orientation: portrait) and (max-height: 730px) {
  .detailbox .art .ovbox .hd h3{font-size:17px}
  .detailbox .dhead .dmeta{padding:5px 10px}
  .detailbox .abox,.detailbox .pabox{margin:4px 8px;padding:6px 8px}
  .detailbox .abox .ad,.detailbox .pabox .ad{line-height:1.4}
  .detailbox .flav{margin:6px 8px 7px;line-height:1.45}
  .detailbox .navrow.big.merged{margin-top:8px}
}
@media (orientation: portrait) and (max-height: 660px) {
  .detailbox .dhead .art{aspect-ratio:1/0.74}
  .detailbox .art .ovbox .hd h3{font-size:16px}
  .detailbox .abox,.detailbox .pabox{margin:3px 8px;padding:5px 8px}
  .detailbox .abox .an,.detailbox .pabox .an{font-size:11.5px}
  .detailbox .abox .ad,.detailbox .pabox .ad{font-size:10px;line-height:1.38}
  .detailbox .flav{font-size:10px;margin:5px 8px 6px;line-height:1.4}
}

/* 戦闘中の詳細：HP／攻撃（魔力・回復量）／素早さ を1行にまとめる */
.lvstats{display:flex;gap:6px;margin:2px 0 4px}
.lvstats span{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
  gap:1px;padding:4px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid #232d45}
.lvstats i{font-style:normal;font-size:9.5px;font-weight:800;color:var(--dim);letter-spacing:.04em}
.lvstats b{font-size:15px;font-weight:900;color:#fff;line-height:1.1;white-space:nowrap}
.lvstats u{text-decoration:none;font-size:9.5px;color:var(--dim);font-weight:700;margin-left:1px}

/* 横持ちで「戦闘中のキャラ詳細」を開いたときは、上に現在値の欄が乗るぶん
   カードが低くなる。キャラ絵が横に潰れないよう、左列をさらに細くする */
@media (orientation: landscape) {
  /* 現在値の欄は1行にたたんで、カードに高さを譲る */
  .detailbox .livebox{margin-bottom:6px;padding:5px 9px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .detailbox .livebox .lvhd{margin:0;flex:0 0 auto}
  .detailbox .livebox .lvstats{margin:0;flex:1 1 240px;min-width:210px}
  .detailbox .livebox .lvstats span{padding:2px 4px}
  .detailbox .livebox .lvstats b{font-size:14px}
  .detailbox .livebox .lvtags{margin:0;flex:1 1 auto}
  .detailbox .livebox .lvrow{padding:0;flex:0 0 auto;gap:8px}
  .detailbox .livebox ~ .cardwrap > .bigcard{grid-template-columns:minmax(0,31%) minmax(0,1fr)}
  /* 上の欄に現在値（基本値つき）が出ているので、素の能力ピップは省いて絵を広く見せる */
  .detailbox .livebox ~ .cardwrap .dmeta{display:none}
  .detailbox .livebox ~ .cardwrap .art .ovbox .hd h3{font-size:14.5px}
  .detailbox .livebox ~ .cardwrap .art .ovbox .hd em{display:none}
  .detailbox .livebox ~ .cardwrap .art .ovbox{padding:6px 8px 0}
  .detailbox .livebox ~ .cardwrap .dmeta{padding:12px 8px 7px}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="fxlayer"></div>
<div id="marklayer"></div>
<script>
/* =========================================================
   ARCANA CLASH  —  ゲームエンジン（DOM非依存）
   ブラウザ / Node の両方で動作する純ロジック
   ========================================================= */
var CB = (function () {
  'use strict';

  var _uid = 1;
  function makeUnit(defId, side, row, col) {
    var d = BY_ID[defId];
    var u = {
      uid: 'u' + (_uid++), def: d, defId: defId, side: side, row: row, col: col,
      maxHp: d.hp, hp: d.hp, alive: true,
      cd: {}, uses: {}, statuses: [], counters: {},
      stats: { dmg: 0, heal: 0, kills: 0, taken: 0 },
      flags: {}
    };
    d.actions.forEach(function (a) {
      u.cd[a.key] = a.startCd || 0;
      if (a.uses) u.uses[a.key] = a.uses;
    });
    return u;
  }

  /** 前衛のいない列に後衛は立てない。空いた前衛マスへ繰り上げる。
      編成画面でも同じ規則を掛けているが、AI・保存デッキ・引き継ぎコードなど
      別経路から来た配置も、ここで必ず正す。 */
  function normalizeTeam(team) {
    var out = team.map(function (c) { return { id: c.id, row: c.row, col: c.col }; });
    for (var col = 0; col < 3; col++) {
      if (out.some(function (c) { return c.row === 0 && c.col === col; })) continue;
      for (var i = 0; i < out.length; i++) {
        if (out[i].row === 1 && out[i].col === col) { out[i].row = 0; break; }
      }
    }
    return out;
  }

  function createState(teamA, teamB, opts) {
    // team = [{id, row, col}, ...]
    opts = opts || {};
    var st = {
      round: 1, phase: 'battle', turnIdx: 0, order: [], events: [], log: [],
      coin: opts.coin != null ? opts.coin : (Math.random() < 0.5 ? 0 : 1),
      /* 不具合の再現用。種を決めておくと、同じ手順で同じ戦闘をなぞれる */
      seed: opts.seed != null ? opts.seed : Math.floor(Math.random() * 2147483647),
      rec: opts.rec === false ? null : [],
      quietRounds: 0, winner: null, result: null,
      rnd: null,
      players: [
        { name: opts.nameA || 'プレイヤー1', units: [], cost: 0, stats:{dmg:0, heal:0, kills:0} },
        { name: opts.nameB || 'プレイヤー2', units: [], cost: 0, stats:{dmg:0, heal:0, kills:0} }
      ]
    };
    st.rnd = opts.rnd || mulberry32(st.seed);
    st.teams = [normalizeTeam(teamA), normalizeTeam(teamB)];
    [st.teams[0], st.teams[1]].forEach(function (team, side) {
      team.forEach(function (slot) {
        var u = makeUnit(slot.id, side, slot.row, slot.col);
        st.players[side].units.push(u);
        st.players[side].cost += u.def.cost;
      });
    });
    buildOrder(st);
    return st;
  }

  /* ---------- 盤面ヘルパー ---------- */
  function allUnits(st) { return st.players[0].units.concat(st.players[1].units); }
  function aliveUnits(st, side) { return st.players[side].units.filter(function (u) { return u.alive; }); }
  /* 生死を問わず、そのマスに居るユニット（＝死体も含む）。
     前進で生者が入るとき、先客の死体を押し出すために使う。 */
  function occupantAt(st, side, row, col) {
    var arr = st.players[side].units;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].row === row && arr[i].col === col) return arr[i];
    }
    return null;
  }

  function unitAt(st, side, row, col) {
    var arr = st.players[side].units;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].alive && arr[i].row === row && arr[i].col === col) return arr[i];
    }
    return null;
  }
  function hasP(u, key) { return u.def.passives.indexOf(key) >= 0; }
  /** 自分の前または後ろ（同じ縦列）の味方 */
  function adjacentAllies(st, u) {
    var out = [];
    var v = unitAt(st, u.side, 1 - u.row, u.col);
    if (v && v.uid !== u.uid) out.push(v);
    return out;
  }
  /** その味方を庇っている生存中のかばい手を返す */
  function coverOf(st, tgt) {
    if (!tgt.flags || !tgt.flags.coverBy) return null;
    var g = findUid(st, tgt.flags.coverBy);
    if (!g || !g.alive || g.uid === tgt.uid) { tgt.flags.coverBy = null; return null; }
    return g;
  }
  function findUid(st, uid) {
    var a = allUnits(st);
    for (var i = 0; i < a.length; i++) if (a[i].uid === uid) return a[i];
    return null;
  }

  /* ---------- ステータス ---------- */
  function statusVal(u, key) {
    var v = 0;
    u.statuses.forEach(function (s) { if (s.key === key) v += s.value; });
    return v;
  }
  function addStatus(u, key, value, rounds) {
    var ex = null;
    u.statuses.forEach(function (s) { if (s.key === key) ex = s; });
    if (ex) { ex.value = Math.max(ex.value, value); ex.rounds = Math.max(ex.rounds, rounds); }
    else u.statuses.push({ key: key, value: value, rounds: rounds });
  }

  /* ---------- オーラ集計 ---------- */
  function auraFor(u, st) {
    var acc = { atk:0, spd:0, physReduce:0, magicReduce:0, healBonus:0 };
    aliveUnits(st, u.side).forEach(function (a) {
      a.def.passives.forEach(function (pk) {
        var p = PASSIVES[pk];
        if (p && p.aura) {
          var m = p.aura(a, st) || {};
          for (var k in m) acc[k] = (acc[k] || 0) + m[k];
        }
        if (p && p.lane && a.uid !== u.uid && a.col === u.col && a.row === 0 && u.row === 1) {
          var l = p.lane(a, st) || {};
          for (var k2 in l) acc[k2] = (acc[k2] || 0) + l[k2];
        }
      });
    });
    // 敵側から掛けられるオーラ（凍てつく大気など）
    aliveUnits(st, 1 - u.side).forEach(function (e) {
      e.def.passives.forEach(function (pk) {
        var p = PASSIVES[pk];
        if (p && p.foeAura) {
          var m = p.foeAura(e, st) || {};
          for (var k3 in m) acc[k3] = (acc[k3] || 0) + m[k3];
        }
      });
    });
    return acc;
  }

  /* ---------- 有効ステータス ---------- */
  function getAtk(u, st) {
    var v = u.def.atk;
    u.def.passives.forEach(function (pk) {
      var p = PASSIVES[pk];
      if (p && p.selfMod) { var m = p.selfMod(u, st) || {}; v += (m.atk || 0); }
    });
    v += auraFor(u, st).atk;
    v += statusVal(u, 'might');
    v -= statusVal(u, 'weaken');
    return Math.max(0, v);
  }
  function getSpd(u, st) {
    var v = u.def.spd;
    u.def.passives.forEach(function (pk) {
      var p = PASSIVES[pk];
      if (p && p.selfMod) { var m = p.selfMod(u, st) || {}; v += (m.spd || 0); }
    });
    var bonus = auraFor(u, st).spd;
    if (hasP(u, 'slowwit')) bonus = Math.min(0, bonus);   // 素早さ上昇だけ無効
    v += bonus;
    v += statusVal(u, 'haste');
    v -= statusVal(u, 'slow');
    return Math.max(1, v);
  }

  /* =========================================================
     行動順
     ========================================================= */
  function buildOrder(st) {
    var list = allUnits(st).filter(function (u) { return u.alive; });
    var firstSide = ((st.round + (st.coin || 0)) % 2 === 1) ? 0 : 1; // 同値時の優先側は毎ラウンド交代
    list.sort(function (a, b) {
      var d = getSpd(b, st) - getSpd(a, st); if (d) return d;
      d = b.hp - a.hp; if (d) return d;
      d = a.row - b.row; if (d) return d;                 // 前衛優先
      d = Math.abs(a.col - 1) - Math.abs(b.col - 1); if (d) return d; // 中央優先
      if (a.side !== b.side) return a.side === firstSide ? -1 : 1;
      return a.uid < b.uid ? -1 : 1;
    });
    st.order = list.map(function (u) { return u.uid; });
    // 行動順を決めた瞬間の値を保存（ラウンド中にHPが変わっても表示がぶれないように）
    st.orderMeta = {};
    list.forEach(function (u, i) {
      st.orderMeta[u.uid] = { spd: getSpd(u, st), hp: u.hp, row: u.row, col: u.col, idx: i };
    });
    st.orderFirstSide = firstSide;
    st.turnIdx = 0;
    return st.order;
  }

  /* =========================================================
     ターゲット解決
     ========================================================= */
  function meleeChain(st, u) {
    var foe = 1 - u.side;
    var t = unitAt(st, foe, 0, u.col); if (t) return t;
    t = unitAt(st, foe, 1, u.col);     if (t) return t;
    var best = null, bd = 99;
    [0, 1].forEach(function (row) {
      if (best && best.row === 0) return;
      for (var c = 0; c < 3; c++) {
        var v = unitAt(st, foe, row, c);
        if (v) { var d = Math.abs(c - u.col); if (!best || (row < best.row) || (row === best.row && d < bd)) { best = v; bd = d; } }
      }
    });
    return best;
  }

  /* 前進のタイミング
     'death' … 既定。前衛が倒れた瞬間、真下の後衛がその場で繰り上がる
     'turn'  … 旧仕様。後衛は自分の手番が来たときに前進する
     技の対象はダメージ処理の前にまとめて確定するので、
     どちらでも「いま実行中の技」の結果は変わらない。 */
  var advanceMode = 'death';
  function setAdvanceMode(m) { advanceMode = (m === 'death') ? 'death' : 'turn'; }
  function getAdvanceMode() { return advanceMode; }

  /** 前衛が空いたマスへ、真下の後衛を繰り上げる（倒れた瞬間に呼ぶ）。
      盤面の状態はその場で書き換えるが、前進の「演出」はすぐには流さない。
      複数体に当たる技の途中で挟まると、2体目・3体目へのダメージ表示が
      前進アニメ（約0.8秒）のたびに止まって見えるため、
      技の演出がすべて終わってから flushMoves でまとめて流す。 */
  function pullUp(st, side, col) {
    if (unitAt(st, side, 0, col)) return null;         // まだ埋まっている
    var back = unitAt(st, side, 1, col);
    if (!back) return null;
    /* 前衛マスには倒れた者がそのまま残っている。
       生者が入ると同じマスに2体が重なり、描画が入れ替わって
       生きているキャラが盤面から消えてしまう。死体を後ろへ下げて入れ替える。 */
    var corpse = occupantAt(st, side, 0, col);
    back.row = 0;
    if (corpse && corpse !== back) corpse.row = 1;
    st._mvq = st._mvq || [];
    st._mvq.push({ type: 'move', uid: back.uid, row: 0, col: col, fromRow: 1, fromCol: col,
                   name: back.def.name });
    return back;
  }

  /** 溜めておいた前進の演出を流す。技の締め・ラウンド処理の締めで必ず呼ぶ */
  function flushMoves(st) {
    if (!st._mvq || !st._mvq.length) return;
    st._mvq.forEach(function (ev) {
      push(st, ev);
      logMsg(st, ev.name + ' が前線へ進み出た！');
    });
    st._mvq = [];
  }

  /** 近接ユニットが行動可能か。必要なら前進する */
  function meleeReady(st, u, doMove) {
    if (u.row === 0) return true;
    if (hasP(u, 'longreach')) return true;
    var frontMate = unitAt(st, u.side, 0, u.col);
    if (!frontMate) {
      if (doMove) {
        var corpse2 = occupantAt(st, u.side, 0, u.col);
        u.row = 0;
        if (corpse2 && corpse2 !== u) corpse2.row = 1;
        push(st, { type: 'move', uid: u.uid, row: 0, col: u.col, fromRow: 1, fromCol: u.col });
        /* こちらは自分の手番での前進（単独イベント）なので、その場で流してよい */
        logMsg(st, u.def.name + ' が前線へ進み出た！');
      }
      return true;
    }
    return false;
  }

  /**
   * 行動候補を返す
   * → [{action, needTarget, options:[targetSpec...], auto:targetSpec}]
   */
  function getOptions(st, u) {
    var out = [];
    var foe = 1 - u.side;
    u.def.actions.forEach(function (a) {
      if (u.cd[a.key] > 0) return;
      if (a.uses != null && u.uses[a.key] <= 0) return;
      var entry = { action: a, targets: [], auto: null, label: a.name };

      switch (a.range) {
        case 'melee':
        case 'pierce':
          if (!meleeReady(st, u, false)) return;
          var t = meleeChain(st, u);
          if (!t) return;
          entry.auto = { type: 'auto' };
          break;
        case 'front_row':
          if (!meleeReady(st, u, false)) return;
          if (aliveUnits(st, foe).length === 0) return;
          entry.auto = { type: 'auto' };
          break;
        case 'any1':
          aliveUnits(st, foe).forEach(function (v) { entry.targets.push({ type: 'unit', uid: v.uid }); });
          if (!entry.targets.length) return;
          break;
        case 'weakest':
          if (!aliveUnits(st, foe).length) return;
          entry.auto = { type: 'auto' };
          break;
        case 'square':
          [0, 1].forEach(function (c) {
            var hit = squareCells(st, foe, c);
            if (hit.length) entry.targets.push({ type: 'square', col: c });
          });
          if (!entry.targets.length) return;
          break;
        case 'row':
          [0, 1].forEach(function (r) {
            if (st.players[foe].units.some(function (v) { return v.alive && v.row === r; }))
              entry.targets.push({ type: 'row', row: r });
          });
          if (!entry.targets.length) return;
          break;
        case 'all':
        case 'random':
          if (!aliveUnits(st, foe).length) return;
          entry.auto = { type: 'auto' };
          break;
        case 'adj_ally':
          adjacentAllies(st, u).forEach(function (v) { entry.targets.push({ type: 'unit', uid: v.uid }); });
          if (!entry.targets.length) return;
          break;
        case 'ally1':
          aliveUnits(st, u.side).forEach(function (v) {
            if (hasP(v, 'nonliving')) return;
            entry.targets.push({ type: 'unit', uid: v.uid });
          });
          if (!entry.targets.length) return;
          break;
        case 'all_ally':
          entry.auto = { type: 'auto' };
          break;
        case 'self_aura':
          entry.auto = { type: 'auto' };
          break;
        case 'dead_ally':
          st.players[u.side].units.forEach(function (v) {
            if (!v.alive && !v.flags.removed) entry.targets.push({ type: 'unit', uid: v.uid });
          });
          if (!entry.targets.length) return;
          break;
      }
      out.push(entry);
    });

    if (!out.length) {
      out.push({ action: { key: 'guard', name: '防御', kind: 'guard', range: 'self', fx: 'guard' }, targets: [], auto: { type: 'auto' }, label: '防御' });
    }
    return out;
  }

  function squareCells(st, side, colStart) {
    var res = [];
    for (var r = 0; r < 2; r++) for (var c = colStart; c <= colStart + 1; c++) {
      var v = unitAt(st, side, r, c); if (v) res.push(v);
    }
    return res;
  }

  /* =========================================================
     ダメージ処理
     ========================================================= */
  function push(st, ev) { st.events.push(ev); }
  function logMsg(st, text, cls) { st.log.push({ text: text, cls: cls || '' }); push(st, { type: 'log', text: text, cls: cls || '' }); }

  function previewDamage(st, src, tgt, amount, dtype) {
    if (!tgt.alive || amount <= 0) return 0;
    var cg = coverOf(st, tgt);
    if (cg && cg.uid !== tgt.uid && statusVal(tgt, 'covered') > 0) tgt = cg;
    var aura = auraFor(tgt, st);
    var red = 0;
    tgt.def.passives.forEach(function (pk) {
      var p = PASSIVES[pk];
      if (!p) return;
      if (p.flatReduce) red += p.flatReduce;
      if (p.physReduceSelf && dtype === 'phys') red += p.physReduceSelf;
      if (p.takenAdd) red -= p.takenAdd;
    });
    if (dtype === 'phys') red += aura.physReduce; else red += aura.magicReduce;
    red += statusVal(tgt, 'guard');
    red += statusVal(tgt, 'ward');
    return Math.max(1, Math.round(amount - red));
  }

  function dealDamage(st, src, tgt, amount, dtype) {
    if (!tgt.alive || amount <= 0) return 0;
    // 王命の盾：庇い手が生きていれば、その味方の代わりに受ける
    var guard = coverOf(st, tgt);
    if (guard && guard.uid !== tgt.uid && statusVal(tgt, 'covered') > 0) {
      push(st, { type: 'passive', uid: guard.uid, name: '王命の盾', text: tgt.def.name + ' を庇った', kind: 'good', small: true });
      logMsg(st, guard.def.name + ' が ' + tgt.def.name + ' を庇った！', 'good');
      return dealDamage(st, src, guard, amount, dtype);
    }
    var dmg = previewDamage(st, src, tgt, amount, dtype);

    tgt.hp -= dmg;
    tgt.stats.taken += dmg;
    if (src) { src.stats.dmg += dmg; st.players[src.side].stats.dmg += dmg; }
    st.roundDamage = (st.roundDamage || 0) + dmg;
    push(st, { type: 'damage', uid: tgt.uid, amount: dmg, hp: Math.max(0, tgt.hp), src: src ? src.uid : null, dtype: dtype });

    // 吸血
    if (src && hasP(src, 'bloodsuck')) {
      var g = Math.max(1, Math.floor(dmg / 2));
      healUnit(st, src, src, g, true);
    }
    if (tgt.hp <= 0) killUnit(st, tgt, src);
    return dmg;
  }

  function healUnit(st, src, tgt, amount, silent) {
    if (!tgt.alive) return 0;
    if (hasP(tgt, 'nonliving')) {
      if (!silent) logMsg(st, tgt.def.name + ' は非生命のため回復できない');
      return 0;
    }
    var bonus = src ? auraFor(src, st).healBonus : 0;
    var amt = amount + bonus;
    var real = Math.min(amt, tgt.maxHp - tgt.hp);
    if (real <= 0) real = 0;
    tgt.hp += real;
    if (src) { src.stats.heal += real; st.players[src.side].stats.heal += real; }
    push(st, { type: 'heal', uid: tgt.uid, amount: real, hp: tgt.hp });
    return real;
  }

  function killUnit(st, tgt, src) {
    allUnits(st).forEach(function (v) { if (v.flags.coverBy === tgt.uid) v.flags.coverBy = null; });
    // 献身（パラディン）
    var savior = null;
    aliveUnits(st, tgt.side).forEach(function (a) {
      if (!savior && hasP(a, 'devotion') && !a.flags.devotionUsed && a.uid !== tgt.uid) savior = a;
    });
    if (savior) {
      savior.flags.devotionUsed = true;
      push(st, { type: 'passive', uid: savior.uid, name: '献身', text: '致死ダメージを肩代わり', kind: 'good' });
      tgt.hp = 1;
      push(st, { type: 'devotion', uid: tgt.uid, by: savior.uid });
      logMsg(st, savior.def.name + ' の【献身】！ ' + tgt.def.name + ' はHP1で持ちこたえた', 'good');
      return;
    }
    tgt.hp = 0; tgt.alive = false;
    push(st, { type: 'death', uid: tgt.uid });
    logMsg(st, tgt.def.name + ' は倒れた…', 'bad');
    /* 倒れた瞬間に繰り上げる方式のとき、その場で後衛を前へ出す。
       いま実行中の技の対象はすでに確定しているので、この技の結果は変わらない。 */
    if (advanceMode === 'death' && tgt.row === 0) pullUp(st, tgt.side, tgt.col);
    if (src) { src.stats.kills++; st.players[src.side].stats.kills++; }

    // 復活予約
    if ((hasP(tgt, 'undying') || hasP(tgt, 'rebirth')) && !tgt.flags.revived) {
      tgt.flags.reviveQueued = true;
    }
    // onAnyDeath
    allUnits(st).forEach(function (a) {
      if (!a.alive) return;
      a.def.passives.forEach(function (pk) {
        var p = PASSIVES[pk];
        if (p && p.onAnyDeath) {
          p.onAnyDeath(a, tgt, st);
          push(st, { type: 'passive', uid: a.uid, name: p.name, text: '発動', kind: 'good', small: true });
          logMsg(st, a.def.name + ' の【' + p.name + '】が発動', 'good');
        }
      });
    });
    // 凱歌
    if (src && hasP(src, 'triumph') && !src.flags.triumphUsed && src.alive) {
      src.flags.triumphUsed = true;
      src.flags.extraTurn = true;
      logMsg(st, src.def.name + ' の【凱歌】！ 続けてもう一度行動する', 'good');
    }
  }

  /* =========================================================
     行動実行
     ========================================================= */
  function performAction(st, u, actionKey, target) {
    if (st.rec) {
      /* uid は対戦をまたいで増え続けるので、記録には「陣営＋並び順」を使う */
      var slot = function (v) { return v.side * 10 + st.players[v.side].units.indexOf(v); };
      var tv = target && target.uid != null ? findUid(st, target.uid) : null;
      st.rec.push([slot(u), actionKey,
        tv ? 'u' + slot(tv)
          : target && target.col != null ? 'c' + target.col
          : target && target.row != null ? 'r' + target.row : '']);
    }
    st.events = [];
    var opts = getOptions(st, u);
    var entry = null;
    opts.forEach(function (o) { if (o.action.key === actionKey) entry = o; });
    if (!entry) entry = opts[0];
    var a = entry.action;
    var foe = 1 - u.side;
    var atk = getAtk(u, st);

    push(st, { type: 'turnStart', uid: u.uid });

    if (a.kind === 'guard') {
      addStatus(u, 'guard', 2, 1);
      push(st, { type: 'cast', uid: u.uid, fx: 'guard', name: '防御' });
      logMsg(st, u.def.name + ' は身構えた（次の被ダメージ-2）');
      return finishAction(st, u, a);
    }

    if (a.kind === 'cover') {
      var ally = findUid(st, target && target.uid);
      if (!ally || !ally.alive) ally = adjacentAllies(st, u)[0];
      push(st, { type: 'cast', uid: u.uid, fx: a.fx || 'aegis', name: a.name });
      if (ally) {
        // 同時に庇えるのは1人だけ
        allUnits(st).forEach(function (v) { if (v.flags.coverBy === u.uid) v.flags.coverBy = null; });
        ally.flags.coverBy = u.uid;
        addStatus(ally, 'covered', 1, (a.rounds || 1) + 1);
        push(st, { type: 'buffFx', uid: ally.uid, fx: a.fx || 'aegis' });
        push(st, { type: 'passive', uid: u.uid, name: a.name, text: ally.def.name + ' を庇う', kind: 'good' });
        logMsg(st, u.def.name + ' の【' + a.name + '】！ ' + ally.def.name + ' への攻撃を肩代わりする', 'good');
      }
      return finishAction(st, u, a);
    }

    if (a.kind === 'buff') {
      push(st, { type: 'cast', uid: u.uid, fx: a.fx || 'ward', name: a.name });
      var key = a.stat === 'spd' ? 'haste' : 'might';
      aliveUnits(st, u.side).forEach(function (v) {
        addStatus(v, key, a.value, (a.rounds || 1) + 1);
        push(st, { type: 'buffFx', uid: v.uid, fx: a.fx || 'ward' });
      });
      logMsg(st, u.def.name + ' の【' + a.name + '】！ 味方全体の' +
        (a.stat === 'spd' ? '素早さ' : '攻撃') + '+' + a.value + '（' + (a.rounds || 1) + 'ラウンド）', 'good');
      return finishAction(st, u, a);
    }

    if (a.kind === 'ward') {
      push(st, { type: 'cast', uid: u.uid, fx: 'ward', name: a.name });
      aliveUnits(st, u.side).forEach(function (v) {
        addStatus(v, 'ward', a.value, a.rounds || 1);
        push(st, { type: 'buffFx', uid: v.uid, fx: 'ward' });
      });
      logMsg(st, u.def.name + ' の【' + a.name + '】！ 味方全体の被魔法ダメージ-' + a.value, 'good');
      return finishAction(st, u, a);
    }

    if (a.kind === 'heal') {
      push(st, { type: 'cast', uid: u.uid, fx: 'heal', name: a.name });
      var tgts = [];
      if (a.range === 'ally1') { var t = findUid(st, target.uid); if (t) tgts = [t]; }
      else tgts = aliveUnits(st, u.side);
      var total = 0;
      tgts.forEach(function (t) { total += healUnit(st, u, t, a.value); });
      logMsg(st, u.def.name + ' の【' + a.name + '】！ 合計' + total + '回復', 'good');
      return finishAction(st, u, a);
    }

    if (a.kind === 'revive') {
      var dead = findUid(st, target.uid);
      push(st, { type: 'cast', uid: u.uid, fx: 'revive', name: a.name });
      if (dead) {
        dead.alive = true;
        dead.hp = Math.max(1, Math.floor(dead.maxHp / 2));
        dead.flags.reviveQueued = false;
        push(st, { type: 'revive', uid: dead.uid, hp: dead.hp });
        logMsg(st, u.def.name + ' の【殉教】！ ' + dead.def.name + ' が蘇った', 'good');
      }
      u.alive = false; u.hp = 0;
      push(st, { type: 'death', uid: u.uid });
      logMsg(st, u.def.name + ' は自らの命を捧げた…', 'bad');
      return finishAction(st, u, a);
    }

    /* ---- 攻撃系 ---- */
    var base = (a.power != null) ? a.power : atk;
    if (a.dtype === 'magic') {
      if (a.power != null) {
        // 魔法職の攻撃力補正（バフ/デバフを魔力にも反映）
        base = a.power + (getAtk(u, st) - u.def.atk);
      }
      if (hasP(u, 'resonance')) {
        var others = aliveUnits(st, u.side).filter(function (v) { return v.uid !== u.uid && (v.def.role === 'caster' || v.def.role === 'support'); });
        if (others.length) base += 1;
      }
    }
    if (hasP(u, 'ambush') && st.round === 1) base += 2;

    var victims = [];
    if (a.range === 'melee' || a.range === 'pierce') {
      meleeReady(st, u, true);
      var pt = meleeChain(st, u);
      if (!pt) return finishAction(st, u, a);
      victims.push({ u: pt, mul: 1 });
      if (a.range === 'pierce' && pt.row === 0) {
        var behind = unitAt(st, foe, 1, pt.col);
        if (behind) victims.push({ u: behind, mul: a.backRatio == null ? 0.5 : a.backRatio });
      }
    } else if (a.range === 'front_row') {
      meleeReady(st, u, true);
      var row0 = st.players[foe].units.filter(function (v) { return v.alive && v.row === 0; });
      if (!row0.length) row0 = aliveUnits(st, foe);
      row0.forEach(function (v) { victims.push({ u: v, mul: 1 }); });
    } else if (a.range === 'any1') {
      var t2 = findUid(st, target.uid);
      if (!t2 || !t2.alive) t2 = aliveUnits(st, foe)[0];
      if (!t2) return finishAction(st, u, a);
      victims.push({ u: t2, mul: 1 });
    } else if (a.range === 'weakest') {
      var cand = aliveUnits(st, foe).slice().sort(function (x, y) { return x.hp - y.hp || threat(y, st) - threat(x, st); });
      if (!cand.length) return finishAction(st, u, a);
      victims.push({ u: cand[0], mul: 1 });
    } else if (a.range === 'square') {
      squareCells(st, foe, target.col).forEach(function (v) { victims.push({ u: v, mul: 1 }); });
    } else if (a.range === 'row') {
      st.players[foe].units.filter(function (v) { return v.alive && v.row === target.row; })
        .forEach(function (v) { victims.push({ u: v, mul: 1 }); });
    } else if (a.range === 'all') {
      aliveUnits(st, foe).forEach(function (v) { victims.push({ u: v, mul: 1 }); });
    } else if (a.range === 'random') {
      var pool = aliveUnits(st, foe);
      if (!pool.length) return finishAction(st, u, a);
      var n = a.hits || 1;
      for (var ri = 0; ri < n; ri++) {
        var alive = pool.filter(function (v) { return v.alive; });
        if (!alive.length) break;
        victims.push({ u: alive[Math.floor(st.rnd() * alive.length)], mul: 1 });
      }
    }
    // 同じ相手に複数回当てる技（三連矢など）
    if (a.hits && a.range !== 'random' && victims.length) {
      var one = victims.slice();
      for (var hi = 1; hi < a.hits; hi++) one.forEach(function (v) { victims.push({ u: v.u, mul: v.mul }); });
    }

    push(st, { type: 'attack', uid: u.uid, fx: a.fx, targets: victims.map(function (v) { return v.u.uid; }), name: a.name });

    var killedAny = false, totalDmg = 0;
    victims.forEach(function (v) {
      if (!v.u.alive) return;
      var amt = base * v.mul;
      if (hasP(u, 'snipe') && v.u.row === 1) amt += 3;
      // 首狩り
      if (hasP(u, 'decapitate') && v.u.hp <= v.u.maxHp * 0.35) {
        push(st, { type: 'execute', uid: v.u.uid });
        logMsg(st, u.def.name + ' の【首狩り】が炸裂！ ' + v.u.def.name + ' を一撃で葬った', 'bad');
        var hpLeft = v.u.hp;
        v.u.hp = 0;
        u.stats.dmg += hpLeft; st.players[u.side].stats.dmg += hpLeft;
        killUnit(st, v.u, u);
        killedAny = true;
        return;
      }
      var d = dealDamage(st, u, v.u, amt, a.dtype || 'phys');
      totalDmg += d;
      if (a.slow) addStatus(v.u, 'slow', a.slow, 1);
      if (a.weaken) addStatus(v.u, 'weaken', a.weaken, 2);
      if (a.curse) { addStatus(v.u, 'curse', a.curse, 3); push(st, { type: 'buffFx', uid: v.u.uid, fx: 'curse' }); }
      if (a.burn)  { addStatus(v.u, 'burn', a.burn, 3);   push(st, { type: 'buffFx', uid: v.u.uid, fx: 'burn' }); }
      if (a.drain) healUnit(st, u, u, Math.max(1, Math.floor(d * a.drain)), true);
      if (!v.u.alive) killedAny = true;
    });

    logMsg(st, u.def.name + ' の【' + a.name + '】！ ' + totalDmg + 'ダメージ');

    // 猛牛（倒せなかったら次の攻撃+2）
    if (hasP(u, 'charge')) {
      if (killedAny) u.counters.charge = 0;
      else u.counters.charge = Math.min(9, (u.counters.charge || 0) + 3);
    }
    return finishAction(st, u, a);
  }

  function finishAction(st, u, a) {
    flushMoves(st);
    if (a.cd) u.cd[a.key] = a.cd;
    if (a.uses != null) u.uses[a.key] = (u.uses[a.key] || 0) - 1;
    checkEnd(st);
    return st.events;
  }

  /* =========================================================
     ターン進行
     ========================================================= */
  function currentActor(st) {
    while (st.turnIdx < st.order.length) {
      var u = findUid(st, st.order[st.turnIdx]);
      if (u && u.alive) return u;
      st.turnIdx++;
    }
    return null;
  }

  function nextTurn(st) {
    var u = findUid(st, st.order[st.turnIdx]);
    if (u && u.flags.extraTurn) { u.flags.extraTurn = false; return currentActor(st); }
    st.turnIdx++;
    return currentActor(st);
  }

  function endRound(st) {
    st.events = [];
    var evs = st.events;
    // 継続効果
    allUnits(st).forEach(function (u) {
      if (!u.alive) return;
      // 呪詛
      var curse = statusVal(u, 'curse');
      if (curse > 0) {
        push(st, { type: 'passive', uid: u.uid, name: '呪詛', text: '継続ダメージ ' + curse, kind: 'bad' });
        dealDamage(st, null, u, curse, 'magic');
        logMsg(st, u.def.name + ' は呪詛で' + curse + 'ダメージ', 'bad');
      }
      var burn = statusVal(u, 'burn');
      if (burn > 0 && u.alive) {
        push(st, { type: 'passive', uid: u.uid, name: '燃焼', text: '継続ダメージ ' + burn, kind: 'bad' });
        dealDamage(st, null, u, burn, 'magic');
        logMsg(st, u.def.name + ' は炎に焼かれて' + burn + 'ダメージ', 'bad');
      }
      // 再生
      u.def.passives.forEach(function (pk) {
        var p = PASSIVES[pk];
        if (p && p.roundEndHeal && u.hp < u.maxHp) {
          push(st, { type: 'passive', uid: u.uid, name: p.name, text: 'ラウンド終了時 HP回復', kind: 'good' });
          var h = healUnit(st, u, u, p.roundEndHeal, true);
          if (h > 0) logMsg(st, u.def.name + ' の【' + p.name + '】でHP+' + h, 'good');
        }
        if (p && p.selfRepair && u.hp < u.maxHp) {
          push(st, { type: 'passive', uid: u.uid, name: p.name, text: 'ラウンド終了時 自己修復', kind: 'good' });
          var r = Math.min(p.selfRepair, u.maxHp - u.hp);
          u.hp += r; u.stats.healed = (u.stats.healed || 0) + r;
          push(st, { type: 'heal', uid: u.uid, amount: r, hp: u.hp });
          logMsg(st, u.def.name + ' の【' + p.name + '】でHP+' + r, 'good');
        }
        if (p && p.allyRoundEndHeal) {
          var wounded = aliveUnits(st, u.side).filter(function (v) { return v.hp < v.maxHp && !hasP(v, 'nonliving'); });
          if (wounded.length) {
            push(st, { type: 'passive', uid: u.uid, name: p.name, text: '味方全体を回復', kind: 'good' });
            var tot = 0;
            aliveUnits(st, u.side).forEach(function (v) { tot += healUnit(st, u, v, p.allyRoundEndHeal, true); });
            if (tot > 0) logMsg(st, u.def.name + ' の【' + p.name + '】で味方が計' + tot + '回復', 'good');
          }
        }
      });
    });
    // 継続ダメージで倒れた分の前進を、ここでまとめて流す
    flushMoves(st);
    // ステータス経過
    allUnits(st).forEach(function (u) {
      u.statuses = u.statuses.filter(function (s) { s.rounds--; return s.rounds > 0; });
      u.flags.triumphUsed = false;
    });
    // CD経過（叡智で追加短縮）
    [0, 1].forEach(function (side) {
      var extra = aliveUnits(st, side).some(function (v) { return hasP(v, 'insight'); }) ? 1 : 0;
      st.players[side].units.forEach(function (u) {
        for (var k in u.cd) u.cd[k] = Math.max(0, u.cd[k] - 1 - extra);
      });
    });

    if (!st.roundDamage) st.quietRounds++; else st.quietRounds = 0;
    st.roundDamage = 0;

    checkEnd(st);
    if (st.phase === 'ended') return st.events;

    if (st.round >= MAX_ROUNDS) { judge(st, 'ラウンド上限'); return st.events; }
    if (st.quietRounds >= 2) { judge(st, '両者行動不能'); return st.events; }

    st.round++;
    // 復活処理
    allUnits(st).forEach(function (u) {
      if (u.flags.reviveQueued && !u.flags.revived) {
        u.flags.reviveQueued = false; u.flags.revived = true;
        push(st, { type: 'passive', uid: u.uid, name: hasP(u, 'rebirth') ? '不死鳥' : '不死の理', text: 'HP半分で復活', kind: 'good' });
        u.alive = true; u.hp = Math.max(1, Math.floor(u.maxHp / 2));
        u.statuses = [];
        push(st, { type: 'revive', uid: u.uid, hp: u.hp });
        logMsg(st, '✦ ' + u.def.name + ' が灰の中から蘇った！', 'good');
        if (hasP(u, 'rebirth')) {
          aliveUnits(st, u.side).forEach(function (v) { healUnit(st, u, v, 3); });
          logMsg(st, '不死鳥の炎が味方全体を癒した', 'good');
        }
      }
    });
    buildOrder(st);
    push(st, { type: 'roundStart', round: st.round });
    return st.events;
  }

  /* =========================================================
     勝敗判定
     ========================================================= */
  function checkEnd(st) {
    if (st.phase === 'ended') return;
    var a = aliveUnits(st, 0).length, b = aliveUnits(st, 1).length;
    var aRev = st.players[0].units.some(function (u) { return u.flags.reviveQueued; });
    var bRev = st.players[1].units.some(function (u) { return u.flags.reviveQueued; });
    if (a === 0 && !aRev && b === 0 && !bRev) { judge(st, '相打ち'); return; }
    if (a === 0 && !aRev) { finish(st, 1, 'KO', st.players[1].name + ' が敵を全滅させた！'); return; }
    if (b === 0 && !bRev) { finish(st, 0, 'KO', st.players[0].name + ' が敵を全滅させた！'); return; }
  }

  function tally(st, side) {
    var p = st.players[side];
    return {
      alive: aliveUnits(st, side).length,
      hpLeft: aliveUnits(st, side).reduce(function (s, u) { return s + u.hp; }, 0),
      dmg: p.stats.dmg, heal: p.stats.heal, kills: p.stats.kills, cost: p.cost
    };
  }

  function judge(st, reason) {
    var A = tally(st, 0), B = tally(st, 1);
    var steps = [
      { label: '生存キャラ数',   a: A.alive,  b: B.alive },
      { label: '残りHP合計',     a: A.hpLeft, b: B.hpLeft },
      { label: '与えたダメージ', a: A.dmg,    b: B.dmg },
      { label: '編成コスト（少ない方が勝ち）', a: -A.cost, b: -B.cost }
    ];
    var winner = null, decidedBy = null;
    for (var i = 0; i < steps.length; i++) {
      if (steps[i].a !== steps[i].b) { winner = steps[i].a > steps[i].b ? 0 : 1; decidedBy = steps[i].label; break; }
    }
    finish(st, winner, '判定', reason + 'のため判定に持ち込まれた', steps, decidedBy);
  }

  function finish(st, winner, how, msg, steps, decidedBy) {
    st.phase = 'ended';
    st.winner = winner;
    st.result = {
      winner: winner, how: how, message: msg,
      steps: steps || null, decidedBy: decidedBy || null,
      round: st.round,
      teams: [tally(st, 0), tally(st, 1)]
    };
    push(st, { type: 'end' });
    logMsg(st, '=== 決着 === ' + msg, 'end');
  }

  function games() { return load().games.slice().reverse(); }   // 新しい順

  /* ---------- 再現データ（不具合の報告用） ----------
     戦闘の種・両軍の配置・実際に取った行動をそのまま残す。
     これがあれば、同じ戦闘をこちらでもう一度なぞって中身を確かめられる。 */
  function addReplay(rep) {
    var d = load();
    rep.at = rep.at || Date.now();
    d.reps.push(rep);
    save();
    return rep;
  }
  function replays() { return load().reps.slice().reverse(); }
  function replayCode(rep) {
    var json = JSON.stringify(rep);
    var bytes = new TextEncoder().encode(json);
    var bin = '';
    for (var i = 0; i < bytes.length; i += 8192) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    }
    return 'AC1' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function gameCount() { return load().games.length; }

  /* ---------- 保存した編成 ---------- */
  function decks() { return load().decks.slice(); }
  function addDeck(name, pool, units) {
    var d = load();
    var rec = { id: 'd' + Date.now(), name: name, pool: pool, at: Date.now(),
      units: units.map(function (u) { return { id: u.id, row: u.row, col: u.col }; }) };
    d.decks.push(rec); save();
    return rec;
  }
  function removeDeck(id) {
    var d = load();
    d.decks = d.decks.filter(function (x) { return x.id !== id; });
    save();
  }

  /* ---------- 集計 ---------- */
  function stats(filter) {
    var gs = load().games.filter(function (g) {
      if (!filter) return true;
      if (filter.pool && g.pool !== filter.pool) return false;
      if (filter.mode && g.mode !== filter.mode) return false;
      return true;
    });
    var tot = { games: gs.length, win: 0, lose: 0, draw: 0, ko: 0, judge: 0, rounds: 0 };
    var byChar = {}, byPool = {};
    gs.forEach(function (g) {
      if (g.result === 'win') tot.win++;
      else if (g.result === 'lose') tot.lose++;
      else tot.draw++;
      if (g.how === 'KO') tot.ko++; else tot.judge++;
      tot.rounds += g.rounds || 0;

      var P = byPool[g.pool] || (byPool[g.pool] = { games: 0, win: 0 });
      P.games++; if (g.result === 'win') P.win++;

      (g.me && g.me.units || []).forEach(function (u) {
        var c = byChar[u.id] || (byChar[u.id] = { id: u.id, used: 0, win: 0, dmg: 0, heal: 0, kills: 0, survived: 0 });
        c.used++;
        if (g.result === 'win') c.win++;
        c.dmg += u.dmg || 0; c.heal += u.heal || 0; c.kills += u.kills || 0;
        if (u.alive) c.survived++;
      });
    });
    tot.rate = tot.games ? Math.round(tot.win / tot.games * 100) : 0;
    tot.avgRounds = tot.games ? +(tot.rounds / tot.games).toFixed(1) : 0;
    return { total: tot, byChar: byChar, byPool: byPool };
  }

  /* ---------- 書き出し／読み込み ---------- */
  function utf8ToB64(s) {
    return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(s))
      .replace(/[Ā-￿]/g, '?'));
  }
  function exportCode() {
    var json = JSON.stringify(load());
    var bytes = new TextEncoder().encode(json);
    var bin = '';
    for (var i = 0; i < bytes.length; i += 8192) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    }
    return 'AC1:' + btoa(bin);
  }
  function importCode(code) {
    if (!code) return { ok: false, msg: 'コードが空です' };
    code = String(code).trim().replace(/\s+/g, '');
    if (code.indexOf('AC1:') !== 0) return { ok: false, msg: 'このコードは ARCANA CLASH のものではありません' };
    try {
      var bin = atob(code.slice(4));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var data = JSON.parse(new TextDecoder().decode(bytes));
      mem = normalize(data);
      save();
      return { ok: true, games: mem.games.length, decks: mem.decks.length };
    } catch (e) {
      return { ok: false, msg: 'コードが壊れているようです' };
    }
  }

  function clearAll() { mem = blank(); if (store) { try { store.removeItem(KEY); } catch (e) {} } }
  function clearGames() { load().games = []; save(); }

  return {
    available: function () { return !!store; },
    warned: function () { return warned; },
    getSettings: getSettings, setSettings: setSettings,
    rpg: rpg, rpgReward: rpgReward,
    addGame: addGame, games: games, gameCount: gameCount,
    addReplay: addReplay, replays: replays, replayCode: replayCode,
    decks: decks, addDeck: addDeck, removeDeck: removeDeck,
    stats: stats,
    exportCode: exportCode, importCode: importCode,
    clearAll: clearAll, clearGames: clearGames,
    _raw: load
  };
})();

<script>
/* =========================================================
   ARCANA CLASH — 効果音
   WebAudio でその場から合成（外部ファイル不要）
   ・白／ピンク／ブラウンの3種ノイズ素材
   ・波形歪み（ウェーブシェイパー）で炎や打撃に芯を出す
   ・LFO でフィルタを揺らして「ゴオー」という燃え方を作る
   ・畳み込みリバーブで余韻を付ける
   ・マスターにコンプを噛ませて音が重なっても割れないようにする
   ========================================================= */
var SFX = (function () {
  'use strict';

  var ctx = null, enabled = true;
  var master = null, comp = null, outGain = null;
  var revBus = null, revWet = null, conv = null;
  var bus = null, busRev = null;      // 1発ぶんの出力バス（音ごとの音量調整用）
  var BUF = null;
  var jit = 1;                       // 1発ごとの微妙なゆらぎ（機械的な連射感を消す）

  /* ---------- 素材づくり ---------- */
  function makeNoise(kind, sec) {
    var len = Math.floor(ctx.sampleRate * sec);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0), i, w;
    if (kind === 'white') {
      for (i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } else if (kind === 'pink') {
      var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (i = 0; i < len; i++) {
        w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    } else {                                   // brown（低域が濃い＝炎や地鳴り向き）
      var last = 0;
      for (i = 0; i < len; i++) {
        w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 3.6;
      }
    }
    return buf;
  }
  function buildNoise() {
    BUF = { white: makeNoise('white', 2.2), pink: makeNoise('pink', 2.2), brown: makeNoise('brown', 2.6) };
  }

  /** 残響用インパルス応答をノイズから作る */
  function makeIR(sec, decay) {
    var len = Math.floor(ctx.sampleRate * sec);
    var buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) {
        var t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (i < 40 ? i / 40 : 1);
      }
    }
    return buf;
  }

  function buildGraph() {
    master = ctx.createGain();  master.gain.value = 1.0;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -8; comp.knee.value = 14; comp.ratio.value = 4;
    comp.attack.value = 0.003;  comp.release.value = 0.16;
    outGain = ctx.createGain();  outGain.gain.value = 0.75;
    master.connect(comp); comp.connect(outGain); outGain.connect(ctx.destination);

    conv = ctx.createConvolver(); conv.buffer = makeIR(1.9, 3.2);
    revBus = ctx.createGain(); revBus.gain.value = 1;
    var hp = ctx.createBiquadFilter();          // 低域まで響かせると濁るので削る
    hp.type = 'highpass'; hp.frequency.value = 360;
    revWet = ctx.createGain(); revWet.gain.value = 0.36;
    revBus.connect(hp); hp.connect(conv); conv.connect(revWet); revWet.connect(master);
  }

  function init() {
    if (ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { ctx = null; return false; }
    buildGraph(); buildNoise();
    return true;
  }
  function unlock() { if (!init()) return; if (ctx.state === 'suspended') ctx.resume(); }
  function setEnabled(v) { enabled = !!v; if (enabled) unlock(); }
  function isEnabled() { return enabled; }

  /* ---------- 部品 ---------- */
  function T(delay) { return ctx.currentTime + (delay || 0); }

  function shaper(amount) {
    var n = 1024, c = new Float32Array(n), k = amount * 90;
    for (var i = 0; i < n; i++) {
      var x = i * 2 / n - 1;
      c[i] = (1 + k) * x / (1 + k * Math.abs(x));
    }
    var ws = ctx.createWaveShaper();
    ws.curve = c; ws.oversample = '2x';
    return ws;
  }

  function sweep(param, t0, dur, f0, f1, lin) {
    param.setValueAtTime(Math.max(8, f0), t0);
    if (f1 != null) {
      if (lin) param.linearRampToValueAtTime(Math.max(8, f1), t0 + dur);
      else param.exponentialRampToValueAtTime(Math.max(8, f1), t0 + dur);
    }
  }
  function addLfo(param, t0, dur, o) {
    var l = ctx.createOscillator();
    l.type = o.type || 'sine';
    l.frequency.value = o.f;
    var g = ctx.createGain(); g.gain.value = o.amt;
    l.connect(g); g.connect(param);
    l.start(t0); l.stop(t0 + dur + 0.1);
  }
  function ampEnv(p, t0, dur, vol, atk, rel) {
    vol = Math.max(0.0008, vol) * (0.93 + Math.random() * 0.14);
    atk = (atk == null) ? 0.006 : atk;
    rel = (rel == null) ? dur * 0.7 : rel;
    if (atk + rel > dur * 0.98) { var k = dur * 0.98 / (atk + rel); atk *= k; rel *= k; }
    var hold = Math.max(0.002, dur - atk - rel);
    p.setValueAtTime(0.0001, t0);
    p.exponentialRampToValueAtTime(vol, t0 + atk);
    p.exponentialRampToValueAtTime(vol * 0.8, t0 + atk + hold);
    p.exponentialRampToValueAtTime(0.0001, t0 + atk + hold + rel);
  }
  function out(g, rev) {
    g.connect(bus || master);
    if (rev) {
      var r = ctx.createGain(); r.gain.value = rev;
      g.connect(r); r.connect(busRev || revBus);
    }
  }

  /** 音ごとの最終音量。すべての音の聞こえの大きさを揃えるための係数 */
  var TRIM = {
    slash: 0.81, pierce: 0.68, sweep: 0.63, bash: 0.46,
    smash: 0.59, claw: 0.82, arrow: 1.64, dagger: 0.77,
    wind: 1.74, blood: 3.39, holy: 1.12, fire: 0.95,
    ice: 3.66, arcane: 1.33, shadow: 0.98, earth: 1.93,
    breath: 0.80, meteor: 0.75, heal: 1.40, ward: 1.67,
    guard: 2.94, revive: 1.04, hit: 2.77, bighit: 2.46,
    death: 1.81, execute: 0.88, round: 1.93, start: 1.42,
    win: 1.11, lose: 1.19, ui: 7.20, select: 6.48,
    lance: 0.78, wallop: 0.70, rock: 0.77, horn: 0.71,
    dclaw: 0.82, holystrike: 0.83, spear: 3.65, mark: 1.10,
    screech: 2.23, hex: 2.23, discord: 1.35, doom: 1.74,
    grasp: 1.59, arcanebolt: 0.94, logos: 1.21, thorn: 1.87,
    purge: 0.93, blizzard: 1.45, frost: 1.10, firebolt: 0.80,
    i_cut: 3.51, i_stab: 4.17, i_arrow: 4.27, i_rip: 2.73,
    i_crush: 1.95, i_ice: 3.37, i_fire: 2.29, i_arcane: 4.36,
    i_dark: 2.52, i_light: 3.09, i_wet: 3.37, i_gust: 5.32,
    i_thorn: 3.98, critboom: 2.84, aegis: 2.43, siege: 0.71,
    cannon: 0.84, wclaw: 1.24, venom: 1.22, parrow: 5.27,
    triple: 2.41, i_venom: 5.02, ember: 1.03, blaze: 0.99,
    iceclub: 0.74, frostroar: 1.57, i_cutwide: 4.69, i_horn: 3.77,
    i_rock: 3.06, i_mark: 1.38, i_spear: 3.58
  };

  /** 1発ぶんのバスを用意して鳴らす */
  function trigger(k) {
    var t = TRIM[k] == null ? 1 : TRIM[k];
    bus = ctx.createGain(); bus.gain.value = t; bus.connect(master);
    busRev = ctx.createGain(); busRev.gain.value = t; busRev.connect(revBus);
    var f = LIB[k] || LIB.hit;
    try { f(); } catch (e) { /* 無音で続行 */ }
    bus = null; busRev = null;
  }

  /** ノイズ系ボイス */
  function nz(o) {
    if (!ctx || !BUF) return;
    var t0 = T(o.delay), dur = o.dur;
    var src = ctx.createBufferSource();
    src.buffer = BUF[o.kind || 'white'];
    src.loop = true;
    if (o.rate) src.playbackRate.value = o.rate;
    var node = src;
    if (o.f0) {
      var f = ctx.createBiquadFilter();
      f.type = o.filter || 'bandpass';
      f.Q.value = (o.q == null) ? 1 : o.q;
      sweep(f.frequency, t0, dur, o.f0 * jit, o.f1 == null ? null : o.f1 * jit);
      if (o.lfo) addLfo(f.frequency, t0, dur, o.lfo);
      node.connect(f); node = f;
    }
    if (o.f2) {
      var f2 = ctx.createBiquadFilter();
      f2.type = o.filter2 || 'lowpass';
      f2.frequency.value = o.f2; f2.Q.value = o.q2 || 0.7;
      node.connect(f2); node = f2;
    }
    if (o.drive) { var ws = shaper(o.drive); node.connect(ws); node = ws; }
    var g = ctx.createGain();
    ampEnv(g.gain, t0, dur, o.vol == null ? 0.25 : o.vol, o.atk, o.rel);
    node.connect(g); out(g, o.rev);
    src.start(t0, Math.random() * 1.2);
    src.stop(t0 + dur + 0.3);
  }

  /**
   * 咆哮・唸り声。
   * 声帯（のこぎり波＋ざらつきノイズ）を母音のフォルマント3本で鳴らす。
   * vowel:[F1,F2,F3] → vowel2 を渡すと「うぉ→あー」のように口の形が変わる。
   */
  function growl(o) {
    if (!ctx || !BUF) return;
    var t0 = T(o.delay), dur = o.dur;
    var src = ctx.createGain(); src.gain.value = 1;

    var O = ctx.createOscillator();
    O.type = o.wave || 'sawtooth';
    sweep(O.frequency, t0, dur, o.f0 * jit, o.f1 == null ? null : o.f1 * jit);
    addLfo(O.frequency, t0, dur, o.vib || { f: 5.5, amt: o.f0 * 0.03 });
    var og = ctx.createGain(); og.gain.value = 1;
    O.connect(og); og.connect(src);
    O.start(t0); O.stop(t0 + dur + 0.3);

    // 1オクターブ下（体格の大きさ）
    if (o.sub) {
      var O2 = ctx.createOscillator(); O2.type = 'sawtooth';
      sweep(O2.frequency, t0, dur, o.f0 * jit * 0.5, o.f1 == null ? null : o.f1 * jit * 0.5);
      var g2 = ctx.createGain(); g2.gain.value = o.sub;
      O2.connect(g2); g2.connect(src);
      O2.start(t0); O2.stop(t0 + dur + 0.3);
    }
    // 声のざらつき（濁声）
    if (o.rasp) {
      var n = ctx.createBufferSource(); n.buffer = BUF.pink; n.loop = true;
      var nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 1400; nf.Q.value = 0.6;
      var ng = ctx.createGain(); ng.gain.value = o.rasp;
      n.connect(nf); nf.connect(ng); ng.connect(src);
      n.start(t0, Math.random() * 1.0); n.stop(t0 + dur + 0.3);
    }

    var mix = ctx.createGain();
    var V1 = o.vowel, V2 = o.vowel2 || o.vowel;
    var AMP = [1, 0.62, 0.3], QQ = [7, 9, 12];
    for (var i = 0; i < V1.length; i++) {
      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = QQ[i] || 10;
      sweep(bp.frequency, t0, dur, V1[i], V2[i]);
      var fg = ctx.createGain(); fg.gain.value = AMP[i] || 0.25;
      src.connect(bp); bp.connect(fg); fg.connect(mix);
    }
    var node = mix;
    if (o.drive) { var ws = shaper(o.drive); node.connect(ws); node = ws; }
    var g = ctx.createGain();
    ampEnv(g.gain, t0, dur, o.vol == null ? 0.3 : o.vol, o.atk == null ? 0.05 : o.atk, o.rel);
    node.connect(g); out(g, o.rev);
  }

  /**
   * 金属の残響。
   * 非整数倍音を複数重ね、1本ごとに2つずつわずかにずらして「うなり」を出す。
   * これが無いと金属は「ピー」という電子音にしか聞こえない。
   */
  function metal(o) {
    if (!ctx) return;
    var t0 = T(o.delay), dur = o.dur || 0.6;
    var fs = o.f || [2870, 4310, 6120];
    var amp = o.vol == null ? 0.09 : o.vol;
    fs.forEach(function (f, i) {
      var v = amp * Math.pow(o.roll == null ? 0.62 : o.roll, i);
      var d = dur * Math.pow(0.78, i);
      [0, 1].forEach(function (k) {
        var O = ctx.createOscillator();
        O.type = o.type || 'triangle';
        O.frequency.setValueAtTime(f * jit * (k ? 1 + (o.beat || 0.004) : 1), t0);
        if (o.drop) O.frequency.exponentialRampToValueAtTime(f * jit * o.drop, t0 + d);
        var g = ctx.createGain();
        ampEnv(g.gain, t0, d, v * (k ? 0.72 : 1), 0.001, d * 0.97);
        O.connect(g); out(g, o.rev == null ? 0.55 : o.rev);
        O.start(t0); O.stop(t0 + d + 0.2);
      });
    });
  }

  /** 武器が空を切る音。重い武器ほど低く、軽い武器ほど細く鳴らす */
  function swing(o) {
    var lo = o.lo || 700, hi = o.hi || 4200;
    nz({ kind: o.kind || 'pink', f0: lo, f1: hi, filter: 'bandpass', q: o.q == null ? 1.1 : o.q,
         dur: o.dur || 0.12, vol: o.vol == null ? 0.22 : o.vol,
         atk: (o.dur || 0.12) * 0.45, rel: (o.dur || 0.12) * 0.4, delay: o.delay });
    if (o.mass) {
      osc({ type: 'sawtooth', f0: o.mass, f1: o.mass * 0.55, dur: (o.dur || 0.12) * 1.1,
            vol: 0.10, atk: (o.dur || 0.12) * 0.4, rel: (o.dur || 0.12) * 0.5,
            lp: o.mass * 5, delay: o.delay });
    }
  }

  /** 音程のあるボイス */
  function osc(o) {
    if (!ctx) return;
    var t0 = T(o.delay), dur = o.dur;
    var O = ctx.createOscillator();
    O.type = o.type || 'sine';
    sweep(O.frequency, t0, dur, o.f0 * jit, o.f1 == null ? null : o.f1 * jit, o.lin);
    if (o.detune) O.detune.value = o.detune;
    if (o.vib) addLfo(O.frequency, t0, dur, o.vib);
    var node = O;
    if (o.drive) { var ws = shaper(o.drive); node.connect(ws); node = ws; }
    if (o.lp) {
      var f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.lq || 0.8;
      node.connect(f); node = f;
    }
    var g = ctx.createGain();
    ampEnv(g.gain, t0, dur, o.vol == null ? 0.2 : o.vol, o.atk, o.rel);
    node.connect(g); out(g, o.rev);
    O.start(t0); O.stop(t0 + dur + 0.3);
  }

  /* ---------- 効果音カタログ ---------- */
  var LIB = {

    /* ===== 近接：刃と打撃 ===== */
    // 剣：ヒュッ（空気を裂く）→ バシュッ（斬撃）→ キィン（刃鳴り）
    slash: function () {
      nz({ kind: 'pink',  f0: 650,  f1: 5200, filter: 'bandpass', q: 0.9, dur: 0.11, vol: 0.20, atk: 0.03, rel: 0.05 });
      nz({ kind: 'white', f0: 6200, f1: 1100, filter: 'highpass', dur: 0.06, vol: 0.44, atk: 0.001, rel: 0.055, delay: 0.09, drive: 0.55 });
      osc({ type: 'sine', f0: 195, f1: 50, dur: 0.17, vol: 0.34, atk: 0.002, rel: 0.16, delay: 0.09 });
      osc({ type: 'triangle', f0: 2870, dur: 0.32, vol: 0.055, atk: 0.002, rel: 0.31, delay: 0.095, rev: 0.55 });
      osc({ type: 'triangle', f0: 4310, dur: 0.24, vol: 0.030, atk: 0.002, rel: 0.23, delay: 0.098, rev: 0.55 });
      nz({ kind: 'white', f0: 2600, filter: 'bandpass', q: 0.5, dur: 0.20, vol: 0.10, atk: 0.001, rel: 0.19, delay: 0.09, rev: 0.75 });
    },

  /* =========================================================
     1小節ぶんを予約する
     ========================================================= */
  function scheduleBar(song, tone, bar, t0, out, rv) {
    var spb = 60 / song.bpm;
    var sec = Math.floor(bar / song.bars) % SECTIONS;   /* 0=A 1=B 2=C */
    var barIn = bar % song.bars;
    var data = song.sections[sec];
    var ch = data.chords[barIn];
    var mel = data.mel[barIn];
    var barLen = spb * song.beats;
    var tail = sec === 2 && barIn >= song.bars - 2;     /* Cの終い＝高揚の2小節 */
    var i, j, t;

    /* --- 和音のパッド。Bは厚く、Cは薄く --- */
    var padG = (tone === 'orch' ? 0.13 : 0.055) * (sec === 1 ? 1.2 : sec === 2 ? 0.85 : 1);
    for (i = 0; i < ch.n.length; i++) {
      pad(out, rv, t0, midi(ch.n[i] - 12), barLen * 0.98, padG, tone);
    }

    if (song.id === 'up') {
      if (sec === 2 && !tail) {
        /* --- C：低音は2分で置き、拍を消して息をつく --- */
        bass(out, t0, midi(ch.b), spb * 1.8, 0.2, tone);
        bass(out, t0 + spb * 2, midi(ch.b), spb * 1.8, 0.17, tone);
        for (i = 0; i < song.beats; i++) {
          pluck(out, rv, t0 + i * spb, midi(ch.n[i % 3] + 12), spb * 0.8,
                tone === 'orch' ? 0.055 : 0.04, tone);
        }
        taiko(out, rv, t0, 0.26);
      } else {
        /* --- A・B・Cの終い：低音8分。Bはオクターブで跳ねる --- */
        for (i = 0; i < song.beats * 2; i++) {
          var up = sec === 1 ? (i % 2 ? 12 : 0) : (i % 4 === 3 ? 12 : 0);
          bass(out, t0 + i * spb * 0.5, midi(ch.b + up), spb * 0.42,
               sec === 1 ? 0.34 : 0.3, tone);
        }
        var arp = [ch.n[0], ch.n[1], ch.n[2], ch.n[1] + 12, ch.n[2], ch.n[1], ch.n[2], ch.n[0] + 12];
        for (i = 0; i < song.beats * 4; i++) {
          t = t0 + i * spb * 0.25;
          var lift = sec === 1 && i % 2 ? 24 : 12;
          pluck(out, rv, t, midi(arp[i % arp.length] + lift), spb * 0.24,

        }
        var kicks = sec === 1 ? [0, 1, 1.5, 2, 2.75, 3] : [0, 1.5, 2, 2.75];
        var snares = [1, 3];
        if (tail) {

          for (i = 0; i < song.beats * 2; i++)
            snare(out, rv, t0 + i * spb * 0.5, 0.12 + i * 0.035, tone);
          for (i = 0; i < song.beats; i++) kick(out, t0 + i * spb, 0.6);
        } else {
          for (i = 0; i < kicks.length; i++) kick(out, t0 + kicks[i] * spb, 0.62);
          for (i = 0; i < snares.length; i++) snare(out, rv, t0 + snares[i] * spb, sec === 1 ? 0.4 : 0.34, tone);

        var hatN = sec === 1 ? 4 : 2;
        for (i = 0; i < song.beats * hatN; i++) {

        for (i = 0; i < song.beats * dense; i++) {
          t = t0 + i * spb / dense;
          var oct = (i >= song.beats * dense / 2) ? 12 : 0;
          pluck(out, rv, t, midi(ch.n[pat[i % 4]] + oct), spb * (dense === 4 ? 0.4 : 0.7),
                (tone === 'orch' ? 0.09 : 0.055) * (dense === 4 ? 0.8 : 1), tone);
        }
        taiko(out, rv, t0, sec === 1 ? 0.5 : 0.42);
        taiko(out, rv, t0 + spb * 2.5, sec === 1 ? 0.36 : 0.3);
        if (sec === 1) taiko(out, rv, t0 + spb * 1.5, 0.26);

          }
        }
      }
    }

      ? (sec === 1 ? 0.18 : sec === 2 ? 0.13 : 0.16)
      : (sec === 1 ? 0.11 : sec === 2 ? 0.08 : 0.1);

      var m = mel[j];
      lead(out, rv, t0 + m[0] * spb, midi(m[1]), m[2] * spb * 0.92, leadG, tone);
      if (sec === 1) {
        lead(out, rv, t0 + m[0] * spb, midi(m[1] + 12), m[2] * spb * 0.92,

      }
    }
