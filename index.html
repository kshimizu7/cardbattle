  /* =========================================================
     再生
     曲ごとに専用の出力（voice）を作り、切り替え時は古いほうを
     フェードして捨てる。こうしないと、先読みで予約済みの音が
     次の曲に重なって鳴ってしまう。
     ========================================================= */
  var voice = null;

  function newVoice() {
    var g = ctx.createGain();  g.gain.value = 0.0001; g.connect(master);
    var rv = ctx.createGain(); rv.gain.value = 0.0001; rv.connect(conv);
    var t = ctx.currentTime;
    g.gain.linearRampToValueAtTime(1, t + 0.35);
    rv.gain.linearRampToValueAtTime(1, t + 0.35);
    return { g: g, rv: rv };
  }

  function killVoice(v, fade) {
    if (!v) return;
    var t = ctx.currentTime;
    [v.g, v.rv].forEach(function (n) {
      n.gain.cancelScheduledValues(t);
      n.gain.setValueAtTime(n.gain.value, t);
      n.gain.linearRampToValueAtTime(0.0001, t + fade);
    });
    setTimeout(function () {
      try { v.g.disconnect(); v.rv.disconnect(); } catch (e) {}
    }, (fade + 1.5) * 1000);
  }

  function tick() {
    if (!cur || !voice) return;
    var song = SONGS[cur.song];
    while (nextTime < ctx.currentTime + 0.7) {
      nextTime += scheduleBar(song, cur.tone, nextBar, nextTime, voice.g, voice.rv);
      nextBar++;
    }
  }

  function play(songId, tone) {
    init();
    if (ctx.state === 'suspended') ctx.resume();
    if (timer) { clearInterval(timer); timer = null; }
    killVoice(voice, 0.35);
    cur = { song: songId in SONGS ? songId : 'up', tone: tone === 'chip' ? 'chip' : 'orch' };
    revWet.gain.setValueAtTime(cur.tone === 'orch' ? 0.32 : 0.1, ctx.currentTime);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(vol, ctx.currentTime);
    voice = newVoice();
    nextBar = 0;
    nextTime = ctx.currentTime + 0.12;
    tick();
    timer = setInterval(tick, 120);
    return cur;
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    killVoice(voice, 0.5);
    voice = null;
    cur = null;
  }

  function setVolume(v) {
    vol = Math.max(0, Math.min(1, v));
    if (master) {
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(vol, ctx.currentTime);
    }
  }

  function isPlaying() { return !!cur; }
  function current() { return cur; }

  /* =========================================================
     書き出し（MP3などにするためのオフライン合成）
     ========================================================= */
  function render(songId, tone, bars, rate) {
    var song = SONGS[songId];
    var spb = 60 / song.bpm;
    var total = spb * song.beats * bars + 3;
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    var off = new OAC(2, Math.ceil((rate || 44100) * total), rate || 44100);

    /* 楽器は外側の ctx を参照しているので、書き出し中だけ差し替える */
    var save = { ctx: ctx, master: master, comp: comp, conv: conv, revWet: revWet };
    ctx = off;
    comp = off.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.006;
    master = off.createGain(); master.gain.value = 0.62;
    conv = off.createConvolver(); conv.buffer = makeImpulse(2.4, 2.6);
    revWet = off.createGain(); revWet.gain.value = tone === 'orch' ? 0.32 : 0.1;
    conv.connect(revWet); revWet.connect(comp);
    master.connect(comp); comp.connect(off.destination);

    var t = 0.05;
    for (var b = 0; b < bars; b++) t += scheduleBar(song, tone, b, t, master, conv);

    var p = off.startRendering();
    ctx = save.ctx; master = save.master; comp = save.comp;
    conv = save.conv; revWet = save.revWet;
    return p;
  }

  /* 波形を見せたいとき用（ゲーム本体では使わない） */
  var ana = null;
  function analyser() {
    init();
    if (!ana) {
      ana = ctx.createAnalyser();
      ana.fftSize = 1024; ana.smoothingTimeConstant = 0.75;
      comp.connect(ana);
    }
    return ana;
  }

  return {
    play: play, stop: stop, setVolume: setVolume,
    isPlaying: isPlaying, current: current,
    render: render, analyser: analyser, SONGS: SONGS
  };
})();

  /* ================= 頭部 ================= */
  function headOf(kind, p, h) {
    var x = h.x, y = h.y, r = h.r;
    var C = p.c, A = p.a;
    var eyes = function (dy, w, sep) {
      dy = dy || 1; w = w || 2.4; sep = sep || 3.2;
      return '<g fill="' + C + '"><ellipse cx="' + (x - sep) + '" cy="' + (y + dy) + '" rx="' + w + '" ry="' + (w * 0.62) + '" transform="rotate(-12 ' + (x - sep) + ' ' + (y + dy) + ')"/>' +
             '<ellipse cx="' + (x + sep) + '" cy="' + (y + dy) + '" rx="' + w + '" ry="' + (w * 0.62) + '" transform="rotate(12 ' + (x + sep) + ' ' + (y + dy) + ')"/></g>';
    };
    var skull = '<path d="M' + x + ' ' + (y - r - 2) + ' c' + (-r * 1.15) + ' 0 ' + (-r * 1.25) + ' ' + (r * 0.95) + ' ' + (-r * 1.25) + ' ' + (r * 1.5) +
      ' c0 ' + (r * 0.9) + ' ' + (r * 0.55) + ' ' + (r * 1.25) + ' ' + (r * 1.25) + ' ' + (r * 1.25) +
      ' s' + (r * 1.25) + ' ' + (-r * 0.35) + ' ' + (r * 1.25) + ' ' + (-r * 1.25) +
      ' c0 ' + (-r * 0.55) + ' ' + (-r * 0.1) + ' ' + (-r * 1.5) + ' ' + (-r * 1.25) + ' ' + (-r * 1.5) + 'z"/>';

    switch (kind) {
      case 'greathelm':
        return skull +
          '<path d="M' + (x - r) + ' ' + (y - r + 1) + ' h' + (r * 2) + ' l-1.5 4 h-' + (r * 2 - 3) + 'z" fill="' + A + '"/>' +
          '<path d="M' + x + ' ' + (y - r - 9) + ' l3 8 h-6z" fill="' + C + '"/>' +
          '<g fill="' + C + '"><rect x="' + (x - 6) + '" y="' + (y - 0.5) + '" width="4.5" height="2.4" rx="1.2"/><rect x="' + (x + 1.5) + '" y="' + (y - 0.5) + '" width="4.5" height="2.4" rx="1.2"/></g>';
      case 'helm':
        return skull +
          '<path d="M' + (x - r - 1) + ' ' + (y - 1) + ' q' + (r + 1) + ' -5 ' + (r * 2 + 2) + ' 0 l-1 2.6 q-' + (r) + ' -4 -' + (r * 2) + ' 0z" fill="' + A + '"/>' +
          '<path d="M' + (x - 1.4) + ' ' + (y - r - 1) + ' h2.8 v' + (r + 5) + ' h-2.8z" fill="' + A + '" opacity=".9"/>' +
          eyes(2.4, 2.1, 3.6);
      case 'winghelm':
        return skull +
          '<path d="M' + (x - r) + ' ' + (y - 2) + ' c-7-1-11-5-13-9 c7-1 12 1 15 6z" fill="' + A + '"/>' +
          '<path d="M' + (x + r) + ' ' + (y - 2) + ' c7-1 11-5 13-9 c-7-1-12 1-15 6z" fill="' + A + '"/>' +
          '<path d="M' + (x - 1.3) + ' ' + (y - r - 1) + ' h2.6 v' + (r + 4) + ' h-2.6z" fill="' + A + '"/>' +
          eyes(2.2, 2, 3.6);
      case 'hood':
        return '<path d="M' + x + ' ' + (y - r - 4) + ' c-' + (r * 1.5) + ' 0 -' + (r * 1.7) + ' ' + (r * 1.5) + ' -' + (r * 1.5) + ' ' + (r * 2.4) +
          ' c0.3 ' + (r * 1.1) + ' ' + (r * 0.8) + ' ' + (r * 1.3) + ' ' + (r * 1.5) + ' ' + (r * 1.3) +
          ' s' + (r * 1.4) + ' -' + (r * 0.2) + ' ' + (r * 1.5) + ' -' + (r * 1.3) +
          ' c0.2 -' + (r * 0.9) + ' 0 -' + (r * 2.4) + ' -' + (r * 1.5) + ' -' + (r * 2.4) + 'z"/>' +
          '<path d="M' + (x - r * 0.95) + ' ' + (y - 1) + ' q' + (r * 0.95) + ' ' + (r * 0.8) + ' ' + (r * 1.9) + ' 0 q-' + (r * 0.4) + ' ' + (r * 1.4) + ' -' + (r * 0.95) + ' ' + (r * 1.5) +
          ' q-' + (r * 0.55) + ' -0.1 -' + (r * 0.95) + ' -' + (r * 1.5) + 'z" fill="#01030a"/>' +
          eyes(2.2, 2.1, 3.3);
      case 'crown':
        return skull +
          '<path d="M' + (x - r - 1) + ' ' + (y - r - 1) + ' l2.5 -7 2.5 5 3 -8 3 8 3-5 3 8 3-5 2.5 7z" fill="' + A + '"/>' +
          '<circle cx="' + x + '" cy="' + (y - r - 6) + '" r="2" fill="' + C + '"/>' + eyes(1.6, 2.1, 3.3);
      case 'circlet':

          '<path d="M' + x + ' ' + (y - 9) + ' l2.6 4.5 -2.6 3 -2.6-3z" fill="' + C + '"/>' + eyes(2, 2.1, 3.3);
      case 'horns':
        return skull +
          '<path d="M' + (x - 4) + ' ' + (y - r + 1) + ' Q' + (x - 14) + ' ' + (y - r - 3) + ' ' + (x - 18) + ' ' + (y - r - 13) +
            ' Q' + (x - 13) + ' ' + (y - r - 5) + ' ' + (x - 1) + ' ' + (y - r - 3) + 'z"/>' +
          '<path d="M' + (x + 4) + ' ' + (y - r + 1) + ' Q' + (x + 14) + ' ' + (y - r - 3) + ' ' + (x + 18) + ' ' + (y - r - 13) +
            ' Q' + (x + 13) + ' ' + (y - r - 5) + ' ' + (x + 1) + ' ' + (y - r - 3) + 'z"/>' +

      case 'bull':
        return skull +
          '<path d="M' + (x - r + 1) + ' ' + (y - 6) + ' Q' + (x - 16) + ' ' + (y - 6) + ' ' + (x - 23) + ' ' + (y - 14) +

          '<path d="M' + (x + r - 1) + ' ' + (y - 6) + ' Q' + (x + 16) + ' ' + (y - 6) + ' ' + (x + 23) + ' ' + (y - 14) +
            ' Q' + (x + 18) + ' ' + (y - 3) + ' ' + (x + r - 2) + ' ' + (y - 1) + 'z"/>' +
          '<ellipse cx="' + x + '" cy="' + (y + r) + '" rx="5.5" ry="3.6" fill="' + A + '" opacity=".55"/>' +
          eyes(0.5, 2.5, 4);
      case 'wolf':
        return '<path d="M' + (x - 6) + ' ' + (y - 5) + ' l-4-11 9 6z"/><path d="M' + (x + 6) + ' ' + (y - 5) + ' l4-11 -9 6z"/>' + skull +
          '<path d="M' + (x + r - 2) + ' ' + (y + 1) + ' l9 3 -9 4z"/>' +
          '<path d="M' + (x + r + 1) + ' ' + (y + 3.4) + ' l5 0.6 -5 1.2z" fill="' + A + '"/>' +
          '<g fill="' + C + '"><path d="M' + (x - 5) + ' ' + (y - 1) + ' l5 2 -5 2z"/><path d="M' + (x + 3) + ' ' + (y - 1.5) + ' l4 1.6 -4 1.6z"/></g>';
      case 'bird':
        return skull + '<path d="M' + (x + r - 1) + ' ' + (y + 1) + ' l13 4 -13 3.5z" fill="' + A + '"/>' +
          '<path d="M' + (x - 4) + ' ' + (y - r - 2) + ' q4-7 8 0 q-4-2 -8 0z" fill="' + A + '"/>' +
          '<g fill="' + C + '"><circle cx="' + (x - 3) + '" cy="' + (y - 1) + '" r="1.9"/><circle cx="' + (x + 4) + '" cy="' + (y - 1) + '" r="1.9"/></g>';
      case 'skull':
        return skull +
          '<g fill="' + C + '"><ellipse cx="' + (x - 3.2) + '" cy="' + (y - 0.5) + '" rx="2.9" ry="3.4"/><ellipse cx="' + (x + 3.2) + '" cy="' + (y - 0.5) + '" rx="2.9" ry="3.4"/>' +
          '<path d="M' + (x - 2.4) + ' ' + (y + 5) + ' h1.6 v4 h-1.6z M' + (x + 0.8) + ' ' + (y + 5) + ' h1.6 v4 h-1.6z"/></g>';
      case 'dragon':
        return '<path d="M' + (x - 12) + ' ' + (y + 2) + ' c0-8 7-14 16-14 c11 0 20 5 24 9 l-6 3 5 3 -8 4 c-4 4-11 7-17 7 c-9 0-14-5-14-12z"/>' +
          '<path d="M' + (x - 6) + ' ' + (y - 11) + ' c-2-8 2-12 6-13 c-1 5 0 9 3 12z"/>' +
          '<path d="M' + (x + 1) + ' ' + (y - 13) + ' c0-8 4-11 9-11 c-3 4-3 8-2 11z"/>' +
          '<path d="M' + (x + 14) + ' ' + (y + 6) + ' l10 2 -10 2z" fill="' + A + '"/>' +
          '<ellipse cx="' + (x + 7) + '" cy="' + (y + 1) + '" rx="4" ry="2.4" fill="' + C + '" transform="rotate(-14 ' + (x + 7) + ' ' + (y + 1) + ')"/>';
      case 'flame':
        return '<path d="M' + x + ' ' + (y - r - 12) + ' c9 12 ' + (r + 6) + ' 16 ' + (r + 6) + ' ' + (r + 4) +
          ' c0 ' + (r * 1.1) + ' -6 ' + (r * 1.3) + ' -' + (r + 6) + ' ' + (r * 1.3) +
          ' s-' + (r + 6) + ' -' + (r * 0.3) + ' -' + (r + 6) + ' -' + (r * 1.3) + ' c0-' + (r - 2) + ' 5-' + (r + 2) + ' ' + (r + 6) + ' -' + (r + 4) + 'z"/>' +
          '<path d="M' + x + ' ' + (y - 6) + ' c4 6 6 9 6 12 c0 4-3 6-6 6 s-6-2-6-6 c0-3 2-6 6-12z" fill="' + A + '"/>' +
          eyes(1.6, 2, 3.4);
      case 'wisp':

          '<circle cx="' + x + '" cy="' + y + '" r="' + (r * 0.6) + '" fill="' + A + '" opacity=".45"/>' +
          eyes(0, 2.6, 3.6);

    }
  }

  /* ================= 背景装飾 ================= */
  function decoOf(kind, p) {
    var out = '', i;
    switch (kind) {
      case 'rays':
        for (i = 0; i < 14; i++)
          out += '<path d="M50 48 l-2.6 -60 5.2 0z" fill="' + p.c + '" opacity=".13" transform="rotate(' + (i * 25.7) + ' 50 48)"/>';
        return out;
      case 'embers':
        for (i = 0; i < 22; i++) {
          var x = 6 + (i * 37) % 88, y = 6 + (i * 53) % 86, r = 0.7 + (i % 4) * 0.7;
          out += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + p.c + '" opacity="' + (0.14 + (i % 5) * 0.11).toFixed(2) + '"/>';
        }
        return out;
      case 'flakes':
        for (i = 0; i < 12; i++) {
          var fx = 8 + (i * 29) % 84, fy = 8 + (i * 41) % 82, sc = (0.6 + (i % 3) * 0.4).toFixed(2);
          out += '<g transform="translate(' + fx + ' ' + fy + ') rotate(' + (i * 21) + ') scale(' + sc + ')" opacity=".3"><path d="M0 -5 v10 M-4.3 -2.5 l8.6 5 M-4.3 2.5 l8.6 -5" stroke="' + p.c + '" stroke-width="1.1"/></g>';
        }
        return out;

function () {\n  'use strict';\n\n  /* ---------- 解析 ---------- */\n  function parse(str) {\n    var pos = 0;\n    function seq(stop) {\n      var items = [], buf = '';\n      function flush() { if (buf) { items.push({ t: 'lit', v: buf }); buf = ''; } }\n      while (pos < str.length) {\n        var ch = str[pos];\n        if (stop && (ch === '|' || ch === '}')) break;\n        if (ch === '{') { pos++; flush(); items.push(alt()); continue; }\n        if (ch === '$') {\n          var m = /^\\$([a-zA-Z_][a-zA-Z0-9_]*)/.exec(str.slice(pos));\n          if (m) { pos += m[0].length; flush(); items.push({ t: 'var', v: m[1] }); continue; }\n        }\n        buf += ch; pos++;\n      }\n      flush();\n      return { t: 'seq', v: items };\n    }\n    function alt() {\n      var opts = [seq(true)];\n      while (str[pos] === '|') { pos++; opts.push(seq(true)); }\n      if (str[pos] === '}') pos++;\n      return { t: 'alt', v: opts };\n    }\n    return seq(false);\n  }\n\n  /* ---------- 数える ---------- */\n  function count(node, vars) {\n    if (typeof node === 'string') node = parse(node);\n    switch (node.t) {\n      case 'lit': return 1;\n      case 'var': return (vars && vars[node.v]) || 1;\n      case 'seq': return node.v.reduce(function (a, n) { return a * count(n, vars); }, 1);\n      case 'alt': return node.v.reduce(function (a, n) { return a + count(n, vars); }, 0);\n    }\n    return 1;\n  }\n\n  /* ---------- 1つ選ぶ ---------- */\n  function expand(node, ctx, rnd) {\n    rnd = rnd || Math.random;\n    if (typeof node === 'string') node = parse(node);\n    switch (node.t) {\n      case 'lit': return node.v;\n      case 'var':\n        var f = ctx && ctx[node.v];\n        return typeof f === 'function' ? f() : (f == null ? '' : String(f));\n      case 'seq': return node.v.map(function (n) { return expand(n, ctx, rnd); }).join('');\n      case 'alt': return expand(node.v[Math.floor(rnd() * node.v.length)], ctx, rnd);\n    }\n    return '';\n  }\n\n  return { parse: parse, count: count, expand: expand };\n});\n\n/* ダンジョンの設定。\n   open … プレイヤーに開示する。クエスト選択の画面に出る\n   hush … 裏設定。プレイヤーには見せないが、語彙・出来事・敵の傾向を決める\n   V    … 語彙。同じ出来事の文でも、ここが差し替わることで別の場所に読める\n   tags … この場所に出しうる出来事の種類\n   mix  … 出来事の出やすさ（罠・敵・宝・人）                            */\n\nconst DUNGEONS = {\n  /* ============ 1. 人がいない、罠と敵だらけ ============ */\n  beast: {\n    id: 'beast',\n    name: '喰らいの洞',\n    sub: '人の手が入っていない自然洞',\n    danger: 1,\n    open:\n      '村の北、崩れた沢の奥に口を開けている。人の手はまったく入っていない。'\n      + 'きこりが二人、羊を追った子どもが一人、戻っていない。'\n      + '中にあるのは獣と、洞そのものの気まぐれだけだ。',\n    hush:\n      '獣道の崩落でできた自然洞。知性のあるものは棲んでいない。'\n      + '罠はすべて自然のもの——落盤、地割れ、よどんだ毒気、抜ける床。'\n      + 'だから「仕掛け」の語は使わない。人工物も、文字も、明かりも出てこない。'\n      + '奥の主は特別な存在ではなく、単に一番大きく育った個体である。',\n    V: {\n      place: '{洞|洞窟|岩の裂け目}',\n      trace: '{獣の掻き跡|抜け落ちた毛|噛み砕かれた骨}',\n      who2:  '{戻らなかったきこり|羊を追った子ども|迷い込んだ誰か}',   // 入って、戻らなかった者たち\n      lord:  '{けもの|一番大きな個体|主}',\n      smell: '{獣の匂い|濡れた毛の匂い|すえた息}',\n      sound: '{遠い唸り|滴る水|自分たちの足音}',\n      light: '{松明の輪|手にした灯り}'\n    },\n    tags: ['nature', 'beast', 'wild'],\n    mix: { trap: 3, enemy: 4, loot: 1, human: 0 }\n  },\n\n  /* ============ 2. かつて人が住んでいた、罠が多い ============ */\n  mine: {\n    id: 'mine',\n    name: '黙した坑道',\n    sub: '住人の絶えた鉱山',\n    danger: 2,\n    open:\n      'かつて三十人が暮らした鉱山の坑道。ある年の冬、住人はひとり残らず姿を消した。'\n      + '家財も、掘り出した鉱石も、そのまま置き去りにされている。'\n      + '持ち出そうとした者が何人か向かい、そのうち何人かは戻ってこなかった。',\n    hush:\n      '住人は疫病で全滅した。仕掛けは、彼らが自分たちの財を守るために自ら組んだもの。'\n      + 'つまり罠は「悪意」ではなく「留守番」である。'\n      + '生活の跡が生々しく残っているのがこの場所の肌ざわりで、'\n      + '出てくる死体はほとんどが後から来た盗掘者のほう。'\n      + '奥の主は、最後まで坑道に残った鉱夫長の成れの果て。',\n    V: {\n      place: '{坑道|旧坑|地下の住まい}',\n      trace: '{生活の跡|使いかけの道具|冷えたかまど}',\n      who2:  '{先に入った者|盗掘者|欲を出した誰か}',\n      lord:  '{坑道|仕掛け|残された意志}',\n      smell: '{かびの匂い|石炭の匂い|人の暮らしの名残}',\n      sound: '{梁の軋み|どこかで落ちる石|風が坑を抜ける音}',\n      light: '{松明の輪|壁に残った灯り台}'\n    },\n    tags: ['made', 'trap', 'relic', 'human'],\n    mix: { trap: 4, enemy: 2, loot: 3, human: 1 }\n  },\n\n  /* ============ 3. 宝が巧妙に隠され、冒険者も多い ============ */\n  maze: {\n    id: 'maze',\n    name: '欲深き迷路',\n    sub: '財宝が眠ると伝わる人工迷宮',\n    danger: 3,\n    open:\n      '誰が、何のために造ったのかは分かっていない。'\n      + 'ただ「財宝が眠る」という話だけが独り歩きし、腕自慢が絶えず集まってくる。'\n      + '入口には常に何人かの姿があり、奥へ行くほど人は減る。',\n    hush:\n      '迷宮そのものが宝を守るために造られた仕掛けの塊で、'\n      + '通路の形も、宝の隠し方も、挑む者を試すように出来ている。'\n      + 'ここでの危険は罠と敵だけではない——同じ宝を狙う人間が、いちばん厄介である。'\n      + '奥の主は、最初にこの迷宮を攻略しかけて取り込まれた冒険者。',\n    V: {\n      place: '{迷宮|回廊|石組みの通路}',\n      trace: '{先客の血痕|削られた壁の目印|途中で捨てられた装備}',\n      who2:  '{冒険者|同じ宝を狙う連中|腕自慢}',\n      lord:  '{迷宮|仕掛けを組んだ者|最奥の主}',\n      smell: '{油の匂い|鉄と血の匂い|人いきれ}',\n      sound: '{遠くで人の声|金属が擦れる音|誰かの短い悲鳴}',\n      light: '{松明の輪|壁の燭台の名残}'\n    },\n    tags: ['made', 'trap', 'loot', 'human', 'rival'],\n    mix: { trap: 4, enemy: 3, loot: 4, human: 3 }\n  },\n\n  /* ============ 4. 竜と取り巻きが遺物を護る神域 ============ */\n  shrine: {\n    id: 'shrine',\n    name: '護りの神域',\n    sub: '竜が遺物を護る聖域',\n    danger: 4,\n    open:\n      '山ひとつをくり抜いて造られた地下神殿。奥に「触れてはならぬもの」が眠り、'\n      + '竜がそれを護っていると伝わる。近づく者は絶えて久しい。'\n      + '——だが今年、山の水が枯れた。原因は、おそらく奥にある。',\n    hush:\n      '竜はもともと人間の守り手で、遺物を封じるために自ら竜となった。'\n      + '取り巻きは、同じ誓いを立てた信徒の成れの果てである。'\n      + 'つまりここの敵は「襲ってくる怪物」ではなく「務めを果たしている者たち」で、'\n      + 'その分だけ言葉に敬意と哀れが混じる。'\n      + '罠は物理ではなく結界・幻・試練の形をとる。文字と灯りが多い。',\n    V: {\n      place: '{神域|地下神殿|石の回廊}',\n      trace: '{古い刻印|供物の跡|すり減った祈りの床}',\n      who2:  '{巡礼者|誓いを立てた者|かつての信徒}',\n      lord:  '{竜|護り手|眠るもの}',\n      smell: '{焚いた香|乾いた石|雷を待つ空気}',\n      sound: '{詠唱のような残響|低く長い呼吸|石が石に触れる音}',\n      light: '{松明の輪|絶えず燃えている灯明}'\n    },\n    tags: ['holy', 'relic', 'ward', 'dragon'],\n    mix: { trap: 2, enemy: 3, loot: 2, human: 1 }\n  }\n};\n\n\n/* 移動中に流す一言。\n   語彙（$place $sound $smell $light $trace $lord）がダンジョンごとに差し替わるので、\n   同じ枝を引いても別の場所の文に読める。\n   （出来事そのもの＝EVENTS は tools/rpgevents.js 側）                   */\n\nconst WALK = {\n  /* 通路を抜けるとき */\n  corridor:\n    '{'\n    +   '{$lightの外は|光の届く先は}、{何も見えない|同じ闇が続くだけだ|形    blocked:\n      '{行き止まりだ|通路は、そこで終わっている|壁が、正面を塞いでいる}。'\n      + '{$lightを端から端まで当ててみたが、継ぎ目ひとつない|'\n      + '$who が壁を叩いた。$soundは、詰まった音だった|'\n      + '地図の上では、この先にまだ空白がある}。',\n    open:\n      '{松明を伏せると|火を落とすと|$lightを消した途端}、'\n      + '{闇の中に、青白い筋が浮かび上がった|'\n      + '床と壁に、$traceが線になって現れた|'\n      + '見えなかった道筋が、ぼんやりと光っている}。'\n      + '{光の下では、確かに何も見えなかった|'\n      + '「明るくしていたから、見えなかったのか」|'\n      + '$hurt が、暗いまま最初の一歩を踏み出した}。',\n    again: '{光る筋は、暗がりでは今も見える|火を落として、その道をたどる|'\n      + '一度たどった道は、暗くても迷わない}。'\n  },\n\n  /* ============ 人数・並び ============ */\n\n  party_alone: {\n    id: 'party_alone', name: '一人ずつ', kind: 'party',\n    gist: '一人ずつでなければ、通れない道があるらしい。',\n    tags: ['made', 'trap', 'loot', 'rival', 'nature', 'wild'], look: 'gap',\n    cond: { t: 'party', shape: 'single' },\n    hint:\n      '{床の$traceは|すり減りかたは}、{一人分の幅しかない|一列に細く続いている|'\n      + '横に並んだ跡がない}。'\n      + '「{束になって来るな|一人ずつ、順に|重さを分けよ}」'\n      + '{$who が、足場の細さを目で測った|'\n      + 'ここは、束になって渡る場所ではない}。',\n    seed: null,\n    blocked:\n      '{一行が揃って踏み出した途端|全員が乗った瞬間|六人分の重みがかかると}、'\n      + '{足元が沈んだ|$soundとともに、床が軋んだ|渡りかけた足場が、大きく傾いだ}。'\n      + '{慌てて戻る|$hurt が引き戻された|このまま行けば、全員落ちる}。',\n    open:\n      '{一人ずつ|順番に|間を空けて}{渡る|進む|足を運ぶ}。'\n      + '{渡り終えた者が、次の一人に$lightを向ける|'\n      + '待つ側は、$soundだけを頼りに向こうを見ている|'\n      + '$who が最後に残って、$hurt を先に行かせた}。'\n      + '{時間はかかったが、誰も落ちなかった|'\n      + '——束でなければ、こんなに簡単なことだった}。',\n    again: '{一人ずつ渡る手順は、もう身についている|順に渡る|'\n      + '間を空けて、次の一人が続く}。'\n  },\n\n  /* ============ 先客との取引 ============ */\n\n  deal_rival: {\n    id: 'deal_rival', name: '先客との取引', kind: 'deal',\n    gist: '先客とは、話がつけられるらしい。',\n    tags: ['rival', 'human', 'loot', 'made'], look: 'door',\n    cond: { t: 'deal', key: 'rival' },\n    hint:\n      '{扉の前の床に|扉のわきに|壁際に}、{焚き火の跡|寝床にした形跡|食い散らかした跡}がある。'\n      + '{ごく最近のものだ|灰は、まだ温かい|'\n      + '$smellが、そこだけ人のものだ}。'\n      + '{誰かが、この扉の前で長く粘っている|'\n      + '——そして、まだ開けられていないらしい|'\n      + '$who が、その灰を指でつついた}。',\n    seed:\n      '{$who2が数人|先客の一団が|腕自慢が三人ほど}、{道を塞ぐように|'\n      + '$lightの向こうに|こちらを見て}{立っている|腰を上げた}。'\n      + '「{そこから先は、俺たちが先だ|寄るな|'\n      + '——待て。お前ら、何を持ってる}」'\n      + '{刃を抜くか、口をきくか|$hurt が、無言で$who を見た|'\n      + '数の上では、こちらが多い}。',\n    npcs: [\n      { look:\n          '松明の輪の向こうで、腕自慢が三人、ゆっくりと腰を上げた。'\n          + '傷の入った革鎧に、使い込まれた得物——同業だ。'\n          + '「そこから先は、俺たちが先だ」。値踏みする目が、こちらの装備を上から下までなぞる。'\n          + '$hurt が、無言で$who を見た。',\n        talk:\n          '睨み合いは、長くは続かなかった。同じ稼業だと知れると、向こうの頭目がふっと笑ったのだ。'\n          + '「先を争って共倒れじゃ、間抜けの上塗りだ」。'\n          + '互いの見立てを交換し、道を分ける段取りで話がついた。別れ際、拳を突き合わせた。' },\n      { look:\n          '部屋の隅で、小さな火が燃えている。白髪の老僧がひとり、静かに湯を沸かしていた。'\n          + 'こちらに気づくと、湯呑みを掲げてみせる。敵意は見えない——'\n          + 'だが、こんな場所にひとりで座っている者が、ただの善人のはずもない。',\n        talk:\n          '湯は、ありがたく馳走になった。だが老僧は抜け目がなかった。'\n          + '「通り賃は、話で払っておくれ」。来た道の様子を細かく聞き取られ、'\n          + '代わりに、この先で足を止めるべき場所をひとつ教えてくれた。損はない。むしろ安いくらいだ。' },\n      { look:\n          '暗がりから、低いうめき声がする。壁に背を預けた男がひとり、脇腹を押さえていた。'\n          + '——だが、その目は濁っていない。うめきながらも、こちらの人数と得物を数えている。',\n        talk:\n          '男は斥候だった。仲間とはぐれ、傷を負い、それでも値踏みだけはやめていなかった。'\n          + '水と乾いた布を分けてやると、男はようやく口を開いた。'\n          + '「この先の連中には、俺の名を出せ」。取引としては、悪くない。' },\n      { look:\n          '砥石の音が、規則正しく響いている。旅装の女がひとり、こちらに目もくれず刃を研いでいた。'\n          + '「邪魔をするな」という背中だ。だが、道はその脇を通るしかない。',\n        talk:\n          '女は刃から目を離さないまま、こちらの話を最後まで聞いた。'\n          + '「通るなら通れ。ただし、奥で会っても互いに知らん顔だ」。'\n          + 'それだけ言うと、また砥石の音に戻った。約束としては、それで十分だった。' },\n      { look:\n          '岩陰に荷車が見える——こんな場所に、行商人がいた。'\n          + '太った男が帳面を繰りながら、こちらへ愛想笑いを向ける。「おや、お客さんだ」。'\n          + '笑顔の割に、護衛らしき影がふたつ、暗がりで身じろぎした。',\n        talk:\n          '男は笑顔のまま、しっかりと商売をした。道の先の「通り方の心得」を、対価を取って売りつけてきたのだ。'\n          + '$who が値切り、最後は互いに笑って手を打った。妙な男だが、嘘は売っていない気がする。' }\n    ],\n    blocked:\n      '{扉は|その戸は}{向こう側から押さえられている|かんぬきが下りている|'\n      + '人の手で塞がれている}。'\n      + '{$soundに混じって、人の声がする|'\n      + '押し合いになれば、こちらも無傷では済まない|'\n      + '$who が、一度手を止めた}。',\n    open:\n      '{話は|取引は|交渉は}{思ったより早くついた|案外あっさりと成立した|'\n      + '互いに、損のない形で落ち着いた}。'\n      + '「{半分でいい|奥のものには手を出すな|先に行け。俺たちは、ここで待つ}」'\n      + '{かんぬきが、向こう側から外された|'\n      + '$who2 が、道を空けてあごで道を示した|'\n      + '$hurt が、通り際に一度だけ振り返った}。',\n    again: '{先客は、もうこちらを止めない|開いた扉をくぐる|'\n      + '$who2 は、こちらを見もしない}。'\n  }\n};\n\n/* 開通後にもう一度そこを通るときの、頭につく一言。\n   again はそれ自体を短く保ちたいので、変化はこちら側で稼ぐ。 */\nconst PASS = '{|$who を先頭に、|列を崩さずに、|$lightをかざしながら、|急ぐでもなく、}';\n\n\n/* 部屋の「中身」。ここが描写・選択肢・地図の唯一の source of truth。\n\n   部屋 = 形（shape）＋ 特徴（features）＋ 出口（exits は座標から方角で導出）\n   ・描写   … 形の文 → 特徴の文 → 出口の文、の順で組む\n   ・選択肢 … 出口（方角つき）と、特徴（調べる）から機械的に作る\n     → 説明に出ていないものが選択肢に並ぶことは、構造的に起きない            */\n\n/* ---------- 形。通り名（キャプション）と描写文 ---------- */\nconst SHAPES = {\n  round: {\n    alias: '{丸い|円形の}{広間|間}',\n    d: '{大きく広がった|柱ひとつない|天井の高い}円形の{広間|間}だ。'\n      + '{壁は緩やかな弧を描き、$lightが端まで届かない|'\n      + '中央に立つと、$soundがぐるりと回って返ってくる|'\n      + '床の$traceが、円の中心に向かって集まっている}。'\n  },\n  big: {\n    alias: '{大きな|広い}{空洞の間|広間}',\n    d: '{思ったより広い|天井の見えない|奥行きのある}{空洞|広間}だ。'\n      + '{灯りの輪が、闇に浮かぶ小さな島のようだ|'\n      + '声を出せば、$soundに混じって返ってきそうだ|'\n      + '壁までの距離が、歩かないと測れない}。'\n  },\n  long: {\n    alias: '{細長い|長い}{間|部屋}',\n    d: '{細長く延びた|奥へ奥へと続く|廊下のように長い}部屋だ。'\n      + '{左右の壁は近く、圧が肌にくる|'\n      + '$lightを掲げても、突き当たりは見えない|'\n      + '$smellが、奥から手前へゆっくり流れてくる}。'\n  },\n  small: {\n    alias: '{狭い|小さな}{部屋|窪み}',\n    d: '{天井の低い|身を屈めたくなる|数歩で横切れる}小部屋だ。'\n      + '{$lightだけで、部屋の全部が見渡せる|'\n      + '六人も入ると、互いの息が聞こえる|'\n      + '$traceが、狭いぶんだけ濃く残っている}。'\n  }\n};\n\n/* ---------- 特徴。描写文と「調べる」の結果 ----------\n   desc … 部屋の描写に混ぜる1文（必ず名詞 noun を含む言い方にする）\n   act  … 選択肢のラベル\n   out  … 調べたときの結果（w は重み）\n     eff: {} / {heal:n} / {dmg:n} / {info:1} / {noise:1}                    */\nconst FEATURES = {\n  statue: {\n    tags: ['made', 'holy', 'relic', 'dragon'], noun: '古い像',\n    desc: '{壁際に|入って正面に|部屋の隅に}、{古い像|石像|人の形をした像}が'\n      + '{ひとつ立っている|傾いだまま残っている}。'\n      + '{歓迎しているのか、何かを護っているのか——表情は削れて読めない|'\n      + '目のあった場所に、窪みだけが残っている|'\n      + '足元だけ、妙にすり減っている}。',\n    descForm: '$fcount体の{石像|像}が、$frows列に{整然と|等間隔に|寸分たがわず}並んでいる。'\n dirの{道|口}は、{固く閉ざされている|塞がれている|何かに護られている}'\n};\n\nconst REVISIT =\n  '{様子は、さっきと変わらない|見覚えのある壁と床だ|空気は動いていない|'\n  + '一度通った部屋だ。足取りは自然と速くなる|$traceの位置さえ、覚えたとおりだ}。'\n  + '{|{$soundが、{まだ続いている|もう止んでいる}|$smellは、覚えたとおりだ|'\n  + '$who が、手早く四隅だけ確かめた|$hurt が、息を整える間だけ足を止めた}。}';\n\n\n/* ダンジョン生成 v2。\n   「解錠の連鎖を先に決めて、区画に部屋を配る」背骨はそのまま、\n   置き方をマス単位の矩形（複数マスの部屋＋長さのある廊下）に拡張した。\n\n   ── 生成の変数（PROFILE）──\n     rooms    部屋数        few(8) / some(14) / many(22) / lots(32)\n     roomSize 部屋の広さ    cramped / standard / spacious\n     corLen   廊下の長さ    compact(1) / normal(1-2) / sprawling(2-4)\n     corWidth 廊下の幅      narrow / wide\n     layout   道の形        straight / forking / balanced / winding\n     shapes   部屋の形      square / irregular / round から1つ以上\n     rough    外周の粗さ    none / light / medium / heavy\n     loops    回廊          few / some / many …行き止まりを減らし、環を作る\n     landmark 大広間        true なら、ひときわ大きい広間を1つ保証する\n\n   ダンジョンごとに「流儀」（既定のPROFILE）を持ち、場所の性格が\n   そのまま地形に出る。ユーザーはどの変数も上書きできる。            */\n\n\n\n\n/* ---------- 乱数 ---------- */\nfunction mulberry32(a) {\n  return function () {\n    a |= 0; a = (a + 0x6D2B79F5) | 0;\n    var t = Math.imul(a ^ (a >>> 15), 1 | a);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\nconst pick = (rnd, a) => a[Math.floor(rnd() * a.length)];\nfunction shuffle(rnd, a) {\n  a = a.slice();\n  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }\n  return a;\n}\n\n/* ---------- 変数の値 ---------- */\nconst ROOMS_N   = { few: 8, some: 14, many: 22, lots: 32 };\nconst COR_LEN   = { compact: [1, 1], normal: [1, 2], sprawling: [2, 4] };\nconst ROUGH_PX  = { none: 0, light: 8, medium: 16, heavy: 26 };\nconst LOOP_R    = { few: 0.05, some: 0.14, many: 0.3 };\n\n/* 部屋の寸法（マス）。[w,h] の候補 */\nconst SIZES = {\n  cramped:  [[2,2],[2,2],[3,2],[2,3]],\n  standard: [[2,2],[3,2],[2,3],[3,3],[4,2]],\n  spacious: [[3,3],[4,3],[3,4],[4,4],[5,3],[5,4]]\n};\nconst ROUN ot.dirIndex; }\n        else { last = pick(rnd, list); }\n      }\n      zoneRooms.push(list);\n\n      /* 回廊 */\n      const wantLoops = Math.round(list.length * LOOP_R[P.loops]);\n      let made = 0;\n      for (let t = 0; t < 40 && made < wantLoops; t++) {\n        if (tryLink(pick(rnd, list), z)) made++;\n      }\n\n      /* 次の区画：関門つきの廊下で */\n      if (z < nZones - 1) {\n        let got = null;\n        for (const from of shuffle(rnd, list)) { got = tryGrow(from, z + 1, null); if (got) break; }\n        if (!got) { share.length = z + 1; truncated = true; break; }\n        got.cor.gate = 'g' + z; got.cor.zone = z;\n        seedRoom = got.room;\n      } else {\n        list[list.length - 1].goal = true;\n      }\n    }\n    if (truncated) {\n      const zl = zoneRooms[zoneRooms.length - 1];\n      zl[zl.length - 1].goal = true;\n    }\n    if (nodes.length >= nRooms * 0.75) break;   /* 十分に育った */\n  }\n\n  /* 大広間：いちばん広い部屋に印（名前と特徴が寄る） */\n  if (P.landmark) {\n    let big = null;\n    nodes.forEach(r => {\n      if (r.entrance || r.goal) return;\n      const area = r.rects.reduce((s2, q) => s2 + q.w * q.h, 0);\n      if (!big || area > big.a) big = { r, a: area };\n    });\n    if (big) big.r.landmark = true;\n  }\n\n  const all = nodes.concat(corridors);\n  const byId = {}; all.forEach(n => { byId[n.id] = n; });\n\n  /* ── 関門 ── */\n  const gates = {};\n  chosen.slice(0, Math.max(0, share.length - 1)).forEach((key, z) => {\n    gates['g' + z] = { id: 'g' + z, key: key.id, cond: key.cond, look: key.look, state: 'shut', zone: z };\n  });\n\n  /* ── ヒントと種：関門より手前の区画にだけ ── */\n  Object.keys(gates).forEach(gid => {\n    const g = gates[gid], key = KEYS[g.key];\n    const before = [];\n    for (let z = 0; z <= g.zone; z++) (zoneRooms[z] || []).forEach(r => { if (!r.entrance && !r.ev) before.push(r); });\n    const bag = shuffle(rnd, before);\n    if (key.hint && bag.length) { const r = bag.pop(); r.ev = { t: 'hint', gate: gid, key: key.id }; }\n    if (key.seed && bag.length) { const r = bag.pop(); r.ev = { t: 'seed', gate: gid, key: key.id }; }\n    if (key.cond.t === 'slay' && bag.length) { const r = bag.pop(); r.ev = { t: 'foe', gate: gid, key: key.id }; }\n  });\n\n  /* ── 形クラス（描写・通り名用）── */\n  nodes.forEach(r => {\n    const area = r.rects.reduce((s2, q) => s2 + q.w * q.h, 0);\n    const asp = Math.max(r.w / r.h, r.h / r.w);\n    r.cls = r.shape === 'round' ? 'round' : (area >= 12 || r.landmark) ? 'big' : asp >= 1.9 ? 'long' : 'small';\n  });\n\n  /* ── 通り名と真名 ── */\n  const usedAlias = {};\n  nodes.forEach(r => {\n    if (r.entrance) { r.alias = '入口の間'; return; }\n    if (r.goal) { r.alias = '最奥の間'; return; }\n    if (r.landmark) { r.alias = '大広間'; return; }\n    for (let t = 0; t < 10; t++) {\n      const a = VARI.expand(SHAPES[r.cls].alias, {}, rnd);\n      if (!usedAlias[a] || t === 9) { usedAlias[a] = 1; r.alias = a; return; }\n    }\n  });\n  const tmpl = dun.tags.map(t => NAME_BY_TAG[t]).filter(Boolean);\n  const usedName = {};\n  const giveName = r => {\n    if (!tmpl.length || r.name) return;\n    for (let t = 0; t < 12; t++) {\n      const nm = VARI.expand(pick(rnd, tmpl), {}, rnd);\n      if (!usedName[nm]) { usedName[nm] = 1; r.name = nm; return; }\n    }\n  };\n  nodes.forEach(r => { if (r.ev) giveName(r); });\n  nodes.forEach(r => { if (!r.ev && !r.entrance && !r.goal && rnd() < 0.25) giveName(r); });\n\n  /* ── 特徴と、部屋の中の配置 ── */\n  const fpool = Object.keys(FEATURES).filter(id =>\n    FEATURES[id].tags.some(t => dun.tags.indexOf(t) >= 0));\n  const fused = {};\n  nodes.forEach(r => {\n    r.features = [];\n    if (r.entrance || !fpool.length) return;\n    const hasAlcove = r.rects.length > 1;\n    let n2 = (r.landmark ? 1 : 0) + (rnd() < 0.5 ? 1 : rnd() < 0.24 ? 2 : 0);\n    if (hasAlcove && n2 < 1) n2 = 1;        /* 窪みのある部屋には、必ず何かがある */\n    const cand = shuffle(rnd, fpool.filter(id => (fused[id] || 0) < 2));\n    for (let i = 0; i < n2 && i < cand.length; i++) {\n      if (r.features.indexOf(cand[i]) >= 0) continue;\n      r.features.push(cand[i]); fused[cand[i]] = (fused[cand[i]] || 0) + 1;\n    }\n  });\n  const SLOTS = [\n    { dx: -0.27, dy: 0.02, w: '西' }, { dx: 0.27, dy: 0.02, w: '東' },\n    { dx: 0, dy: -0.26, w: '北' },   { dx: 0, dy: 0.26, w: '南' }\n  ];\n  nodes.forEach(r => {\n    r.fpos = {};\n    const sl = shuffle(rnd, SLOTS);\n    (r.features || []).forEach((fid, i) => { r.fpos[fid] = sl[i % sl.length]; });\n    /* 窪みがあるなら、最初の特徴はその窪みの側に置く（窪み＝それがある場所） */\n    if (r.rects.length > 1 && r.features.length) {\n      const m = r.rects[0], e = r.rects[1];\n      const excx = e.x + e.w / 2, excy = e.y + e.h / 2;\n      const ddx = excx - r.gx, ddy = excy - r.gy;\n      const slot = Math.abs(ddx) > Math.abs(ddy)\n        ? (ddx > 0 ? { dx: 0.3, dy: 0.02, w: '東' } : { dx: -0.3, dy: 0.02, w: '西' })\n        : (ddy > 0 ? { dx: 0, dy: 0.3, w: '南' } : { dx: 0, dy: -0.3, w: '北' });\n      r.fpos[r.features[0]] = slot;\n      r.alcoveFeat = r.features[0];\n    }\n  });\n\n  /* ── 特徴の規模と隊列（シードと部屋IDから決める。生成の乱数列は乱さない） ── */\n  const fhash = (rid, fid) => {\n    let h = (seed >>> 0) ^ 2166136261;\n    const s2 = rid + ':' + fid;\n    for (let i = 0; i < s2.length; i++) h = Math.imul(h ^ s2.charCodeAt(i), 16777619);\n    h ^= h >>> 15; h = Math.imul(h, 2246822519); h ^= h >>> 13;\n    return (h >>> 0) / 4294967296;\n  };\n  nodes.forEach(r => {\n    r.fmag = {}; r.fform = {};\n    const area = r.w * r.h;\n    (r.features || []).forEach(fid => {\n      const hv = fhash(r.id, fid);\n      if (fid === 'pool' || fid === 'moss' || fid === 'bones') {\n        let mag = hv < 0.4 ? 1 : hv < 0.72 ? 2 : 3;\n        if (area < 6 && mag > 2) mag = 2;   /* ごく狭い部屋に「半分を占める」は置かない */\n        if (area < 6) mag = 1;\n        r.fmag[fid] = mag;\n      } else if (fid === 'statue' && area >= 6 && hv > 0.4) {\n        const forms = [[2, 2], [2, 3], [3, 3], [2, 4]];\n        const f2 = forms[Math.floor(fhash(r.id, 'statue#f') * forms.length)];\n        const rows = Math.min(f2[0], Math.max(1, r.h - 1));\n        const cols = Math.min(f2[1], Math.max(2, r.w - 1));\n        if (rows * cols >= 3) r.fform[fid] = { rows, cols };   /* 3体未満は1体扱い */\n      }\n    });\n  });\n\n  return {\n    seed, dungeon: dun.id, profile: P,\n    rooms: nodes.length, zones: share.length,\n    nodes: all, byId, gates, start: nodes[0].id,\n    goal: (nodes.find(n => n.goal) || nodes[nodes.length - 1]).id,\n    keys: chosen.slice(0, Math.max(0, share.length - 1)).map(k => k.id),\n    grid: G, roughPx: ROUGH_PX[P.rough]\n  };\n}\n\n/* ---------- 検算 ---------- */\nconst FREE = { spare: 1, hurtless: 1, light: 1, party: 1, word: 1 };\nfunction verify(map) {\n  const seen = {}, satisfied = {};\n  let changed = true, steps = 0;\n  const walk = () => {\n    const q = [map.start]; const vis = { [map.start]: 1 };\n    while (q.length) {\n      const n = map.byId[q.shift()];\n      seen[n.id] = 1;\n      for (const lid of n.links) {\n        const l = map.byId[lid];\n        if (!l) continue;\n        if (l.kind === 'corridor' && l.gate && !satisfied[l.gate]) continue;\n        if (!vis[l.id]) { vis[l.id] = 1; q.push(l.id); }\n      }\n    }\n  };\n  while (changed && steps++ < 20) {\n    changed = false;\n    walk();\n    for (const id in seen) {\n      const n = map.byId[id];\n      if (n && n.ev && (n.ev.t === 'seed' || n.ev.t === 'foe') && !satisfied[n.ev.gate]) {\n        satisfied[n.ev.gate] = 1; changed = true;\n      }\n    }\n    for (const gid in map.gates) {\n      if (satisfied[gid]) continue;\n      if (FREE[map.gates[gid].cond.t]) { satisfied[gid] = 1; changed = true; }\n    }\n  }\n  const reachable = !!seen[map.goal];\n  const orphan = map.nodes.filter(n => !seen[n.id]).map(n => n.id);\n  const placed = {};\n  map.nodes.forEach(n => { if (n.ev) placed[n.ev.gate + ':' + n.ev.t] = 1; });\n  const missing = [];\n  for (const gid in map.gates) {\n    const k = KEYS[map.gates[gid].key];\n    if (k.hint && !placed[gid + ':hint']) missing.push(gid + ' のヒント');\n    if (k.seed && !placed[gid + ':seed']) missing.push(gid + ' の種');\n    if (k.cond.t === 'slay' && !placed[gid + ':foe']) missing.push(gid + ' の相手');\n    if (!FREE[k.cond.t] && !k.seed && k.cond.t !== 'slay') missing.push(gid + ' の手立て');\n  }\n  return { ok: reachable && !missing.length, reachable, orphan, satisfied, missing };\n}\n\n\n\n\n/* ================= 状態 ================= */\nvar PARTY = [\n  { n:'聖騎士', hp:14, mx:14, row:0 }, { n:'狂戦士', hp:12, mx:12, row:0 },\n  { n:'槍兵',   hp:11, mx:11, row:0 }, { n:'高僧',   hp:9,  mx:9,  row:1 },\n  { n:'魔法使い', hp:8,  mx:8,  row:1 }, { n:'弓兵',   hp:10, mx:10, row:1 }\n];\nvar S = null;\n\nfunction rnd(){ return Math.random(); }\nfunction ctxOf(dun){\n  var d = DUNGEONS[dun], c = {};\n  for (var k in d.V) (function(k){ c[k] = function(){ return VARI.expand(d.V[k], c, rnd); }; })(k);\n  c.who  = function(){ var a=PARTY.filter(function(p){return p.hp>0;}); return (a[Math.floor(rnd()*a.length)]||PARTY[0]).n; };\n  c.hurt = function(){\n    var a = PARTY.filter(function(p){ return p.hp>0 && p.hp < p.mx; });\n    if (!a.length) a = PARTY.filter(function(p){ return p.hp>0; });\n    return (a[Math.floor(rnd()*a.length)]||PARTY[0]).n;\n  };\n  return c;\n}\nfunction KNUM(v){\n  var K = '〇一二三四五六七八九';\n  if (v <= 9) return K[v];\n  if (v === 10) return '十';\n  return v < 20 ? '十' + K[v - 10] : String(v);\n}\nfunction tidy(s){\n  return s.replace(/([^\\x00-\\x7F]) +/g, '$1').replace(/ +([^\\x00-\\x7F])/g, '$1')\n          .replace(/。+/g, '。').replace(/、。/g, '。');\n}\nfunction narrBox(){ return document.getElementById('narr'); }\nfunction say(t, cls, ctx2){\n  var box = narrBox();\n  var p = document.createElement('p');\n  if (cls) p.className = cls;\n  p.textContent = tidy(VARI.expand(t, ctx2 || S.ctx, rnd));\n  box.appendChild(p);\n  while (box.children.length > 60) box.removeChild(box.firstChild);\n  box.scrollTop = box.scrollHeight;\n  return p;\n}\nfunction caption(txt){\n  var box = narrBox();\n  var p = document.createElement('p');\n  p.className = 'cap';\n  p.textContent = '◆ ' + txt;\n  box.appendChild(p);\n  return p;\n}\n\n/* ================= 場所の名前 ================= */\nfunction labelOf(n){\n  if (n.kind === 'corridor') return '通路';\n  return (n.revealed && n.name) ? n.name : (n.alias || '名の無い部屋');\n}\n\n/* ================= 方角と出口 ================= */\nfunction exitsOf(n){\n  var out = [];\n  n.links.forEach(function(cid){\n    var c = S.map.byId[cid];\n    if (!c) return;\n    if (n.kind === 'corridor'){\n      var f0 = S.map.byId[cid];       /* corridor の links は部屋 */\n      var dx0 = f0.gx - n.gx, dy0 = f0.gy - n.gy;\n      out.push({ via:null, far:f0,\n        dir: Math.abs(dx0) > Math.abs(dy0) ? (dx0 > 0 ? '東' : '西') : (dy0 > 0 ? '南' : '北') });\n    } else {\n      var far = S.map.byId[c.from === n.id ? c.to : c.from];\n      var dx = c.gx - n.gx, dy = c.gy - n.gy;\n      out.push({ via:c, far:far,\n        dir: Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? '東' : '西') : (dy > 0 ? '南' : '北') });\n    }\n  });\n  var ord = { '北':0, '東':1, '西':2, '南':3 };\n  out.sort(function(a,b){ return ord[a.dir] - ord[b.dir]; });\n  return out;\n}\nfunction exitState(e){\n  if (e.via && e.via.gate && !S.open[e.via.gate]) return 'gate';\n  if (S.been[e.far.id]) return 'been';\n  if (S.seen[e.far.id]) return 'seen';\n  return 'unseen';\n}\n\n/* ================= 灯り =================\n   光はマス単位で届く。届いたマスだけが地図に描かれ、\n   その先は闇に呑まれて途切れる（＝部屋の輪郭が先に分かってしまわない）。\n   灯りなし: 2マス ／ 松明: 5マス ／ 魔法使いのトーチ: 9マス（6歩つづく） */\n/* ================= 灯り =================\n   A案：部屋に入る＝一行が松明を掲げてひと巡りする。輪郭は地図に記録される。\n   「いま見えている光」は、立ち位置を中心にした本物の円（縁はやわらかく）。\n   壁と閉ざされた扉の向こうへは光は届かない。\n   灯りなし: 半径1.5マス ／ 松明: 半径3.2マス                          */\nfunction lightRadius(){ return S.torch ? 3.2 : 1.5; }\n\nfunction cellIndex(){\n  if (S.cellIdx) return S.cellIdx;\n  var idx = {};\n  S.map.nodes.forEach(function(n){\n    if (n.kind === 'room') n.rects.forEach(function(q){\n      for (var b2 = q.y; b2 < q.y + q.h; b2++)\n        for (var a2 = q.x; a2 < q.x + q.w; a2++) idx[a2 + ',' + b2] = n;\n    });\n    else n.cells.forEach(function(c){ idx[c[0] + ',' + c[1]] = n; });\n  });\n  S.cellIdx = idx;\n  return idx;\n}\n\nfunction partyCell(){\n  var cur = S.map.byId[S.at];\n  if (cur.kind === 'corridor'){ var mid = cur.cells[cur.cells.length >> 1]; return [mid[0] + 0.5, mid[1] + 0.5]; }\n  return [cur.gx + (S.pos ? S.pos.ox : 0) * cur.w, cur.gy + (S.pos ? S.pos.oy : 0) * cur.h];\n}\n\nfunction reveal(){\n  var idx = cellIndex();\n  var cur = S.map.byId[S.at];\n\n  /* ── いま光が触れている場所（壁ごしには届かない）。描画と語りに使う ── */\n  var pc = partyCell(), pcx = pc[0], pcy = pc[1];\n  var R = lightRadius();\n  var sx = Math.floor(pcx), sy = Math.floor(pcy);\n  S.lightNow = {};\n  var q = [[sx, sy]], vis = {}; vis[sx + ',' + sy] = 1;\n  while (q.length){\n    var it = q.shift(), x = it[0], y = it[1];\n    var n = idx[x + ',' + y];\n    if (!n) continue;\n    S.lightNow[n.id] = 1;\n    S.seen[n.id] = 1;\n    if (n.kind === 'corridor' && n.gate && !S.open[n.gate]) continue;   /* 扉で光は途切れる */\n    [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]].forEach(function(t){\n      var k2 = t[0] + ',' + t[1];\n      if (vis[k2] || !idx[k2]) return;\n      var dx3 = t[0] + 0.5 - pcx, dy3 = t[1] + 0.5 - pcy;\n      if (dx3 * dx3 + dy3 * dy3 > R * R) return;\n      vis[k2] = 1; q.push(t);\n    });\n  }\n\n  /* ── 魔法使いのトーチ：光の精霊が2部屋先まで飛び、輪郭だけを探ってくる ── */\n  if (S.spellLeft > 0){\n    var nq = [[cur.id, 0]], nvis = {}; nvis[cur.id] = 1;\n    while (nq.length){\n      var e2 = nq.shift(), n2 = S.map.byId[e2[0]], d2 = e2[1];\n      S.sensed[n2.id] = 1;\n      n2.links.forEach(function(lid){\n        var l = S.map.byId[lid];\n        if (!l || nvis[l.id]) return;\n        if (l.kind === 'corridor' && l.gate && !S.open[l.gate]){\n          nvis[l.id] = 1; S.sensed[l.id] = 1; return;\n        }\n        var nd = l.kind === 'room' ? d2 + 1 : d2;\n        if (nd > 2) return;\n        nvis[l.id] = 1; nq.push([l.id, nd]);\n      });\n    }\n  }\n}\n\n/* ================= 地図の絵 =================\n   ・踏破した部屋と通路 … 完全な形＋方眼（地図の記憶）\n   ・精霊が探った場所   … 輪郭だけ（うすい床）\n   ・いまの光の円       … 未踏の床が、円の中だけ浮かび上がって縁で闇に溶ける\n   ふだんは現在地まわりの窓表示。タップで全体（＋／－で拡大縮小）。   */\nvar CELL = 40;\nvar CORW = { narrow: 16, wide: 26 };\nvar INK = '#241f14';\nvar VIEW = 13;\nfunction knownFull(n){ return S.been[n.id] || S.sensed[n.id]; }\nfunction drawMap(){\n  var ns = S.map.nodes;\n  var corw = CORW[S.map.profile.corWidth] || 16;\n  var zoomed = document.body.classList.contains('mapzoom');\n  var pc = partyCell(), pcx = pc[0], pcy = pc[1];\n  var R = lightRadius();\n\n  /* 枠：記憶している形＋いまの光の円 */\n  var f = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };\n  var eat = function(x, y){ f.x0 = Math.min(f.x0, x); f.y0 = Math.min(f.y0, y);\n    f.x1 = Math.max(f.x1, x + 1); f.y1 = Math.max(f.y1, y + 1); };\n  ns.forEach(function(n){\n    if (!knownFull(n)) return;\n    if (n.kind === 'room') n.rects.forEach(function(q2){ eat(q2.x, q2.y); eat(q2.x + q2.w - 1, q2.y + q2.h - 1); });\n    else n.cells.forEach(function(c){ eat(c[0], c[1]); });\n  });\n  eat(Math.floor(pcx - R), Math.floor(pcy - R));\n  eat(Math.floor(pcx + R), Math.floor(pcy + R));\n\n  var bx0 = Math.floor(f.x0) - 1, by0 = Math.floor(f.y0) - 1;\n  var bw = Math.ceil(f.x1) - bx0 + 1, bh = Math.ceil(f.y1) - by0 + 1;\n  var side = Math.max(bw, bh);\n  var x0, y0;\n  if (!zoomed && side > VIEW){\n    var cn = S.map.byId[S.at];\n    var ccx = Math.floor(cn.gx), ccy = Math.floor(cn.gy);\n    side = VIEW;\n    x0 = Math.max(bx0, Math.min(ccx - (VIEW >> 1), bx0 + bw - VIEW));\n    y0 = Math.max(by0, Math.min(ccy - (VIEW >> 1), by0 + bh - VIEW));\n  } else {\n    x0 = bx0 - Math.floor((side - bw) / 2);\n    y0 = by0 - Math.floor((side - bh) / 2);\n  }\n  var W = Math.round(side * CELL);\n  var px = function(x){ return (x - x0) * CELL; }, py = function(y){ return (y - y0) * CELL; };\n  var LX = px(pcx), LY = py(pcy), LR = R * CELL;\n\n  var s = '<svg viewBox=\"0 0 ' + W + ' ' + W + '\" role=\"img\" aria-label=\"ダンジョンの地図\">';\n  s += '<defs>'\n    + '<filter id=\"rgh\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">'\n    + '<feTurbulence type=\"fractalNoise\" baseFrequency=\"0.09\" numOctaves=\"2\" seed=\"'\n    + (S.map.seed % 97) + '\" result=\"n\"/>'\n    + '<feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"' + (S.map.roughPx || 0) + '\"/><\/filter>'\n    + '<pattern id=\"gp\" width=\"' + CELL + '\" height=\"' + CELL + '\" patternUnits=\"userSpaceOnUse\">'\n    + '<rect width=\"' + CELL + '\" height=\"' + CELL + '\" fill=\"#f0ead9\"/>'\n    + '<path d=\"M' + CELL + ' 0H0V' + CELL + '\" fill=\"none\" stroke=\"#ccc1a1\" stroke-width=\"1.6\"/><\/pattern>'\n    + '<pattern id=\"dots\" width=\"' + CELL + '\" height=\"' + CELL + '\" patternUnits=\"userSpaceOnUse\">'\n    + '<rect width=\"' + CELL + '\" height=\"' + CELL + '\" fill=\"#e6dfca\"/>'\n    + '<circle cx=\"' + (CELL / 2) + '\" cy=\"' + (CELL / 2) + '\" r=\"1.2\" fill=\"#c7bd9f\"/><\/pattern>'\n    + '<radialGradient id=\"pg\">'\n    + '<stop offset=\"0\" stop-color=\"#c33a2e\" stop-opacity=\"0.5\"/>'\n    + '<stop offset=\"0.7\" stop-color=\"#c33a2e\" stop-opacity=\"0.18\"/>'\n    + '<stop offset=\"1\" stop-color=\"#c33a2e\" stop-opacity=\"0\"/><\/radialGradient>'\n    + '<radialGradient id=\"lg\">'\n    + '<stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"1\"/>'\n    + '<stop offset=\"0.72\" stop-color=\"#fff\" stop-opacity=\"1\"/>'\n    + '<stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"/><\/radialGradient>'\n    + '<mask id=\"lm\"><rect x=\"0\" y=\"0\" width=\"' + W + '\" height=\"' + W + '\" fill=\"#000\"/>'\n    + '<circle cx=\"' + LX + '\" cy=\"' + LY + '\" r=\"' + LR + '\" fill=\"url(#lg)\"/><\/mask>'\n    + '<radialGradient id=\"dkg\">'\n    + '<stop offset=\"0\" stop-color=\"#000\"/>'\n    + '<stop offset=\"0.7\" stop-color=\"#000\"/>'\n    + '<stop offset=\"1\" stop-color=\"#fff\"/><\/radialGradient>'\n    + '<radialGradient id=\"warm\">'\n    + '<stop offset=\"0\" stop-color=\"#ffd98a\" stop-opacity=\"0.28\"/>'\n    + '<stop offset=\"0.75\" stop-color=\"#ffd98a\" stop-opacity=\"0.1\"/>'\n    + '<stop offset=\"1\" stop-color=\"#ffd98a\" stop-opacity=\"0\"/><\/radialGradient>'\n    + '<\/defs>';\n  s += '<rect x=\"0\" y=\"0\" width=\"' + W + '\" height=\"' + W + '\" fill=\"url(#dots)\"/>';\n\n  /* 図形をつくる。known = 記憶（踏破・探知）、spill = いまの光だけで見えている未踏 */\n  var mkPrims = function(filter){\n    var out = [];\n    ns.forEach(function(n){\n      if (!filter(n)) return;\n      if (n.kind === 'room'){\n        if (n.shape === 'round') out.push({ n: n, k: 'c', cx: px(n.gx), cy: py(n.gy), r: n.w * CELL / 2 });\n        else n.rects.forEach(function(q2){\n          out.push({ n: n, k: 'r', x: px(q2.x), y: py(q2.y), w: q2.w * CELL, h: q2.h * CELL });\n        });\n      } else {\n        var xs = n.cells.map(function(c){ return c[0]; }), ys2 = n.cells.map(function(c){ return c[1]; });\n        var mnx = Math.min.apply(null, xs), mxx = Math.max.apply(null, xs);\n        var mny = Math.min.apply(null, ys2), mxy = Math.max.apply(null, ys2);\n        var A2 = S.map.byId[n.from], B2 = S.map.byId[n.to];\n        var dig = function(r2){ return (r2 && r2.shape === 'round') ? CELL * 0.7 : 10; };\n        var e0b, e1b;\n        if (n.horiz){\n          var leftIsFrom = A2 && A2.gx < (B2 ? B2.gx : 1e9);\n          e0b = dig(leftIsFrom ? A2 : B2); e1b = dig(leftIsFrom ? B2 : A2);\n          out.push({ n: n, k: 'r', x: px(mnx) - e0b, y: py(mny) + (CELL - corw) / 2,\n            w: (mxx - mnx + 1) * CELL + e0b + e1b, h: corw, cor: 1 });\n        } else {\n          var topIsFrom = A2 && A2.gy < (B2 ? B2.gy : 1e9);\n          e0b = dig(topIsFrom ? A2 : B2); e1b = dig(topIsFrom ? B2 : A2);\n          out.push({ n: n, k: 'r', x: px(mnx) + (CELL - corw) / 2, y: py(mny) - e0b,\n            w: corw, h: (mxy - mny + 1) * CELL + e0b + e1b, cor: 1 });\n        }\n      }\n    });\n    return out;\n  };\n  var geom = function(p2, grow){\n    grow = grow || 0;\n    return p2.k === 'c'\n      ? '<circle cx=\"' + p2.cx + '\" cy=\"' + p2.cy + '\" r=\"' + (p2.r + grow) + '\"'\n      : '<rect x=\"' + (p2.x - grow) + '\" y=\"' + (p2.y - grow) + '\" width=\"' + (p2.w + grow * 2) + '\" height=\"' + (p2.h + grow * 2) + '\" rx=\"' + (4 + grow) + '\"';\n  };\n\n  var known = mkPrims(function(n){ return knownFull(n); });\n  var spill = mkPrims(function(n){ return !knownFull(n) && S.lightNow && S.lightNow[n.id]; });\n\n  /* 記憶している形：荒れた外周 → 黒壁 → 床 */\n  if (S.map.roughPx){\n    s += '<g filter=\"url(#rgh)\">';\n    known.forEach(function(p2){ s += geom(p2, 12) + ' fill=\"#57503b\" opacity=\"0.85\"/>'; });\n    s += '<\/g>';\n  } else {\n    known.forEach(function(p2){ s += geom(p2, 10) + ' fill=\"#57503b\" opacity=\"0.35\"/>'; });\n  }\n  known.forEach(function(p2){ s += geom(p2, 4) + ' fill=\"' + INK + '\"/>'; });\n  known.forEach(function(p2){\n    s += geom(p2, 0) + ' fill=\"' + (S.been[p2.n.id] ? 'url(#gp)' : '#d8d0b6') + '\"/>';\n  });\n\n  /* いまの光だけで見えている未踏の床：本物の円で切り抜き、縁は闇に溶ける */\n  if (spill.length){\n    s += '<g mask=\"url(#lm)\">';\n    spill.forEach(function(p2){ s += geom(p2, 4) + ' fill=\"' + INK + '\"/>'; });\n    spill.forEach(function(p2){ s += geom(p2, 0) + ' fill=\"#ddd5bc\"/>'; });\n    /* 既知の床を描き直して、通路の端の墨が部屋の中に「蓋」を作らないようにする */\n    known.forEach(function(p2){\n      s += geom(p2, 0) + ' fill=\"' + (S.been[p2.n.id] ? 'url(#gp)' : '#d8d0b6') + '\"/>';\n    });\n    s += '<\/g>';\n  }\n\n  /* 入口：南の壁を外へ開ける */\n  var ent = null;\n  ns.forEach(function(n){ if (n.entrance) ent = n; });\n  if (ent && knownFull(ent)){\n    var m = ent.rects[0];\n    var ox = px(m.x + m.w / 2) - CELL * 0.4, oy = py(m.y + m.h) - 6;\n    s += '<rect x=\"' + ox + '\" y=\"' + oy + '\" width=\"' + (CELL * 0.8) + '\" height=\"' + (CELL * 0.72) + '\" fill=\"'\n      + (S.been[ent.id] ? 'url(#gp)' : '#d8d0b6') + '\"/>'\n      + '<rect x=\"' + (ox - 5) + '\" y=\"' + oy + '\" width=\"5\" height=\"' + (CELL * 0.72) + '\" fill=\"' + INK + '\"/>'\n      + '<rect x=\"' + (ox + CELL * 0.8) + '\" y=\"' + oy + '\" width=\"5\" height=\"' + (CELL * 0.72) + '\" fill=\"' + INK + '\"/>';\n  }\n\n  /* 踏んだ場所の縁：まだ知らない隣を、実際の地図から少しだけ見せる\n     ・踏んだ部屋 → 未知の通路 … 実物の通路を半マスだけ（先はぶった切り。部屋へは食い込まない）\n     ・踏んだ通路 → 未知の部屋 … つながる口のまわりだけチラ見せ（行き止まりに見せない） */\n  var idx2 = cellIndex();\n  var clipN = 0;\n  var dirTo = function(e, node){\n    if ((idx2[(e[0] + 1) + ',' + e[1]] || {}).id === node.id) return 'E';\n    if ((idx2[(e[0] - 1) + ',' + e[1]] || {}).id === node.id) return 'W';\n    if ((idx2[e[0] + ',' + (e[1] + 1)] || {}).id === node.id) return 'S';\n    if ((idx2[e[0] + ',' + (e[1] - 1)] || {}).id === node.id) return 'N';\n    return null;\n  };\n  var endCell = function(c, n){\n    var e0 = c.cells[0], e1 = c.cells[c.cells.length - 1];\n    var d0 = Math.pow(e0[0] + 0.5 - n.gx, 2) + Math.pow(e0[1] + 0.5 - n.gy, 2);\n    var d1 = Math.pow(e1[0] + 0.5 - n.gx, 2) + Math.pow(e1[1] + 0.5 - n.gy, 2);\n    return d0 <= d1 ? e0 : e1;\n  };\n  var wallAt = function(e, nd){\n    return nd === 'E' ? px(e[0] + 1) : nd === 'W' ? px(e[0])\n         : nd === 'S' ? py(e[1] + 1) : py(e[1]);\n  };\n  var latOf = function(e, nd){\n    return (nd === 'E' || nd === 'W')\n      ? py(e[1]) + (CELL - corw) / 2\n      : px(e[0]) + (CELL - corw) / 2;\n  };\n  var rectOf = function(nd, a0, a1, l0, l1){\n    return (nd === 'E' || nd === 'W')\n      ? { x: a0, y: l0, w: a1 - a0, h: l1 - l0 }\n      : { x: l0, y: a0, w: l1 - l0, h: a1 - a0 };\n  };\n  var clipOpen = function(r2){\n    var cid = 'pk' + (clipN++);\n    s += '<clipPath id=\"' + cid + '\"><rect x=\"' + r2.x + '\" y=\"' + r2.y\n      + '\" width=\"' + r2.w + '\" height=\"' + r2.h + '\"/><\/clipPath>'\n      + '<g clip-path=\"url(#' + cid + ')\">';\n  };\n  var prims1 = function(node){ return mkPrims(function(z){ return z.id === node.id; }); };\n  var drawPiece = function(ps, floorFill){\n    if (S.map.roughPx){\n      s += '<g filter=\"url(#rgh)\">';\n      ps.forEach(function(p2){ s += geom(p2, 12) + ' fill=\"#57503b\" opacity=\"0.85\"/>'; });\ + '\" width=\"' + (corw + 16) + '\" height=\"10\" rx=\"3\" fill=\"#a03434\"/>';\n      }\n      return;\n    }\n    if (!S.been[n.id]) return;\n    var cx = px(n.gx), cy = py(n.gy);\n    var icon = '', ic = '';\n    if (n.goal){ icon = '奥'; ic = '#8a6a1a'; }\n    if (icon) s += '<text x=\"' + cx + '\" y=\"' + (cy - 4) + '\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" stroke=\"#efe8d6\" stroke-width=\"3.4\" paint-order=\"stroke\" stroke-linejoin=\"round\" fill=\"' + ic + '\">' + icon + '<\/text>';\n    var nm = labelOf(n);\n    var fpx = Math.min(13, Math.max(8.5, (n.w * CELL - 8) / Math.max(1, nm.length)));\n    if (fpx <= 8.6 && nm.length > 9) nm = nm.slice(0, 9);\n    /* 絵とぶつかるなら、空いている上下へ名前をずらす */\n    var ly = cy + (icon ? 17 : 5);\n    var occ = [];\n    (n.features || []).forEach(function(fid){\n      var fp3 = n.fpos && n.fpos[fid];\n      occ.push({ x: px(n.gx + (fp3 ? fp3.dx : 0) * n.w), y: py(n.gy + (fp3 ? fp3.dy : 0) * n.h) });\n    });\n    if (n.fform && Object.keys(n.fform).length) occ.push({ x: cx, y: cy });\n    var halfW = Math.min(n.w * CELL * 0.45, nm.length * fpx * 0.55);\n    if (occ.some(function(o){ return Math.abs(o.y - ly) < 16 && Math.abs(o.x - cx) < halfW + 10; })){\n      var upBusy = occ.some(function(o){ return o.y < cy - 6; });\n      var dnBusy = occ.some(function(o){ return o.y > cy + 6; });\n      var sh = Math.max(12, n.h * CELL * 0.30);\n      if (!dnBusy) ly = cy + sh + 4;\n      else if (!upBusy) ly = cy - sh + 6;\n    }\n    s += '<text x=\"' + cx + '\" y=\"' + ly + '\" text-anchor=\"middle\" font-size=\"' + fpx.toFixed(1)\n      + '\" font-weight=\"600\" stroke=\"#efe8d6\" stroke-width=\"3.4\" paint-order=\"stroke\" stroke-linejoin=\"round\" fill=\"'\n      + (n.revealed ? '#7a5a12' : '#5a5340') + '\">' + nm + '<\/text>';\n  });\n\n  /* 闇のとばり：円の外は、記録済みの場所も影に沈む（見えているのは円の中だけ）。\n     魔法使いのトーチが灯っている間は、精霊が探った範囲がまるごと明るい（安心の光） */\n  var dkm = '<mask id=\"dk\"><rect x=\"0\" y=\"0\" width=\"' + W + '\" height=\"' + W + '\" fill=\"#fff\"/>'\n    + '<circle cx=\"' + LX + '\" cy=\"' + LY + '\" r=\"' + LR + '\" fill=\"url(#dkg)\"/>';\n  if (S.spellLeft > 0){\n    mkPrims(function(n){ return S.sensed[n.id]; }).forEach(function(p2){\n      dkm += geom(p2, 16) + ' fill=\"#000\"/>';\n    });\n  }\n  dkm += '<\/mask>';\n  s += '<defs>' + dkm + '<\/defs>';\n  s += '<rect x=\"0\" y=\"0\" width=\"' + W + '\" height=\"' + W + '\" fill=\"#241c10\" opacity=\"0.52\" mask=\"url(#dk)\"/>';\n\n  /* 松明のあたたかい輪（トーチの間は輪を出さない）と、パーティの赤点 */\n  if (S.spellLeft <= 0) s += '<circle cx=\"' + LX + '\" cy=\"' + LY + '\" r=\"' + LR + '\" fill=\"url(#warm)\"/>';\n  s += '<circle cx=\"' + LX + '\" cy=\"' + LY + '\" r=\"20\" fill=\"url(#pg)\"/>'\n    + '<circle cx=\"' + LX + '\" cy=\"' + LY + '\" r=\"7\" fill=\"#b5372e\" stroke=\"#f6f1e2\" stroke-width=\"2\"/>';\n  s += '<\/svg>';\n\n  var wrap2 = document.getElementById('mapwrap');\n  wrap2.innerHTML = s + (zoomed\n    ? '<div class=\"mapctl\"><button id=\"mz_in\">＋<\/button><button id=\"mz_out\">－<\/button><button id=\"mz_x\">✕<\/button><\/div>'\n    : '<div class=\"maphint\">タップで全体<\/div>');\n  if (zoomed){\n    var svg = wrap2.querySelector('svg');\n    var base = Math.min(innerWidth * 0.94, innerHeight * 0.88);\n    svg.style.width = Math.round(base * (S.z || 1)) + 'px';\n    svg.style.maxWidth = 'none'; svg.style.maxHeight = 'none';\n    var stop = function(fn){ return function(ev){ ev.stopPropagation(); fn(); }; };\n    wrap2.querySelector('#mz_in').onclick = stop(function(){ S.z = Math.min(4, (S.z || 1) * 1.4); drawMap(); });\n    wrap2.querySelector('#mz_out').onclick = stop(function(){ S.z = Math.max(1, (S.z || 1) / 1.4); drawMap(); });\n    wrap2.querySelector('#mz_x').onclick = stop(function(){ document.body.classList.remove('mapzoom'); S.z = 1; drawMap(); });\n  }\n}\n\n/* ================= 判定 ================= */\nfunction meets(gid){\n  var c = S.map.gates[gid].cond;\n  switch (c.t){\n    case 'carry':    return !!S.bag[c.item];\n    case 'mark':     return (S.marks[c.key]||0) >= c.n;\n    case 'slay':     return !!S.did['slay:'+gid];\n    case 'favor':    return !!S.did['favor:'+gid];\n    case 'offer':    return !!S.bag[c.item];\n    case 'lever':    return !!S.did['lever:'+gid];\n    case 'word':     return !!S.did['word:'+gid];\n    case 'deal':     return !!S.did['deal:'+gid];\n    case 'spare':    return S.kills === 0;\n    case 'hurtless': return S.hurt === 0;\n    case 'light':    return c.state === 'off' ? !S.torch : S.torch;\n    case 'party':    return !!S.did['single:'+gid];\n    default:         return false;\n  }\n}\nvar NEED = {\n  carry:'持ち物が要る', mark:'印が揃っていない', slay:'倒すべき相手がいる',\n  favor:'まだ、誰にも借りを作っていない', offer:'捧げるものがない', lever:'どこかで何かを動かす',\n  word:'言うべき言葉を知らない', deal:'話がついていない', spare:'すでに血を見ている',\n  hurtless:'傷を負っている', light:'灯りの扱いが違う', party:'進みかたが違う'\n};\n\n/* ================= 真名の開示 ================= */\nfunction revealName(n){\n  if (!n || !n.name || n.revealed) return;\n  n.revealed = 1;\n  say('——ここは『' + n.name + '』と呼ばれていた場所らしい。', 'sys');\n}\n\n/* ================= 場面の描写 ================= */\nfunction describeRoom(n, first){\n  var ctx = S.ctx;\n  /* ── 語りの順番 ──\n     ① 部屋の情景　② 部屋の中の特殊な状況（特徴・書きつけ・種）\n     ③ 方角ごとの「その先」の示唆（気になる内容があるときだけ）\n     ④ モンスター・大きな出来事の予感（最後。この先は語らず、選択肢へ落とす） */\n\n  /* ① 情景 */\n  if (first) say(SHAPES[n.cls].d);\n  else say(REVISIT);\n\n  /* ② 部屋の中の特殊な状況 */\n  (n.features||[]).forEach(function(fid){\n    if (S.fx[n.id+':'+fid]) return;\n    if (first){\n      var F2 = FEATURES[fid], tD = F2.desc;\n      var mg = n.fmag && n.fmag[fid];\n      if (mg && F2.descMag && F2.descMag[mg]) tD = F2.descMag[mg];\n      var fm = n.fform && n.fform[fid];\n      if (fm && F2.descForm) tD = F2.descForm;\n      var fpD = n.fpos && n.fpos[fid];\n      say(tD, null, Object.assign({}, S.ctx, {\n        fw: fpD ? fpD.w : '奥',\n        fcount: KNUM(fm ? fm.rows * fm.cols : 1),\n        frows: KNUM(fm ? fm.rows : 1)\n      }));\n    }\n    else if (rnd() < 0.35){\n      var fp2 = n.fpos && n.fpos[fid];\n      say((fp2 ? fp2.w + '側の' : '') + FEATURES[fid].noun +\n        '{は、そのままそこにある|は、変わらずそこにある|が、黙って同じ場所にある|には、まだ手を付けていない}。');\n    }\n  });\n  var pendingFoe = false, seedText = null;\n  if (n.ev && !S.evDone[n.id]){\n    var k2 = KEYS[n.ev.key];\n    if (n.ev.t === 'hint'){\n      /* 自動では読まない。まず「そこに在る」ことだけを描き、\n         読むかどうかはプレイヤーの選択（行動が先、出来事はその結果） */\n      if (first)\n        say('{部屋の一隅に|壁際に|灯りの届く端に}、'\n          + '{何かを記した跡|残された書きつけらしきもの|文字の刻まれた面}がある。'\n          + '{近づけば、確かめられそうだ|読めるかどうかは、寄ってみないと分からない|'\n          + '$who が、それに目を留めた}。');\n      else if (rnd() < 0.4)\n        say('記されたものは、まだ読んでいない。');\n    } else if (n.ev.t === 'seed' && first){\n      if (k2.npcs){\n        if (n.evNpc == null) n.evNpc = Math.floor(rnd() * k2.npcs.length);\n        seedText = k2.npcs[n.evNpc].look;   /* 人物の風貌と様子。話すかどうかは選択肢で */\n      } else seedText = k2.seed;            /* ③のあと、選択肢の直前で語る */\n    } else if (n.ev.t === 'foe' && first){\n      pendingFoe = true;                    /* ④で最後に語る */\n    }\n  }\n\n  /* ③ 方角の示唆。危機が迫っているときは語らない（緊張を切らさない） */\n  if (!pendingFoe){\n    var parts = [];\n    exitsOf(n).forEach(function(e){\n      var st = exitState(e);\n      /* 関門も、前に立つまでは普通の闇として語る（先に特別だと分からせない） */\n      if (st === 'gate'){ if (e.via && S.been[e.via.id]) return; st = 'unseen'; }\n      if (st !== 'unseen') return;\n      var ctx2 = Object.assign({}, S.ctx, { dir: e.dir });\n      parts.push(tidy(VARI.expand(EXIT_TXT.unseen, ctx2, rnd)));\n    });\n    if (parts.length > 2) parts = parts.slice(0, 2);   /* 語りすぎない */\n    if (parts.length){\n      var p = document.createElement('p');\n      p.textContent = parts.join('。') + '。';\n      narrBox().appendChild(p);\n    }\n  }\n\n  /* ③のあと：見つけたもの。選択肢の直前に置き、行動と地続きにする */\n  if (seedText) say(seedText);\n\n  /* ④ 危機。ここで説明を止め、選択肢に落とす */\n  if (pendingFoe){\n    say('{$placeの奥から|部屋の中央に|灯りの輪の縁に}、{ひときわ大きいものが|'\n      + '他とは明らかに違う影が|$lordを思わせる影が}{立ち上がった|こちらを向いた|'\n      + '身を起こした}。{ここを通るなら、これを越えるしかない|'\n      + '避けて通れる位置ではない|$who が、無言で武器を握り直した}。');\n    S.enc = { gate: n.ev.gate, room: n.id };\n  }\n}\n\n/* ================= 部屋に入る ================= */\nfunction enter(id){\n  var n = S.map.byId[id], first = !S.been[id];\n  S.at = id; S.been[id] = 1; S.steps++;\n  if (S.spellLeft > 0){ S.spellLeft--; if (S.spellLeft === 0) say('トーチの光が、静かに消えた。', 'sys'); }\n  S.pos = { ox: 0, oy: 0.24 };\n  S.noise = (!S.enc && rnd() < 0.22) ? 1 : 0;\n  reveal();\n\n  var anchor = null;\n  if (n.kind === 'corridor'){\n    if (n.gate){\n      anchor = caption('関門の前');\n      var gid = n.gate, key = KEYS[S.map.gates[gid].key];\n      if (!S.open[gid]){\n        var bn = S.book.filter(function(b){ return b.gate === gid && !b.used; })[0];\n        if (bn){ bn.used = 1; say('── 帳面の書きつけは、ここのことだ', 'sys'); }\n      }\n      if (S.open[gid]) say(PASS + key.again);\n      else if (meets(gid)){\n        S.open[gid] = 1; say(key.open, 'em');\n        say('── ' + key.name + '：道が通じた', 'sys');\n        reveal();\n      } else {\n        say(key.blocked);\n        say('── ' + NEED[S.map.gates[gid].cond.t], 'bad');\n      }\n    } else {\n      if (first) anchor = caption('通路');\n      say(WALK.corridor);\n    }\n    /* 通路の先も、気になる内容があるときだけ */\n    var parts = [];\n    exitsOf(n).forEach(function(e){\n      if (S.been[e.far.id] || S.seen[e.far.id]) return;\n      var ctx2 = Object.assign({}, S.ctx, { dir: e.dir });\n      parts.push(tidy(VARI.expand(EXIT_TXT.unseen, ctx2, rnd)));\n    });\n    if (parts.length > 2) parts = parts.slice(0, 2);\n    if (parts.length) say(parts.join('。') + '。');\n  } else {\n    if (first){\n      anchor = caption(labelOf(n));\n      if (n.goal){\n        say('{探していたものは、この奥にある|ここが最奥だ|——ここまで来た}。', 'em');\n        var bg = S.book.filter(function(b){ return b.goal && !b.used; })[0];\n        if (bg){ bg.used = 1; say('── 帳面に写した話は、本当だったということだ', 'sys'); }\n        if (RPGQ && !S.qdone){\n          S.qdone = 1;\n          say('奥の間の主は、こちらを待っていた。誰も口をきかないまま、得物が抜かれ——長い戦いの末、それは動かなくなった。', 'em');\n          say('── 依頼達成：' + RPGQ.name + '（主との本式の戦闘は、次の段で入ります）', 'sys');\n        }\n      }\n    }\n    describeRoom(n, first);\n  }\n  /* 物音: 危機と重なるときは立てない。立てたら必ず文で語ってから選択肢に出す */\n  if (S.enc) S.noise = 0;\n  if (S.noise)\n    say('{……どこかで、低い物音がした|……短い音がした。石が転がるような音だ|'\n      + '……何かが動く気配が、壁越しに伝わってきた}。{遠くない|方角の見当は、つく}。');\n  render();\n  if (anchor) narrBox().scrollTop = Math.max(0, anchor.offsetTop - 8);\n}\n\n/* ================= 帳面 =================\n   書き留めたことは、必ずどこかで回収される。 */\nfunction makeNote(){\n  var gids = Object.keys(S.map.gates).filter(function(g){ return !S.open[g]; });\n  var noted = {}; S.book.forEach(function(b){ if (b.gate) noted[b.gate] = 1; });\n  var fresh = gids.filter(function(g){ return !noted[g]; });\n  if (fresh.length){\n    var gid = fresh[Math.floor(rnd() * fresh.length)];\n    var k2 = KEYS[S.map.gates[gid].key];\n    return { t: tidy(VARI.expand(k2.gist || '……読み取れたのは、断片だけだ。', S.ctx, rnd)), gate: gid };\n  }\n  var LORE = [\n    '奥にいる$lordは、ひとつところから動かない——そう読める',\n    'この$placeの最も深いところに、探しものはあるらしい',\n    '「引き返した者だけが、生きて語った」と結ばれている',\n    '書き手は、$lordを見たまま戻らなかったようだ'\n  ];\n  return { t: tidy(VARI.expand(LORE[Math.floor(rnd() * LORE.length)], S.ctx, rnd)) + '。', goal: 1 };\n}\nfunction showBook(){\n  var ov = document.getElementById('bookov');\n  var bd = document.getElementById('bookbody');\n  bd.innerHTML = '';\n  if (!S.book.length){\n    var p0 = document.createElement('p'); p0.className = 'lead';\n    p0.textContent = 'まだ何も書き留めていない。壁画や書きつけを調べると、ここに残る。';\n    bd.appendChild(p0);\n  }\n  S.book.forEach(function(b){\n    var p2 = document.createElement('p');\n    p2.textContent = '・「' + b.t.replace(/。$/, '') + '」' + (b.used ? '　──回収済み' : '');\n    bd.appendChild(p2);\n  });\n  ov.classList.add('on');\n}\n\n/* ================= 特徴を調べる ================= */\nfunction useFeature(n, fid){\n  var f = FEATURES[fid];\n  var firstFx = true;\n  for (var k3 in S.fx){ firstFx = false; break; }\n  S.fx[n.id+':'+fid] = 1;\n  var fp = n.fpos && n.fpos[fid];\n  if (fp){ S.pos = { ox: fp.dx, oy: fp.dy }; reveal(); }\n  /* このダンジョンで最初に調べたものでは、けがはしない */\n  var cand = f.out;\n  if (firstFx){\n    var safe = f.out.filter(function(o){ return !(o.eff && o.eff.dmg); });\n    if (safe.length) cand = safe;\n  }\n  var tot = cand.reduce(function(a,o){ return a+o.w; }, 0);\n  var roll = rnd()*tot, sel = cand[0];\n  for (var i=0;i<cand.length;i++){ roll -= cand[i].w; if (roll <= 0){ sel = cand[i]; break; } }\n  /* 行動 → 結果を、ひとつづきの文で */\n  say((fp ? fp.w + '側の' : '') + (f.echo || '') + sel.t, 'em');\n  var e = sel.eff || {};\n  if (e.heal){\n    var hurt = PARTY.filter(function(p){return p.hp>0 && p.hp<p.mx;})\n      .sort(function(a,b){return (a.hp/a.mx)-(b.hp/b.mx);})[0];\n    if (hurt){ hurt.hp = Math.min(hurt.mx, hurt.hp + e.heal);\n      say('── ' + hurt.n + ' の傷が少し塞がった', 'sys'); }\n  }\n  if (e.dmg){\n    var v = PARTY.filter(function(p){return p.hp>0;});\n    var t2 = v[Math.floor(rnd()*v.length)];\n    t2.hp = Math.max(1, t2.hp - e.dmg); S.hurt++;\n    say('── ' + t2.n + ' が傷を負った', 'bad');\n  }\n  if (e.get){\n    var giveSalve = function(pre){\n      var h2 = PARTY.filter(function(p){ return p.hp>0 && p.hp<p.mx; })\n        .sort(function(a,b){ return (a.hp/a.mx)-(b.hp/b.mx); })[0];\n      if (h2){ h2.hp = Math.min(h2.mx, h2.hp + 2);\n        say('── ' + pre + '傷薬だった。' + h2.n + ' の傷が少し塞がった', 'sys'); }\n      else say('── ' + pre + '傷薬だった。いつか要る。荷の底に収めた', 'sys');\n    };\n    var giveCoin = function(pre){\n      S.loot = (S.loot || 0) + 1;\n      say('── ' + pre + '古い硬貨がひと握り。荷の底に収めた（戦利品 ' + S.loot + '）', 'sys');\n    };\n    if (e.get === 'note'){\n      var nb = makeNote();\n      S.book.push(nb);\n      say('── 帳面に書き留めた：「' + nb.t.replace(/。$/, '') + '」', 'sys');\n    }\n    else if (e.get === 'food'){ S.bag.food = 1; say('── 保存の効く食料を、荷に加えた', 'sys'); }\n    else if (e.get === 'salve') giveSalve('中身は');\n    else if (e.get === 'coin') giveCoin('');\n    else if (e.get === 'pack'){\n      if (rnd() < 0.5) giveSalve('包みを開けた。中身は');\n      else giveCoin('包みを開けた。');\n    }\n  }\n  if (e.noise) S.noise = 1;\n  if (n.ev && n.ev.t !== 'foe') revealName(n);\n  render();\n}\n\n/* ================= 種の行動 ================= */\nfunction seedActs(n){\n  if (!n.ev || n.ev.t !== 'seed' || S.evDone[n.id]) return [];\n  var gid = n.ev.gate, c = S.map.gates[gid].cond, out = [];\n  var k2 = KEYS[n.ev.key];\n  /* 真名の開示は、行動の結果を語り終えてから */\n  var done = function(){ S.evDone[n.id]=1; revealName(n); };\n  if (meets(gid)) return [];\n  if (c.t === 'favor') out.push({ l: k2.actLabel || '手を貸す', k:'借りを作る', f:function(){\n    S.did['favor:'+gid]=1;\n    say('{$who が、黙って手を貸した|時間は食った。それだけのことだ|'+\n      '$hurt が、自分の水を分けた}。{相手は、何も言わなかった|礼らしい礼は、無かった}。','em');\n    done(); } });\n  var NOUN = { key:'鍵', scale:'鱗', tablet:'石板', food:'食料' };\n  var nn = NOUN[c.item];\n  if (c.t === 'carry' || c.t === 'offer') out.push({ l: nn ? nn + 'を、持っていく' : '持っていく', k:'荷が一つ増える', f:function(){\n    S.bag[c.item]=1;\n    say('{$who が、それを荷に収めた|重いが、置いていく気にはならない|'+\n      '使い道は、そのうち分かる}。','em');\n    done(); } });\n  if (c.t === 'mark') out.push({ l: k2.actLabel || '触れる', k:'印 '+((S.marks[c.key]||0)+1)+'/'+c.n, f:function(){\n    S.marks[c.key]=(S.marks[c.key]||0)+1;\n    say('{指先が温かい|$soundが、遠くで一度鳴った|$traceが、$lightを弾いた}。','em');\n    say('── 印 '+S.marks[c.key]+'/'+c.n,'sys');\n    if (S.marks[c.key] >= c.n) done(); else revealName(n); } });\n  if (c.t === 'lever') out.push({ l: k2.actLabel || '動かす', k:'どこかが変わる', f:function(){\n    S.did['lever:'+gid]=1;\n    say('{軋みながら、それは動いた|$placeの奥で、重いものが動く音がした|'+\n      '$soundとは違う音が、長く尾を引いた}。','em');\n    done(); } });\n  if (c.t === 'deal') out.push({ l:'話しかける', k:'刃を抜かない', f:function(){\n    S.did['deal:'+gid]=1;\n    var npc = k2.npcs && n.evNpc != null ? k2.npcs[n.evNpc] : null;\n    say(npc ? npc.talk : '{話は、思ったより早くついた|互いに、損のない形に落ち着いた}。','em');\n    done(); } });\n  return out;\n}\n\n/* 記されたものを読む。読んだ結果として、言葉や真名を得る */\nfunction readHint(n){\n  var k2 = KEYS[n.ev.key];\n  say('{近寄って、灯りを寄せる|膝をついて、指先で埃を払う|$who が身をかがめ、文字をたどる}。——読める。');\n  say(k2.hint);\n  say('── 覚え書きを写した。' + (k2.gist || ''), 'sys');\n  S.book.push({ t: tidy(VARI.expand(k2.gist || '', S.ctx, rnd)), gate: n.ev.gate });\n  S.notes[n.ev.key] = 1; S.evDone[n.id] = 1;\n  if (k2.cond.t === 'word'){\n    S.did['word:'+n.ev.gate] = 1;\n    say('── 書かれていた言葉を覚えた。どこかの扉の前で、唱えられる', 'sys');\n  }\n  revealName(n);\n  render();\n}\n\nfunction encounter(){\n  say('{$soundに混じって|灯りの輪の外れの暗がりで|前方の闇で}、'+\n      '{何かが動いた|こちらを凝視する何かが、身じろぎした|'+\n      '気配がひとつ、ゆっくりと立ち上がった}。{正体は、光の届く前に分かるだろう|'+\n      '人か、そうでないか——まだ分からない|$who が、得物に手を掛けた}。');\n  S.enc = {}; render();\n}\n\n/* ================= 描画 ================= */\nfunction render(){\n  drawMap();\n  var n = S.map.byId[S.at], box = document.getElementById('choices');\n  box.innerHTML = '';\n\n  document.getElementById('spot').textContent = labelOf(n);\n  document.getElementById('pos').textContent =\n    '踏破 ' + Object.keys(S.been).filter(function(k){return S.map.byId[k].kind==='room';}).length +\n    '/' + S.map.nodes.filter(function(x){return x.kind==='room';}).length + ' 室';\n  document.getElementById('kil').textContent = '討 ' + S.kills;\n  document.getElementById('hrt').textContent = '傷 ' + S.hurt;\n  var tc = document.getElementById('tor');\n  tc.textContent = S.torch ? '松明 ON' : '松明 OFF';\n  var bk = document.getElementById('bok');\n  bk.textContent = '帳面 ' + S.book.length;\n  bk.style.cursor = 'pointer';\n  bk.onclick = showBook;\n  document.getElementById('bookx').onclick = function(){ document.getElementById('bookov').classList.remove('on'); };\n  tc.className = 'chip' + (S.torch ? ' on' : '');\n  document.getElementById('party').innerHTML = PARTY.map(function(p){\n    return '<div class=\"pm'+(p.row?' back':'')+'\"><div class=\"n\">'+p.n+'<\/div><div class=\"h\">'+p.hp+'<\/div><\/div>';\n  }).join('');\n\n  var add = function(label, key, cls, fn){\n    var b = document.createElement('button');\n    b.className = 'btn ' + (cls||'');\n    b.innerHTML = label + (key ? '<span class=\"k\">' + key + '<\/span>' : '');\n    b.onclick = fn; box.appendChild(b);\n  };\n\n  if (S.enc){\n    var gid0 = S.enc.gate;\n    add('斬りかかる', gid0 ? '倒せば、道が変わる' : '倒せば、不殺の条件は消える', 'act', function(){\n      S.kills++; if (gid0) S.did['slay:'+gid0] = 1;\n      if (S.enc.room){ S.evDone[S.enc.room]=1; revealName(S.map.byId[S.enc.room]); }\n      S.enc = 0;\n      say('{短い戦いだった|数を頼みに押し切った|$who が、先に動いた}。','em');\n      say('── 倒した数 '+S.kills, 'sys'); render(); });\n    add('やり過ごす', '刃を抜かない', 'act', function(){\n      S.enc = 0;\n      if (rnd()<0.4){ S.hurt++; say('{擦れ違いざま、$hurt が浅く裂かれた|通り抜けたが、無傷とはいかない}。','bad'); }\n      else say('{息を殺して、やり過ごした|向こうは、こちらに関心を示さなかった}。','em');\n      render(); });\n    return;\n  }\n\n  /* 関門の前でだけ出せる行動 */\n  if (n.kind === 'corridor' && n.gate && !S.open[n.gate]){\n    var gc = S.map.gates[n.gate].cond, gid = n.gate;\n    if (gc.t === 'party' && !S.did['single:'+gid])\n      add('一人ずつ渡る', '列を解く', 'act', function(){\n        S.did['single:'+gid] = 1;\n        say('{隊列を解き、間を空けて並んだ|$who が「一人ずつだ」と短く言った}。','em');\n        enter(n.id); });\n    if (gc.t === 'light' && ((gc.state === 'off') === S.torch))\n      add(S.torch ? '火を伏せる' : '松明を掲げる', 'ここでは、灯りの扱いが鍵になる', 'act', function(){\n        S.torch = !S.torch; reveal(); enter(n.id); });\n  }\n\n  if (n.kind === 'room' && n.ev && n.ev.t === 'hint' && !S.evDone[n.id])\n    add('記されたものを確かめる', '読む', 'act', function(){ readHint(n); });\n\n  seedActs(n).forEach(function(a){ add(a.l, a.k, 'act', function(){ a.f(); render(); }); });\n\n  /* 特徴を調べる。描写に出たものだけがここに並ぶ */\n  (n.features||[]).forEach(function(fid){\n    if (S.fx[n.id+':'+fid]) return;\n    var fp = n.fpos && n.fpos[fid];\n    add((fp ? fp.w + '側の' : '') + FEATURES[fid].act, '', 'act', function(){ useFeature(n, fid); });\n  });\n\n  if (RPGQ && S.qdone) add('街へ戻る', '報酬を受け取る', 'act', function(){\n    var coin = (RPGQ.coin || 0) + (S.loot || 0) * 10;\n    try { parent.RPGDONE && parent.RPGDONE({ id: RPGQ.id, cleared: true, coin: coin,\n      loot: S.loot || 0, kills: S.kills, hurt: S.hurt, steps: S.steps }); } catch (e) {}\n  });\n\n  /* 移動。方角＋行き先の様子 */\n  exitsOf(n).forEach(function(e){\n    var shut = e.via && e.via.gate && !S.open[e.via.gate];\n    var note;\n    if (shut && S.been[e.via.id]) note = '閉ざされた道';          /* 一度立って知ったあとだけ */\n    else if (S.been[e.far.id]) note = '来た道——' + labelOf(e.far);\n    else if (S.seen[e.far.id] || (e.via && S.seen[e.via.id])) note = '未踏——床が先へ続いている';\n    else note = '未踏——闇の先';\n    add(e.dir + 'へ進む', note, 'go', function(){ enter(e.via ? e.via.id : e.far.id); });\n  });\n\n  if (S.kills || S.hurt) add('入口まで引き返して、出直す', '敵は生き返る／条件はやり直せる', '', function(){\n    S.kills = 0; S.hurt = 0; S.enc = 0; S.noise = 0;\n    PARTY.forEach(function(p){ p.hp = p.mx; });\n    say('{一行は、いったん外へ出た|来た道を戻り、$placeの外の空気を吸った|'\n      + '$who が「出直す」と言った。誰も反対しなかった}。'\n      + '{戻ってみれば、$traceは新しくなっている|'\n      + '倒したはずのものが、また$soundを立てている|'\n      + '$placeは、こちらを覚えていないらしい}。', 'sys');\n    say('── 討った数と傷は、帳消しになった。開いた道は、開いたまま。', 'sys');\n    enter(S.map.start); });\n\n  add((S.torch ? '松明を伏せる' : '松明を掲げる'), (S.torch ? '光の輪 大 → 小' : '光の輪 小 → 大'), '', function(){\n    S.torch = !S.torch;\n    say(S.torch ? '{松明に火を移した|$lightが、闇を押し戻す}。' : '{火を伏せた|$lightは、足元だけになった}。','sys');\n    reveal(); render(); });\n  if (!S.spellUsed) add('魔法使いのトーチ', '一度だけ・光の精霊が2部屋先まで形を探る（6歩つづく）', '', function(){\n    S.spellLeft = 6; S.spellUsed = 1;\n    say('{魔法使いが短く唱えると、青白い小さな光が指先から離れた|'+\n        '詠唱の終わりに、ちいさな光がふわりと浮いた}。'+\n        '{光は先へ飛び、壁をなぞって、部屋の形だけを知らせてくる|'+\n        '灯りではない。だが、あれが触れた場所の輪郭が、頭に浮かぶ}。','em');\n    reveal(); render(); });\n  else if (S.spellLeft > 0) add('（精霊の光）', 'あと ' + S.spellLeft + ' 歩', '', function(){});\n  if (S.noise) add('物音のする方をうかがう', '遭遇するかもしれない', '', function(){ S.noise = 0; encounter(); });\n}\n\n/* ================= 入口の前 ================= */\nfunction preEntry(){\n  document.getElementById('narr').innerHTML='';\n  var d = DUNGEONS[S.dun];\n  caption(d.name + ' ── 入口の前');\n  say(d.open);\n  say('{口を開けた闇の前に、一行は立った|入口の前で、誰からともなく足が止まった|'\n    + '$smellが、中から流れてくる}。'\n    + '{ここから先は、$lightだけが頼りになる|引き返すなら、いまのうちだ}。');\n  var box = document.getElementById('choices');\n  box.innerHTML = '';\n  var add = function(label, key, cls, fn){\n    var b=document.createElement('button'); b.className='btn '+(cls||'');\n    b.innerHTML=label+(key?'<span class=\"k\">'+key+'<\/span>':''); b.onclick=fn; box.appendChild(b);\n  };\n  add('入る', '', 'act', function(){ enter(S.map.start); });\n  add('装備を整える', 'Phase 2 で追加予定', '', function(){\n    say('（装備は Phase 2 で。いまは身ひとつでもぐる）', 'sys'); });\n  add('引き返す', RPGQ ? '依頼を諦めて街へ戻る' : 'ダンジョン選択へ戻る', '', function(){\n    if (RPGQ){ try { parent.RPGDONE && parent.RPGDONE({ id: RPGQ.id, cleared: false }); } catch (e) {} return; }\n    document.getElementById('setup').style.display='flex'; });\n  drawMap();\n  narrBox().scrollTop = 0;\n}\n\n/* ================= 開始 ================= */\n/* クエストモード：本編アプリの iframe から window.name 経由で依頼を受け取る */\nvar RPGQ = null;\ntry {\n  var _wn = JSON.parse(window.name || 'null');\n  if (_wn && _wn.rpgq) RPGQ = _wn;\n} catch (e) {}\n\nvar SETUP = { dun:'beast', rooms:'few',\n  roomSize:'', corLen:'', corWidth:'', layout:'', shapes:'', rough:'', loops:'' };\n/* 生成の変数。'' は「その場所の流儀」に従う */\nvar VARDEFS = [\n  ['roomSize','部屋の広さ', [['流儀',''],['狭め','cramped'],['標準','standard'],['広め','spacious']]],\n  ['corLen',  '廊下の長さ', [['流儀',''],['短い','compact'],['ふつう','normal'],['長い','sprawling']]],\n  ['corWidth','廊下の幅',   [['流儀',''],['狭い','narrow'],['広い','wide']]],\n  ['layout',  '道の形',     [['流儀',''],['一本道','straight'],['枝分かれ','forking'],['折衷','balanced'],['曲がりくねる','winding']]],\n  ['shapes',  '部屋の形',   [['流儀',''],['四角','square'],['不規則','irregular'],['丸','round'],['混合','mix']]],\n  ['rough',   '外周の粗さ', [['流儀',''],['なし','none'],['弱','light'],['中','medium'],['強','heavy']]],\n  ['loops',   '回廊',       [['流儀',''],['少ない','few'],['そこそこ','some'],['多い','many']]]\n];\nfunction goFullscreen(){\n  try {\n    if (!document.fullscreenElement && document.documentElement.requestFullscreen)\n      document.documentElement.requestFullscreen().catch(function(){});\n  } catch (e) {}\n}\nfunction begin(){\n  goFullscreen();\n  var g = { dungeon: SETUP.dun, rooms: SETUP.rooms };\n  ['roomSize','corLen','corWidth','layout','rough','loops'].forEach(function(k){\n    if (SETUP[k]) g[k] = SETUP[k];\n  });\n  if (SETUP.shapes === 'mix') g.shapes = ['square','irregular','round'];\n  else if (SETUP.shapes) g.shapes = [SETUP.shapes];\n  var map = generate(g);\n  verify(map);\n  S = { map:map, dun:SETUP.dun, at:map.start, been:{}, seen:{}, open:{}, bag:{}, marks:{},\n        did:{}, notes:{}, book:[], fx:{}, evDone:{}, litCells:{}, cellIdx:null, sensed:{},\n        kills:0, hurt:0, steps:0, torch:false, spellLeft:0, spellUsed:0, enc:0, noise:0, z:1,\n        ctx:ctxOf(SETUP.dun) };\n  PARTY.forEach(function(p){ p.hp = p.mx; });\n  document.getElementById('setup').style.display='none';\n  document.getElementById('dun').textContent = DUNGEONS[SETUP.dun].name;\n  document.getElementById('spot').textContent = '入口の前';\n  S.seen[map.start] = 1;\n  preEntry();\n}\nfunction relayout(){ document.body.classList.toggle('land', innerWidth > innerHeight * 1.15); }\naddEventListener('resize', relayout);\n\ndocument.addEventListener('DOMContentLoaded', function(){\n  relayout();\n  if (RPGQ){\n    SETUP.dun = RPGQ.dun || SETUP.dun;\n    SETUP.rooms = RPGQ.rooms || SETUP.rooms;\n    var qcard = document.querySelector('#setup .card');\n    qcard.querySelector('h1').textContent = '依頼：' + RPGQ.name;\n    qcard.querySelector('.lead').textContent = RPGQ.lead + '（報酬：硬貨 ' + RPGQ.coin + ' 枚）';\n    [].forEach.call(qcard.querySelectorAll('h2'), function(h){ h.style.display = 'none'; });\n    [].forEach.call(qcard.querySelectorAll('.dsub'), function(d){ d.style.display = 'none'; });\n    ['dopts','ropts','vwrap'].forEach(function(id){\n      var el = document.getElementById(id); if (el) el.style.display = 'none';\n    });\n    document.getElementById('go').textContent = '依頼を受けて、出立する';\n  }\n  var ds = document.getElementById('dopts'), rs = document.getElementById('ropts');\n  Object.keys(DUNGEONS).forEach(function(k){\n    var b=document.createElement('button'); b.className='opt'+(k===SETUP.dun?' on':'');\n    b.textContent=DUNGEONS[k].name;\n    b.onclick=function(){ SETUP.dun=k; [].forEach.call(ds.children,function(c){c.classList.remove('on');});\n      b.classList.add('on'); document.getElementById('dsub').textContent=DUNGEONS[k].sub+'／'+DUNGEONS[k].open; };\n    ds.appendChild(b);\n  });\n  document.getElementById('dsub').textContent=DUNGEONS[SETUP.dun].sub+'／'+DUNGEONS[SETUP.dun].open;\n  [['序盤','few'],['中盤','some'],['後半','many'],['最奥','lots']].forEach(function(p){\n    var b=document.createElement('button'); b.className='opt'+(p[1]===SETUP.rooms?' on':'');\n    b.textContent=p[0];\n    b.onclick=function(){ SETUP.rooms=p[1]; [].forEach.call(rs.children,function(c){c.classList.remove('on');});\n      b.classList.add('on'); };\n    rs.appendChild(b);\n  });\n  /* 生成の変数 */\n  var vbox = document.getElementById('vopts');\n  VARDEFS.forEach(function(def){\n    var key=def[0], row=document.createElement('div'); row.className='vrow';\n    var lab=document.createElement('div'); lab.className='vlab'; lab.textContent=def[1];\n    var opts=document.createElement('div'); opts.className='opts';\n    def[2].forEach(function(o){\n      var b=document.createElement('button'); b.className='opt'+(SETUP[key]===o[1]?' on':'');\n      b.textContent=o[0];\n      b.onclick=function(){ SETUP[key]=o[1];\n        [].forEach.call(opts.children,function(c){c.classList.remove('on');});\n        b.classList.add('on'); };\n      opts.appendChild(b);\n    });\n    row.appendChild(lab); row.appendChild(opts); vbox.appendChild(row);\n  });\n  document.getElementById('vtog').onclick=function(){\n    var v=document.getElementById('vwrap');\n    v.style.display = v.style.display==='none' ? 'block' : 'none';\n  };\n  /* 地図をタップで拡大 */\n  document.getElementById('mapwrap').addEventListener('click', function(ev){\n    if (ev.target && /^mz_/.test(ev.target.id || '')) return;\n    document.body.classList.toggle('mapzoom');\n    if (S) { S.z = 1; drawMap(); }\n  });\n  document.getElementById('go').onclick=begin;\n});\n\n<\/script>\n\n<\/body>\n<\/html>\n";
</script>
<script>
/* =========================================================

(function () {
  'use strict';
  var E = CB, AI = CBAI, ART = CBART, SAVE = CBSAVE;

  var VERSION = (function () {
    var m = document.querySelector('meta[name="app-version"]');
